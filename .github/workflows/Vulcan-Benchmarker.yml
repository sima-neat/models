name: Vulcan Benchmarker

run-name: Benchmarker (${{ inputs.environment || 'staging' }}) - ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - ".github/workflows/Vulcan-Benchmarker.yml"
      - "packaging/benchmarker/**"
      - "schemas/performance-*-v1.schema.json"
      - "scripts/build_benchmarker_vulcan_package.sh"
      - "tools/runtime/benchmarker.py"
      - "tests/unit/test_benchmarker.py"
      - "tests/unit/test_benchmarker_package.py"
      - "tests/unit/test_benchmarker_workflow.py"
      - "pyproject.toml"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/Vulcan-Benchmarker.yml"
      - "packaging/benchmarker/**"
      - "schemas/performance-*-v1.schema.json"
      - "scripts/build_benchmarker_vulcan_package.sh"
      - "tools/runtime/benchmarker.py"
      - "tests/unit/test_benchmarker.py"
      - "tests/unit/test_benchmarker_package.py"
      - "tests/unit/test_benchmarker_workflow.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment used for package publication
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: benchmarker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SIMA_CLI_CHECK_FOR_UPDATE: "0"

jobs:
  resolve-vulcan-config:
    name: Resolve Vulcan Config
    if: ${{ github.event_name != 'pull_request' }}
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment || 'staging' }}

  build:
    name: Build Benchmarker Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and test tooling
        run: python -m pip install -e '.[dev]'

      - name: Install sima-cli
        run: |
          set -euo pipefail
          curl -fsSL https://docs.sima.ai/_static/tools/sima-cli-installer.sh | bash
          sima_cli="${HOME}/.sima-cli/.venv/bin/sima-cli"
          "${sima_cli}" packages build --help >/dev/null
          echo "SIMA_CLI_BIN=${sima_cli}" >> "${GITHUB_ENV}"

      - name: Test benchmarker contracts
        run: |
          python -m pytest \
            tests/unit/test_benchmarker.py \
            tests/unit/test_benchmarker_package.py \
            tests/unit/test_benchmarker_workflow.py \
            tests/unit/test_docs.py

      - name: Build wheel and Vulcan metadata
        run: scripts/build_benchmarker_vulcan_package.sh

      - name: Verify wheel installation
        run: |
          set -euo pipefail
          wheel="$(find dist/benchmarker -maxdepth 1 -type f -name 'sima_neat_benchmarker-*.whl' -print -quit)"
          test -n "${wheel}"
          python -m venv "${RUNNER_TEMP}/benchmarker-smoke"
          "${RUNNER_TEMP}/benchmarker-smoke/bin/python" -m pip install --no-deps "${wheel}"
          "${RUNNER_TEMP}/benchmarker-smoke/bin/benchmarker" --version
          python -m json.tool dist/benchmarker/metadata.json >/dev/null
          python -m json.tool dist/benchmarker/dependencies.json >/dev/null

      - name: Upload package payload
        uses: actions/upload-artifact@v7
        with:
          name: benchmarker-dist
          path: dist/benchmarker/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish Benchmarker to Vulcan
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - resolve-vulcan-config
      - build
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-vulcan-config.outputs.artifact_cloudfront_distribution_id }}
      artifact_namespace: models-utils
      artifact_folder: benchmarker
      artifact_pattern: benchmarker-dist
      artifact_glob: "*"
      min_artifact_count: 6

  promote-latest:
    name: Promote Benchmarker latest tag
    if: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}
    needs:
      - resolve-vulcan-config
      - publish
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      artifact_namespace: models-utils
      artifact_folder: benchmarker
