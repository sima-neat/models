name: Vulcan Model Benchmarking
run-name: Benchmarking (${{ inputs.model_id }}/${{ inputs.compile_invocation_id }}, ${{ inputs.build_profile_id }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment used to benchmark the compiled model
        required: true
        default: staging
        type: choice
        options: [staging]
      source_run_id:
        description: Source workflow run containing the compiled-model artifact
        required: false
        default: ""
        type: string
      source_sha:
        description: Source revision used to compile the model
        required: true
        type: string
      model_id:
        description: Model ID to benchmark
        required: true
        type: string
      build_profile_id:
        description: Build profile ID to benchmark
        required: true
        type: string
      compile_invocation_id:
        description: Compile invocation that produced the components
        required: true
        type: string
      component_ids:
        description: Comma-separated component IDs to benchmark in order
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-benchmark-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_run_id }}-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
  cancel-in-progress: false

jobs:
  stage-dispatched-benchmark:
    name: Stage ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) benchmark input
    needs: resolve-dispatched-benchmark-config
    if: >-
      inputs.environment == 'staging' &&
      inputs.source_sha != '' &&
      inputs.model_id != '' && inputs.build_profile_id != '' &&
      inputs.compile_invocation_id != '' && inputs.component_ids != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Verify the source run and compiled artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          set -euo pipefail
          [[ "$MODEL_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$BUILD_PROFILE_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$COMPILE_INVOCATION_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          (( ${#components[@]} > 0 ))
          for component in "${components[@]}"; do
            [[ "$component" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          done
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "attempt=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch")' \
            <<< "$run_json" >/dev/null
          echo "branch=$(jq -er '.head_branch' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -er '.run_attempt | tostring' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          artifact_name="compiled-model-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID"
          artifact_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
              jq --arg artifact "$artifact_name" \
                '[.artifacts[] | select(.name == $artifact and (.expired | not))] | length'
          )"
          test "$artifact_count" = "1"

      - name: Download this compiled model from its source run
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: compiled-model-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Check out the trusted source revision for registry tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _registry_source

      - name: Set up registry publication tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _registry_source/pyproject.toml

      - name: Install registry publication tooling
        run: python -m pip install ./_registry_source

      - name: Restore the current immutable compilation from the registry
        if: inputs.source_run_id == ''
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL is required}"
          model-registry stage-registry-build \
            --repository _registry_source \
            --output-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --branch "$SOURCE_BRANCH" \
            --catalog-revision "${{ inputs.source_sha }}" \
            --model-id "${{ inputs.model_id }}" \
            --build-profile-id "${{ inputs.build_profile_id }}" \
            --compile-invocation-id "${{ inputs.compile_invocation_id }}"

      - name: Check whether the compilation is already registered
        id: publication
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for component in "${components[@]}"; do
            publication="_compiled/$MODEL_ID/$BUILD_PROFILE_ID/$component/registry-publication.json"
            [[ -f "$publication" ]] || { echo "required=true" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "required=false" >> "$GITHUB_OUTPUT"

      - name: Verify the dispatched component set
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          python - "$MODEL_ID" "$BUILD_PROFILE_ID" "$COMPILE_INVOCATION_ID" "$COMPONENT_IDS" <<'PY'
          import pathlib
          import sys

          from model_registry.benchmark_manifest import validate_benchmark_components

          model_id, profile_id, invocation_id, raw_components = sys.argv[1:]
          validate_benchmark_components(
              pathlib.Path("_registry_source"), pathlib.Path("_compiled"),
              model_id, profile_id, invocation_id, raw_components.split(","),
          )
          PY

      - name: Configure artifact-registry publisher credentials
        if: steps.publication.outputs.required == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Register an unpublished compilation for benchmarking
        if: inputs.source_run_id != '' && steps.publication.outputs.required == 'true'
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish \
            --repository _registry_source \
            --dist-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment staging \
            --branch "$SOURCE_BRANCH" \
            --git-sha "$SOURCE_SHA" \
            --github-run-id "$SOURCE_RUN_ID" \
            --github-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"

      - name: Retain benchmark input independently of compile-run cleanup
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          if-no-files-found: error
          retention-days: 1

  resolve-dispatched-benchmark-runner:
    name: Resolve dispatched benchmark DevKit runner
    if: inputs.environment == 'staging'
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  resolve-dispatched-benchmark-config:
    name: Resolve dispatched benchmark Vulcan config
    if: inputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment }}
    secrets: inherit

  benchmark-dispatched-model:
    name: Benchmark ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) on DevKit
    needs: [stage-dispatched-benchmark, resolve-dispatched-benchmark-runner]
    if: inputs.environment == 'staging'
    runs-on:
      group: ${{ needs.resolve-dispatched-benchmark-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix, "vulcan-${{ inputs.environment }}"]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      MODEL_ID: ${{ inputs.model_id }}
      BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
      COMPONENT_IDS: ${{ inputs.component_ids }}
      SOURCE_BRANCH: ${{ needs.stage-dispatched-benchmark.outputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download the staged compiled model output
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled

      - name: Install registry tooling in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/model-registry-tools"
          "$RUNNER_TEMP/model-registry-tools/bin/python" -m pip install .
          echo "REGISTRY_PYTHON=$RUNNER_TEMP/model-registry-tools/bin/python" >> "$GITHUB_ENV"

      - name: Resolve and verify benchmark runtime
        run: |
          set -euo pipefail
          runtime="$("$REGISTRY_PYTHON" -m model_registry resolve-benchmark-runtime --repository .)"
          platform_version="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["devkit"]["platform_version"])' <<< "$runtime")"
          platform_build="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["devkit"]["build"])' <<< "$runtime")"
          neat_version="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["neat_core"]["version"])' <<< "$runtime")"
          actual_platform="$(
            awk -F= '
              /^[[:space:]]*DISTRO_VERSION[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' /etc/buildinfo
          )"
          if [[ -z "$actual_platform" ]]; then
            echo "Could not read DISTRO_VERSION from /etc/buildinfo" >&2
            exit 1
          fi
          if [[ "$actual_platform" != "$platform_version" ]]; then
            echo "DevKit platform mismatch: expected $platform_version, found $actual_platform" >&2
            exit 1
          fi
          if ! grep -Eq "(^|[^[:alnum:]])B?${platform_build#B}([^[:alnum:]]|$)" /etc/buildinfo; then
            echo "DevKit build mismatch: expected $platform_build." >&2
            exit 1
          fi
          echo "Verified DevKit platform $actual_platform, build $platform_build."
          echo "BENCHMARK_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "NEAT_VERSION=$neat_version" >> "$GITHUB_ENV"

      - name: Install pinned Neat Core
        run: |
          set -euo pipefail
          target="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["neat_core"]["install_target"])' <<< "$BENCHMARK_RUNTIME")"
          sima-cli neat install --env production "$target"
          "$HOME/pyneat/bin/python" -c 'import pyneat, os; print("Core:", pyneat.__version__, pyneat.__file__); assert pyneat.__version__.split("+", 1)[0] == os.environ["NEAT_VERSION"]'
          dpkg-query -W '*neat*'

      - name: Generate manifest and run benchmark
        run: |
          set -euo pipefail
          SIMA_PLATFORM_VERSION="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["devkit"]["platform_version"])' <<< "$BENCHMARK_RUNTIME")"
          export SIMA_PLATFORM_VERSION
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for component in "${components[@]}"; do
            output="_benchmark/$component"
            mkdir -p "$output"
            "$REGISTRY_PYTHON" -m model_registry make-benchmark-manifest \
              --repository . \
              --compiled-dir _compiled \
              --output "$output/performance-test.json" \
              --branch "$GITHUB_REF_NAME" \
              --git-sha "$SOURCE_SHA" \
              --model "$MODEL_ID" \
              --build-profile "$BUILD_PROFILE_ID" \
              --component "$component"
            set -o pipefail
            archive="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(open(sys.argv[1]))["model"]["path"])' "$output/performance-test.json")"
            "$HOME/pyneat/bin/python" "models/$MODEL_ID/tests/benchmark.py" \
              "$archive" "$output/core-benchmark.json" \
              2>&1 | tee "$output/benchmark.log"
            "$REGISTRY_PYTHON" -m model_registry import-core-benchmark \
              --manifest "$output/performance-test.json" \
              --report "$output/core-benchmark.json" \
              --schema schemas/performance-result-v5.schema.json \
              --output "$output/performance-result-v5.json"
          done

      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: |
            _benchmark/*/performance-result-v5.json
            _benchmark/*/core-benchmark.json
            _benchmark/*/performance-test.json
            _benchmark/*/benchmark.log
          if-no-files-found: error
          retention-days: 14

  publish-dispatched-benchmark:
    name: Publish ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) benchmarks to Vulcan
    needs: [benchmark-dispatched-model, resolve-dispatched-benchmark-config]
    if: >-
      always() &&
      needs.benchmark-dispatched-model.result == 'success' &&
      needs.resolve-dispatched-benchmark-config.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Publication tooling must come from the trusted workflow revision.
          # The older source SHA remains the benchmark's provenance below.
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: actions/download-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _benchmarks
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish every completed schema-v5 result and log
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          set -euo pipefail
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          model-registry validate-benchmark-set \
            --repository . \
            --result-root _benchmarks \
            --model-id "${{ inputs.model_id }}" \
            --build-profile-id "${{ inputs.build_profile_id }}" \
            --components "$COMPONENT_IDS" \
            --git-sha "$SOURCE_SHA"
          results=()
          for component in "${components[@]}"; do
            result="_benchmarks/$component/performance-result-v5.json"
            test -f "$result"
            test -f "_benchmarks/$component/benchmark.log"
            results+=("$result")
          done
          actual_count="$(find _benchmarks -type f -name performance-result-v5.json -print | wc -l | tr -d ' ')"
          (( actual_count == ${#components[@]} )) || {
            echo "Expected ${#components[@]} benchmark results, found $actual_count" >&2
            exit 1
          }
          for result in "${results[@]}"; do
            log="$(dirname "$result")/benchmark.log"
            model-registry publish-benchmark \
              --result "$result" \
              --log "$log" \
              --schema schemas/performance-result-v5.schema.json \
              --api-url "$REGISTRY_API_URL" \
              --aws-region "$AWS_REGION" \
              --bucket "$ARTIFACT_BUCKET" \
              --kms-key-id "$KMS_KEY_ID" \
              --environment staging \
              --branch "$GITHUB_REF_NAME" \
              --git-sha "$SOURCE_SHA" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  cleanup-dispatched-benchmark-artifacts:
    name: Clean up dispatched benchmark artifacts
    needs: publish-dispatched-benchmark
    if: always() && needs.publish-dispatched-benchmark.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete benchmark input and evidence from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"benchmark-input-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID\" or .name == \"benchmark-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID\") | .id" |
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
