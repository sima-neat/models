name: Vulcan Model Compile

on:
  pull_request:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  push:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment whose Model Compiler runner and artifact bucket are used
        required: true
        default: staging
        type: choice
        options: [staging, production]
      models:
        description: Comma-separated model IDs; leave empty to build the entire catalog
        required: false
        type: string
      variants:
        description: Comma-separated variant IDs within selected models; leave empty to build every variant
        required: false
        type: string
      base_branch:
        description: Optional base branch for changed-model selection and artifact inheritance
        required: false
        type: string
      operation:
        description: Internal workflow mode; benchmark is dispatched by a completed compile leg
        required: true
        default: compile
        type: choice
        options: [compile, benchmark]
      source_run_id:
        description: Internal source workflow run containing the compiled-model artifact
        required: false
        type: string
      source_sha:
        description: Internal source revision used to compile the model
        required: false
        type: string
      model_id:
        description: Internal model ID for a dispatched benchmark
        required: false
        type: string
      variant_id:
        description: Internal variant ID for a dispatched benchmark
        required: false
        type: string
      accuracy_samples:
        description: Validation samples for dataset-backed variants (500 smoke, 5000 qualification)
        required: true
        default: "500"
        type: choice
        options: ["500", "5000"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-compile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'staging' }}-${{ inputs.operation || 'compile' }}-${{ inputs.model_id || 'catalog' }}-${{ inputs.variant_id || 'all' }}
  cancel-in-progress: false

jobs:
  select:
    name: Select model variants
    if: inputs.operation != 'benchmark'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      vulcan_environment: ${{ steps.environment.outputs.vulcan_environment }}
      runner_environment: ${{ steps.environment.outputs.runner_environment }}
      model_compiler_version: ${{ steps.compiler.outputs.version }}
      model_compiler_label: ${{ steps.compiler.outputs.label }}
      publishable: ${{ steps.matrix.outputs.publishable }}
      base_branch: ${{ steps.base.outputs.base_branch }}
      previous_found: ${{ steps.previous.outputs.found }}
      previous_source_branch: ${{ steps.previous.outputs.source_branch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Validate complete model catalog and taxonomy
        run: model-registry validate-catalog --repository .

      - name: Resolve Vulcan environment
        id: environment
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          environment="${REQUESTED_ENVIRONMENT:-staging}"
          case "$environment" in
            staging) runner_environment="vulcan-stg" ;;
            production) runner_environment="vulcan-production" ;;
            *) echo "Unsupported environment: $environment" >&2; exit 2 ;;
          esac
          echo "vulcan_environment=$environment" >> "$GITHUB_OUTPUT"
          echo "runner_environment=$runner_environment" >> "$GITHUB_OUTPUT"

      - name: Resolve Model Compiler dependency
        id: compiler
        run: |
          set -euo pipefail
          resolution="$(model-registry resolve-compiler --repository .)"
          version="$(jq -er '.version' <<< "$resolution")"
          label="$(jq -er '.label' <<< "$resolution")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Model Compiler dependency: \`$version\` (\`$label\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve branch comparison base
        id: base
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: develop
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREFERRED_BRANCH: ${{ inputs.base_branch || github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          preferred_args=()
          if [[ -n "${PREFERRED_BRANCH:-}" ]]; then
            preferred_args=(--preferred-branch "$PREFERRED_BRANCH")
          fi
          resolution="$(model-registry resolve-base \
            --repository . \
            --current-branch "$CURRENT_BRANCH" \
            --head "$HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            "${preferred_args[@]}")"
          base_branch="$(jq -er '.base_branch' <<< "$resolution")"
          merge_base="$(jq -er '.merge_base' <<< "$resolution")"
          comparison_base="$merge_base"
          if [[ "${EVENT_BEFORE:-}" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$EVENT_BEFORE" =~ ^0+$ ]] && \
             git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            comparison_base="$EVENT_BEFORE"
          fi
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "comparison_base=$comparison_base" >> "$GITHUB_OUTPUT"
          echo "Resolved base branch: \`$base_branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: \`$comparison_base..$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve immutable previous model catalog
        id: previous
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          FALLBACK_BRANCH: ${{ steps.base.outputs.base_branch }}
          VULCAN_ENVIRONMENT: ${{ steps.environment.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          result="$(model-registry fetch-previous \
            --environment "$VULCAN_ENVIRONMENT" \
            --branch "$CURRENT_BRANCH" \
            --fallback-branch "$FALLBACK_BRANCH" \
            --output-file previous-latest.json \
            --json)"
          found="$(jq -er '.found' <<< "$result")"
          source_branch="$(jq -r '.source_branch // ""' <<< "$result")"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          if [[ "$found" == "true" ]]; then
            catalog_tag="$(jq -er '.catalog_tag' previous-latest.json)"
            echo "Previous catalog: \`$source_branch@$catalog_tag\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Previous catalog: none (bootstrap build)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pin previous catalog for the packaging job
        if: github.event_name != 'pull_request' && steps.previous.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: previous-model-index
          path: previous-latest.json
          if-no-files-found: error
          retention-days: 1

      - name: Build deterministic matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODELS: ${{ inputs.models }}
          REQUESTED_VARIANTS: ${{ inputs.variants }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPARISON_BASE: ${{ steps.base.outputs.comparison_base }}
          COMPILER_VERSION: ${{ steps.compiler.outputs.version }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            variant_args=()
            if [[ -n "${REQUESTED_VARIANTS:-}" ]]; then
              variant_args=(--variants "$REQUESTED_VARIANTS")
            fi
            if [[ -n "${REQUESTED_MODELS:-}" ]]; then
              matrix="$(model-registry matrix --repository . --models "$REQUESTED_MODELS" \
                --compiler-version "$COMPILER_VERSION" "${variant_args[@]}")"
            else
              matrix="$(model-registry matrix --repository . --all \
                --compiler-version "$COMPILER_VERSION" "${variant_args[@]}")"
            fi
          else
            reuse_args=(--compiler-version "$COMPILER_VERSION")
            if [[ "$PREVIOUS_FOUND" == "true" ]]; then
              reuse_args+=(--previous-index previous-latest.json)
            fi
            matrix="$(model-registry matrix --repository . \
              --base "$COMPARISON_BASE" --head "$HEAD_SHA" "${reuse_args[@]}")"
          fi
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          publishable=true
          if [[ -n "${REQUESTED_VARIANTS:-}" ]]; then
            publishable=false
            echo "Targeted variant dispatch is compile-only; catalog publication is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
          echo "Selected $count model variant(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain pull-request safety boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull requests perform model discovery and metadata validation only." >> "$GITHUB_STEP_SUMMARY"
          echo "Untrusted pull-request code is never scheduled on a Vulcan self-hosted runner." >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Compile ${{ matrix.model_id }} (${{ matrix.variant_id }})
    needs: [select, resolve-vulcan-config]
    if: github.event_name != 'pull_request' && needs.select.outputs.count != '0'
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on:
      - self-hosted
      - linux
      - arm64
      - ${{ needs.select.outputs.runner_environment }}
      - model-compiler
      - ${{ needs.select.outputs.model_compiler_label }}
      - default
    timeout-minutes: 90
    env:
      MODEL_COMPILER_PYTHON: /mnt/model-compiler/bin/python
      MODEL_ID: ${{ matrix.model_id }}
      MODEL_DIR: ${{ matrix.model_dir }}
      VARIANT_ID: ${{ matrix.variant_id }}
      RECIPE: ${{ matrix.recipe }}
      EXPECTED_COMPILER_VERSION: ${{ needs.select.outputs.model_compiler_version }}
      MODEL_COMPILER_LABEL: ${{ needs.select.outputs.model_compiler_label }}
      BUILD_FINGERPRINT: ${{ matrix.build_fingerprint }}
      ACCURACY_SAMPLES: ${{ inputs.accuracy_samples || '500' }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Prepare isolated output location
        run: |
          echo "ARTIFACT_ROOT=$RUNNER_TEMP/model-registry-output" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$RUNNER_TEMP/model-registry-output/$MODEL_ID/$VARIANT_ID" >> "$GITHUB_ENV"

      - name: Verify the pinned Model Compiler environment
        run: |
          set -euo pipefail
          test -x "$MODEL_COMPILER_PYTHON"
          "$MODEL_COMPILER_PYTHON" - "$EXPECTED_COMPILER_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path("/etc/vulcan/model-compiler-artifact.json").read_text())
          expected = sys.argv[1]
          actual = metadata.get("version")
          if actual != expected:
              raise SystemExit(f"Model Compiler version mismatch: expected {expected}, found {actual}")
          print(json.dumps(metadata, sort_keys=True))
          PY

      - name: Install shared registry tooling outside the read-only compiler image
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/model-registry-tools"
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check --no-deps --target "$tooling" .
          "$MODEL_COMPILER_PYTHON" -c 'import certifi, jsonschema, yaml'
          echo "PYTHONPATH=$tooling" >> "$GITHUB_ENV"

      - name: Fetch and verify the immutable model source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/source.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch "$MODEL_DIR" --json > "$result"
          source_path="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$result")"
          source_sha256="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$result")"
          echo "path=$source_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify the immutable calibration input
        id: calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/calibration.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch-calibration "$MODEL_DIR" \
            --variant "$VARIANT_ID" --cache-dir "$RUNNER_TEMP/calibration" --json > "$result"
          calibration_path="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("path", ""))' "$result")"
          calibration_sha256="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("sha256", ""))' "$result")"
          calibration_kind="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("kind", "none"))' "$result")"
          echo "path=$calibration_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$calibration_sha256" >> "$GITHUB_OUTPUT"
          echo "kind=$calibration_kind" >> "$GITHUB_OUTPUT"

      - name: Run model-specific surgery and compilation recipe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          CALIBRATION_PATH: ${{ steps.calibration.outputs.path }}
          CALIBRATION_KIND: ${{ steps.calibration.outputs.kind }}
        run: |
          set -euo pipefail
          test -f "$MODEL_DIR/$RECIPE"
          bash --noprofile --norc <<'BASH'
          set -euo pipefail
          source /etc/profile.d/vulcan-model-compiler.sh
          type activate-model-compiler
          activate-model-compiler
          command -v mla-masm
          dataset_args=()
          if [[ "$CALIBRATION_KIND" == "dataset" ]]; then
            dataset_args=(--dataset "$CALIBRATION_PATH")
          fi
          python "$MODEL_DIR/$RECIPE" \
            --model "$SOURCE_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --variant "$VARIANT_ID" \
            "${dataset_args[@]}"

          shopt -s nullglob
          archives=("$OUTPUT_DIR"/*_mpk.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one MPK archive, found ${#archives[@]} in $OUTPUT_DIR" >&2
            find "$OUTPUT_DIR" -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          if [[ "$CALIBRATION_KIND" == "dataset" ]]; then
            candidate_model="$OUTPUT_DIR/${MODEL_ID}_${VARIANT_ID}.sima"
            test -f "$candidate_model"
            accuracy_profile=regular
            if [[ "$ACCURACY_SAMPLES" == "5000" ]]; then
              accuracy_profile=qualification
            fi
            python -m model_registry evaluate "$MODEL_DIR" \
              --variant "$VARIANT_ID" \
              --reference-model "$SOURCE_PATH" \
              --candidate-model "$candidate_model" \
              --dataset "$CALIBRATION_PATH" \
              --profile "$accuracy_profile" \
              --samples "$ACCURACY_SAMPLES" \
              --workers 6 \
              --output "$OUTPUT_DIR/accuracy.json"
          fi
          if [[ -f "$OUTPUT_DIR/accuracy.json" ]]; then
            evaluated="$(jq -er '.dataset.evaluated_samples' "$OUTPUT_DIR/accuracy.json")"
            available="$(jq -er '.dataset.available_samples' "$OUTPUT_DIR/accuracy.json")"
            scope="$(jq -er '.report_scope' "$OUTPUT_DIR/accuracy.json")"
            status="$(jq -er '.evaluation.status' "$OUTPUT_DIR/accuracy.json")"
            top1="$(jq -er '.metrics.candidate.top1_accuracy' "$OUTPUT_DIR/accuracy.json")"
            top5="$(jq -er '.metrics.candidate.top5_accuracy' "$OUTPUT_DIR/accuracy.json")"
            echo "Accuracy: status=\`$status\`, scope=\`$scope\`, samples=\`$evaluated/$available\`, top-1=\`$top1\`, top-5=\`$top5\`" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          BASH

      - name: Validate and checksum the MPK
        id: mpk
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/mpk-result.json"
          calibration_args=()
          if [[ -n "${{ steps.calibration.outputs.sha256 }}" ]]; then
            calibration_args=(--calibration-sha256 "${{ steps.calibration.outputs.sha256 }}")
          fi
          "$MODEL_COMPILER_PYTHON" -m model_registry verify-mpk "$OUTPUT_DIR" \
            --write-manifest --json \
            --model-id "$MODEL_ID" \
            --variant-id "$VARIANT_ID" \
            --target "${{ matrix.target }}" \
            --compiler-version "$EXPECTED_COMPILER_VERSION" \
            --compiler-label "$MODEL_COMPILER_LABEL" \
            --source-sha256 "${{ steps.source.outputs.sha256 }}" \
            "${calibration_args[@]}" \
            --git-sha "$GITHUB_SHA" \
            --environment "${{ needs.select.outputs.vulcan_environment }}" \
            --build-fingerprint "$BUILD_FINGERPRINT" \
            > "$result"
          archive="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$result")"
          digest="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$result")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Configure artifact-registry publisher credentials
        if: >-
          needs.select.outputs.publishable == 'true' &&
          needs.select.outputs.vulcan_environment == 'staging'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish this model compilation
        if: >-
          needs.select.outputs.publishable == 'true' &&
          needs.select.outputs.vulcan_environment == 'staging'
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          result="$("$MODEL_COMPILER_PYTHON" -m model_registry publish \
            --repository . \
            --dist-dir "$ARTIFACT_ROOT" \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --branch "$GITHUB_REF_NAME" \
            --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json)"
          "$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; result=json.load(sys.stdin); assert result["count"] == 1' <<< "$result"
          printf '%s\n' "$result" > "$OUTPUT_DIR/registry-publication.json"
          echo "Published $MODEL_ID/$VARIANT_ID to the model registry." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the validated model output for packaging
        uses: actions/upload-artifact@v7
        with:
          name: compiled-model-${{ matrix.model_id }}-${{ matrix.variant_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14

      - name: Start this model benchmark without waiting for the compile matrix
        if: >-
          needs.select.outputs.vulcan_environment == 'staging' &&
          matrix.target == 'modalix'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          BENCHMARK_MODEL_ID: ${{ matrix.model_id }}
          BENCHMARK_VARIANT_ID: ${{ matrix.variant_id }}
        run: |
          set -euo pipefail
          "$MODEL_COMPILER_PYTHON" - <<'PY'
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          import certifi

          payload = {
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "operation": "benchmark",
                  "environment": os.environ["BENCHMARK_ENVIRONMENT"],
                  "source_run_id": os.environ["GITHUB_RUN_ID"],
                  "source_sha": os.environ["GITHUB_SHA"],
                  "model_id": os.environ["BENCHMARK_MODEL_ID"],
                  "variant_id": os.environ["BENCHMARK_VARIANT_ID"],
              },
          }
          endpoint = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/Vulcan-Model-Compile.yml/dispatches"
          )
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              tls = ssl.create_default_context(cafile=certifi.where())
              with urllib.request.urlopen(request, context=tls, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(f"Workflow dispatch returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")
              raise SystemExit(f"Workflow dispatch failed with HTTP {error.code}: {detail}") from error
          print(
              "Dispatched benchmark for "
              f"{os.environ['BENCHMARK_MODEL_ID']}/{os.environ['BENCHMARK_VARIANT_ID']}"
          )
          PY

  stage-dispatched-benchmark:
    name: Stage ${{ inputs.model_id }} (${{ inputs.variant_id }}) benchmark input
    needs: resolve-dispatched-benchmark-config
    if: >-
      inputs.operation == 'benchmark' &&
      inputs.environment == 'staging' &&
      inputs.source_run_id != '' && inputs.source_sha != '' &&
      inputs.model_id != '' && inputs.variant_id != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Verify the source run and compiled artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODEL_ID: ${{ inputs.model_id }}
          VARIANT_ID: ${{ inputs.variant_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch")' \
            <<< "$run_json" >/dev/null
          echo "branch=$(jq -er '.head_branch' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -er '.run_attempt | tostring' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          artifact_name="compiled-model-$MODEL_ID-$VARIANT_ID"
          artifact_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
              jq --arg artifact "$artifact_name" \
                '[.artifacts[] | select(.name == $artifact and (.expired | not))] | length'
          )"
          test "$artifact_count" = "1"

      - name: Download this compiled model from its source run
        uses: actions/download-artifact@v7
        with:
          name: compiled-model-${{ inputs.model_id }}-${{ inputs.variant_id }}
          path: _compiled
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Check whether the compilation is already registered
        id: publication
        env:
          MODEL_ID: ${{ inputs.model_id }}
          VARIANT_ID: ${{ inputs.variant_id }}
        run: |
          publication="_compiled/$MODEL_ID/$VARIANT_ID/registry-publication.json"
          if [[ -f "$publication" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the trusted source revision for registry tooling
        if: steps.publication.outputs.required == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _registry_source

      - name: Set up registry publication tooling
        if: steps.publication.outputs.required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _registry_source/pyproject.toml

      - name: Install registry publication tooling
        if: steps.publication.outputs.required == 'true'
        run: python -m pip install ./_registry_source

      - name: Configure artifact-registry publisher credentials
        if: steps.publication.outputs.required == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Register an unpublished compilation for benchmarking
        if: steps.publication.outputs.required == 'true'
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODEL_ID: ${{ inputs.model_id }}
          VARIANT_ID: ${{ inputs.variant_id }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          result="$(model-registry publish \
            --repository _registry_source \
            --dist-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment staging \
            --branch "$SOURCE_BRANCH" \
            --git-sha "$SOURCE_SHA" \
            --github-run-id "$SOURCE_RUN_ID" \
            --github-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            --json)"
          python -c 'import json,sys; result=json.load(sys.stdin); assert result["count"] == 1' <<< "$result"
          printf '%s\n' "$result" > "_compiled/$MODEL_ID/$VARIANT_ID/registry-publication.json"

      - name: Retain benchmark input independently of compile-run cleanup
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.variant_id }}
          path: _compiled
          if-no-files-found: error
          retention-days: 1

  resolve-dispatched-benchmark-runner:
    name: Resolve dispatched benchmark DevKit runner
    if: inputs.operation == 'benchmark' && inputs.environment == 'staging'
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  resolve-dispatched-benchmark-config:
    name: Resolve dispatched benchmark Vulcan config
    if: inputs.operation == 'benchmark' && inputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment }}
    secrets: inherit

  benchmark-dispatched-model:
    name: Benchmark ${{ inputs.model_id }} (${{ inputs.variant_id }}) on DevKit
    needs: [stage-dispatched-benchmark, resolve-dispatched-benchmark-runner]
    if: inputs.operation == 'benchmark' && inputs.environment == 'staging'
    runs-on:
      group: ${{ needs.resolve-dispatched-benchmark-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix, "vulcan-${{ inputs.environment }}"]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      MODEL_ID: ${{ inputs.model_id }}
      VARIANT_ID: ${{ inputs.variant_id }}
      SOURCE_BRANCH: ${{ needs.stage-dispatched-benchmark.outputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download the staged compiled model output
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.variant_id }}
          path: _compiled

      - name: Install registry tooling in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/model-registry-tools"
          "$RUNNER_TEMP/model-registry-tools/bin/python" -m pip install .
          echo "REGISTRY_PYTHON=$RUNNER_TEMP/model-registry-tools/bin/python" >> "$GITHUB_ENV"

      - name: Resolve and verify benchmark runtime
        run: |
          set -euo pipefail
          runtime="$("$REGISTRY_PYTHON" -m model_registry resolve-benchmark-runtime --repository .)"
          platform_version="$(jq -er '.devkit.platform_version' <<< "$runtime")"
          neat_version="$(jq -er '.neat_core.version' <<< "$runtime")"
          actual_platform="$(
            awk -F= '
              /^[[:space:]]*DISTRO_VERSION[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' /etc/buildinfo
          )"
          if [[ -z "$actual_platform" ]]; then
            echo "Could not read DISTRO_VERSION from /etc/buildinfo" >&2
            exit 1
          fi
          if [[ "$actual_platform" != "$platform_version" ]]; then
            echo "DevKit platform mismatch: expected $platform_version, found $actual_platform" >&2
            exit 1
          fi
          echo "Verified DevKit platform $actual_platform."
          echo "BENCHMARK_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "NEAT_VERSION=$neat_version" >> "$GITHUB_ENV"

      - name: Install branch benchmarker and Neat dependency
        run: |
          set -euo pipefail
          environment="$(jq -er '.benchmarker.vulcan.environment' <<< "$BENCHMARK_RUNTIME")"
          name="$(jq -er '.benchmarker.vulcan.name' <<< "$BENCHMARK_RUNTIME")"
          expected_version="$(jq -er '.benchmarker.version' <<< "$BENCHMARK_RUNTIME")"
          tooling_tag="${GITHUB_SHA:0:12}"
          target="$name@$GITHUB_REF_NAME:$tooling_tag"
          for attempt in {1..6}; do
            if sima-cli neat install --env "$environment" "$target"; then
              echo "Installed benchmarker from $target."
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Failed to install benchmarker from $target after $attempt attempts." >&2
              exit 1
            else
              echo "Benchmarker $target is not available yet; retrying in 5 seconds ($attempt/6)." >&2
              sleep 5
            fi
          done
          "$HOME/pyneat/bin/python" -c 'import pyneat, os; assert pyneat.__version__.split("+", 1)[0] == os.environ["NEAT_VERSION"]'
          "$HOME/pyneat/bin/benchmarker" --version | grep -E " ${expected_version}(\\+|$)"
          "$HOME/pyneat/bin/python" -c 'import benchmarker; assert getattr(benchmarker, "RESULT_SCHEMA_VERSION", None) == 3, "installed benchmarker cannot emit schema-v3 results"'

      - name: Generate manifest and run benchmark
        run: |
          set -euo pipefail
          export SIMA_PLATFORM_VERSION="$(jq -er '.devkit.platform_version' <<< "$BENCHMARK_RUNTIME")"
          mkdir -p _benchmark
          "$REGISTRY_PYTHON" -m model_registry make-benchmark-manifest \
            --repository . \
            --compiled-dir _compiled \
            --output _benchmark/performance-test.json \
            --branch "$GITHUB_REF_NAME" \
            --git-sha "$SOURCE_SHA" \
            --model "$MODEL_ID" \
            --variant "$VARIANT_ID"
          set -o pipefail
          "$HOME/pyneat/bin/benchmarker" \
            --manifest _benchmark/performance-test.json \
            --output _benchmark/performance-result-v3.json \
            2>&1 | tee _benchmark/benchmark.log

      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.variant_id }}
          path: |
            _benchmark/performance-result-v3.json
            _benchmark/benchmark.log
          if-no-files-found: error
          retention-days: 14

  publish-dispatched-benchmark:
    name: Publish ${{ inputs.model_id }} (${{ inputs.variant_id }}) benchmark to Vulcan
    needs: [benchmark-dispatched-model, resolve-dispatched-benchmark-config]
    if: >-
      always() &&
      inputs.operation == 'benchmark' &&
      needs.benchmark-dispatched-model.result == 'success' &&
      needs.resolve-dispatched-benchmark-config.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Publication tooling must come from the trusted workflow revision.
          # The older source SHA remains the benchmark's provenance below.
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: actions/download-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.variant_id }}
          path: _benchmarks
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish every completed schema-v3 result and log
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t results < <(find _benchmarks -type f -name performance-result-v3.json -print | sort)
          (( ${#results[@]} > 0 )) || { echo "No completed benchmark results were downloaded" >&2; exit 1; }
          for result in "${results[@]}"; do
            log="$(dirname "$result")/benchmark.log"
            model-registry publish-benchmark \
              --result "$result" \
              --log "$log" \
              --schema schemas/performance-result-v3.schema.json \
              --api-url "$REGISTRY_API_URL" \
              --aws-region "$AWS_REGION" \
              --bucket "$ARTIFACT_BUCKET" \
              --kms-key-id "$KMS_KEY_ID" \
              --environment staging \
              --branch "$GITHUB_REF_NAME" \
              --git-sha "$SOURCE_SHA" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  cleanup-dispatched-benchmark-artifacts:
    name: Clean up dispatched benchmark artifacts
    needs: publish-dispatched-benchmark
    if: always() && needs.publish-dispatched-benchmark.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete benchmark input and evidence from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          VARIANT_ID: ${{ inputs.variant_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"benchmark-input-$MODEL_ID-$VARIANT_ID\" or .name == \"benchmark-$MODEL_ID-$VARIANT_ID\") | .id" |
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

  resolve-vulcan-config:
    name: Resolve Vulcan publication config
    needs: select
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ needs.select.outputs.vulcan_environment }}
    secrets: inherit

  publish-taxonomy:
    name: Publish model taxonomy
    needs: [select, resolve-vulcan-config]
    if: >-
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      needs.select.outputs.vulcan_environment == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-taxonomy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish canonical taxonomy
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish-taxonomy \
            --repository . \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION"

  package:
    name: Build sima-cli model catalog
    needs: [select, compile]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.compile.result == 'success' ||
       (needs.compile.result == 'skipped' && needs.select.outputs.count == '0')) &&
      needs.select.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Prepare empty compiled-output directory
        run: mkdir _compiled

      - name: Download pinned previous model catalog
        if: needs.select.outputs.previous_found == 'true'
        uses: actions/download-artifact@v7
        with:
          name: previous-model-index
          path: _previous

      - name: Download compiled model outputs
        if: needs.select.outputs.count != '0'
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-model-*
          path: _compiled
          merge-multiple: true

      - name: Generate root and per-model package metadata
        env:
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          package_args=(
            --repository . \
            --compiled-dir _compiled \
            --output-dir dist \
            --git-sha "$GITHUB_SHA" \
            --environment "$VULCAN_ENVIRONMENT" \
            --branch "$GITHUB_REF_NAME" \
            --json
          )
          if [[ -f _previous/previous-latest.json ]]; then
            package_args+=(--previous-index _previous/previous-latest.json)
          fi
          if [[ "$GITHUB_REF_NAME" != "main" && "$GITHUB_REF_NAME" != "develop" ]]; then
            package_args+=(--allow-partial-catalog)
          fi
          model-registry package "${package_args[@]}" > package-result.json
          python -m json.tool dist/metadata.json >/dev/null
          find dist -mindepth 2 -name metadata.json -print -exec python -m json.tool {} \; >/dev/null
          find dist -type f -print | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable model catalog
        uses: actions/upload-artifact@v7
        with:
          name: models-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish branch model artifacts
    needs: [select, package, resolve-vulcan-config]
    if: needs.package.result == 'success'
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.select.outputs.vulcan_environment }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      artifact_folder: "."
      artifact_pattern: models-dist
      artifact_glob: "**/*"
      min_artifact_count: 3
      publish_manifest: true
      cleanup_github_artifacts: false

  publish-latest-index:
    name: Publish model-aware latest.json
    needs: [select, package, publish, resolve-vulcan-config]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download packaged model catalog
        uses: actions/download-artifact@v7
        with:
          name: models-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
          role-session-name: models-latest-index-${{ github.run_id }}

      - name: Validate and upload latest.json
        env:
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
        run: |
          set -euo pipefail
          branch_key="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITHUB_REF_NAME"], safe=""))')"
          jq -e \
            --arg branch "$GITHUB_REF_NAME" \
            --arg tag "${GITHUB_SHA:0:12}" \
            '.schema_version == 2 and .repository == "sima-neat/models" and .branch == $branch and .catalog_tag == $tag' \
            dist/latest.json >/dev/null
          encryption=(--sse aws:kms)
          if [[ -n "$KMS_KEY_ID" ]]; then
            encryption+=(--sse-kms-key-id "$KMS_KEY_ID")
          fi
          aws s3 cp dist/latest.json "s3://$ARTIFACT_BUCKET/models/$branch_key/latest.json" \
            --content-type application/json \
            --cache-control no-store \
            "${encryption[@]}"

  promote-latest:
    name: Promote branch latest.tag
    needs: [select, publish-latest-index, resolve-vulcan-config]
    if: needs.publish-latest-index.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.select.outputs.vulcan_environment }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      artifact_folder: "."
      validate_manifest: true

  cleanup-github-artifacts:
    name: Clean up packaged GitHub artifacts
    needs: [publish, publish-latest-index, promote-latest]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.publish-latest-index.result == 'success' &&
      needs.promote-latest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete packaging artifacts after all consumers finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t artifact_ids < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "models-dist" or .name == "previous-model-index") | .id'
          )
          if (( ${#artifact_ids[@]} < 1 || ${#artifact_ids[@]} > 2 )); then
            echo "Expected models-dist and at most one previous-model-index artifact; found ${#artifact_ids[@]}" >&2
            exit 1
          fi
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
