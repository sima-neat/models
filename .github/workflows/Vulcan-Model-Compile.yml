name: Vulcan Model Compile

on:
  pull_request:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  push:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment whose Model Compiler runner and artifact bucket are used
        required: true
        default: staging
        type: choice
        options: [staging, production]
      models:
        description: Comma-separated model IDs; leave empty to build the entire catalog
        required: false
        type: string
      profiles:
        description: Comma-separated build profile IDs within selected models; leave empty to build every build profile
        required: false
        type: string
      components:
        description: Comma-separated component IDs within selected models; leave empty to build every component
        required: false
        type: string
      base_branch:
        description: Optional base branch for changed-model selection and artifact inheritance
        required: false
        type: string
      accuracy_samples:
        description: Validation samples for dataset-backed builds (500 smoke, 5000 qualification)
        required: true
        default: "500"
        type: choice
        options: ["500", "5000"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-compile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  select:
    name: Select model component builds
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      vulcan_environment: ${{ steps.environment.outputs.vulcan_environment }}
      runner_environment: ${{ steps.environment.outputs.runner_environment }}
      model_compiler_version: ${{ steps.compiler.outputs.version }}
      model_compiler_label: ${{ steps.compiler.outputs.label }}
      publishable: ${{ steps.matrix.outputs.publishable }}
      base_branch: ${{ steps.base.outputs.base_branch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Validate complete model catalog and taxonomy
        run: model-registry validate-catalog --repository .

      - name: Resolve Vulcan environment
        id: environment
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          environment="${REQUESTED_ENVIRONMENT:-staging}"
          case "$environment" in
            staging) runner_environment="vulcan-stg" ;;
            production) runner_environment="vulcan-production" ;;
            *) echo "Unsupported environment: $environment" >&2; exit 2 ;;
          esac
          echo "vulcan_environment=$environment" >> "$GITHUB_OUTPUT"
          echo "runner_environment=$runner_environment" >> "$GITHUB_OUTPUT"

      - name: Resolve Model Compiler dependency
        id: compiler
        run: |
          set -euo pipefail
          resolution="$(model-registry resolve-compiler --repository .)"
          version="$(jq -er '.version' <<< "$resolution")"
          label="$(jq -er '.label' <<< "$resolution")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Model Compiler dependency: \`$version\` (\`$label\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve branch comparison base
        id: base
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: develop
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREFERRED_BRANCH: ${{ inputs.base_branch || github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          preferred_args=()
          if [[ -n "${PREFERRED_BRANCH:-}" ]]; then
            preferred_args=(--preferred-branch "$PREFERRED_BRANCH")
          fi
          resolution="$(model-registry resolve-base \
            --repository . \
            --current-branch "$CURRENT_BRANCH" \
            --head "$HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            "${preferred_args[@]}")"
          base_branch="$(jq -er '.base_branch' <<< "$resolution")"
          merge_base="$(jq -er '.merge_base' <<< "$resolution")"
          comparison_base="$merge_base"
          if [[ "${EVENT_BEFORE:-}" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$EVENT_BEFORE" =~ ^0+$ ]] && \
             git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            comparison_base="$EVENT_BEFORE"
          fi
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "comparison_base=$comparison_base" >> "$GITHUB_OUTPUT"
          echo "Resolved base branch: \`$base_branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: \`$comparison_base..$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build deterministic matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODELS: ${{ inputs.models }}
          REQUESTED_PROFILES: ${{ inputs.profiles }}
          REQUESTED_COMPONENTS: ${{ inputs.components }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPARISON_BASE: ${{ steps.base.outputs.comparison_base }}
          COMPILER_VERSION: ${{ steps.compiler.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile_args=()
            if [[ -n "${REQUESTED_PROFILES:-}" ]]; then
              profile_args=(--profiles "$REQUESTED_PROFILES")
            fi
            component_args=()
            if [[ -n "${REQUESTED_COMPONENTS:-}" ]]; then
              component_args=(--components "$REQUESTED_COMPONENTS")
            fi
            if [[ -n "${REQUESTED_MODELS:-}" ]]; then
              matrix="$(model-registry matrix --repository . --models "$REQUESTED_MODELS" \
                --compiler-version "$COMPILER_VERSION" "${profile_args[@]}" "${component_args[@]}")"
            else
              matrix="$(model-registry matrix --repository . --all \
                --compiler-version "$COMPILER_VERSION" "${profile_args[@]}" "${component_args[@]}")"
            fi
          else
            matrix="$(model-registry matrix --repository . \
              --base "$COMPARISON_BASE" --head "$HEAD_SHA" \
              --compiler-version "$COMPILER_VERSION")"
          fi
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          publishable=true
          if [[ -n "${REQUESTED_PROFILES:-}" || -n "${REQUESTED_COMPONENTS:-}" ]]; then
            publishable=false
            echo "Targeted build-profile dispatch is compile-only; catalog publication is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
          echo "Selected $count component build job(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain pull-request safety boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull requests perform model discovery and metadata validation only." >> "$GITHUB_STEP_SUMMARY"
          echo "Untrusted pull-request code is never scheduled on a Vulcan self-hosted runner." >> "$GITHUB_STEP_SUMMARY"

  authorize-runner-classes:
    name: Authorize compile runner classes
    needs: [select, resolve-vulcan-config]
    if: github.event_name != 'pull_request' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.authorization.outputs.matrix }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure Vulcan specification reader credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.config_reader_role_arn }}
          role-session-name: model-runner-admission-${{ github.run_id }}

      - name: Authorize the selected runner requests
        id: authorization
        env:
          SELECTED_MATRIX: ${{ needs.select.outputs.matrix }}
          VULCAN_CONFIG_S3_URI: ${{ needs.resolve-vulcan-config.outputs.config_s3_uri }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/selected-matrix.json"
          spec_file="$RUNNER_TEMP/vulcan-environment.json"
          printf '%s' "$SELECTED_MATRIX" > "$matrix_file"
          aws s3 cp "$VULCAN_CONFIG_S3_URI" "$spec_file" --only-show-errors
          authorized="$(model-registry authorize-runner-matrix \
            --matrix "$matrix_file" \
            --vulcan-spec "$spec_file" \
            --repository-name "$GITHUB_REPOSITORY" \
            --environment "$VULCAN_ENVIRONMENT")"
          echo "matrix=$authorized" >> "$GITHUB_OUTPUT"
          count="$(jq -er '.include | length' <<< "$authorized")"
          elevated="$(jq -r '[.include[] | select(.runner_class != "default")] | length' <<< "$authorized")"
          echo "Authorized $count component build job(s), including $elevated elevated runner request(s)." \
            >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Compile ${{ matrix.model_id }}/${{ matrix.component_id }} (${{ matrix.build_profile_id }})
    needs: [select, resolve-vulcan-config, authorize-runner-classes]
    if: github.event_name != 'pull_request' && needs.select.outputs.count != '0'
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize-runner-classes.outputs.matrix) }}
    runs-on:
      - self-hosted
      - linux
      - arm64
      - ${{ needs.select.outputs.runner_environment }}
      - model-compiler
      - ${{ needs.select.outputs.model_compiler_label }}
      - ${{ matrix.runner_class }}
      - model-id-${{ matrix.model_id }}
      - build-profile-id-${{ matrix.build_profile_id }}
      - component-id-${{ matrix.component_id }}
    timeout-minutes: 90
    env:
      MODEL_COMPILER_PYTHON: /mnt/model-compiler/bin/python
      MODEL_ID: ${{ matrix.model_id }}
      MODEL_DIR: ${{ matrix.model_dir }}
      BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
      COMPONENT_ID: ${{ matrix.component_id }}
      RECIPE: ${{ matrix.recipe }}
      EXPECTED_COMPILER_VERSION: ${{ needs.select.outputs.model_compiler_version }}
      MODEL_COMPILER_LABEL: ${{ needs.select.outputs.model_compiler_label }}
      BUILD_FINGERPRINT: ${{ matrix.build_fingerprint }}
      REQUESTED_RUNNER_CLASS: ${{ matrix.requested_runner_class }}
      RUNNER_CLASS: ${{ matrix.runner_class }}
      RUNNER_APPROVAL_ID: ${{ matrix.runner_approval_id }}
      RUNNER_APPROVAL_SPEC_REVISION: ${{ matrix.runner_approval_spec_revision }}
      ACCURACY_SAMPLES: ${{ inputs.accuracy_samples || '500' }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Prepare isolated output location
        run: |
          echo "ARTIFACT_ROOT=$RUNNER_TEMP/model-registry-output" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$RUNNER_TEMP/model-registry-output/$MODEL_ID/$BUILD_PROFILE_ID/$COMPONENT_ID" >> "$GITHUB_ENV"

      - name: Verify the pinned Model Compiler environment
        run: |
          set -euo pipefail
          test -x "$MODEL_COMPILER_PYTHON"
          "$MODEL_COMPILER_PYTHON" - "$EXPECTED_COMPILER_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path("/etc/vulcan/model-compiler-artifact.json").read_text())
          expected = sys.argv[1]
          actual = metadata.get("version")
          if actual != expected:
              raise SystemExit(f"Model Compiler version mismatch: expected {expected}, found {actual}")
          print(json.dumps(metadata, sort_keys=True))
          PY

      - name: Install dataset-registry from the main branch artifact
        env:
          DATASET_REGISTRY_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
          SIMA_CLI_CHECK_FOR_UPDATE: "0"
        run: |
          set -euo pipefail
          curl -fsSL https://docs.sima.ai/_static/tools/sima-cli-installer.sh | bash
          sima_cli="${HOME}/.sima-cli/.venv/bin/sima-cli"
          test -x "$sima_cli"
          "$sima_cli" neat install --help | grep -q -- '--download-only'

          package_dir="$RUNNER_TEMP/dataset-registry-package"
          dataset_tools="$RUNNER_TEMP/dataset-registry-tools"
          "$sima_cli" neat install \
            --env "$DATASET_REGISTRY_ENVIRONMENT" \
            --install-dir "$package_dir" \
            --download-only \
            dataset/dataset-registry@main:latest
          mapfile -t wheels < <(find "$package_dir" -maxdepth 1 -type f -name 'sima_neat_dataset_registry-*.whl' -print)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected one dataset-registry wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check \
            --target "$dataset_tools" 'boto3>=1.34,<2'
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check \
            --no-deps --target "$dataset_tools" "${wheels[0]}"
          PYTHONPATH="$dataset_tools${PYTHONPATH:+:$PYTHONPATH}" \
            "$MODEL_COMPILER_PYTHON" -m dataset_registry --version
          echo "PYTHONPATH=$dataset_tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Install shared registry tooling outside the read-only compiler image
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/model-registry-tools"
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check --no-deps --target "$tooling" .
          "$MODEL_COMPILER_PYTHON" -c 'import certifi, jsonschema, yaml'
          echo "PYTHONPATH=$tooling${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Fetch and verify the immutable model source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/source.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch "$MODEL_DIR" \
            --component "$COMPONENT_ID" --json > "$result"
          source_path="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$result")"
          source_sha256="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$result")"
          echo "path=$source_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify the immutable calibration input
        id: calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/calibration.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch-calibration "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" --component "$COMPONENT_ID" \
            --cache-dir "$RUNNER_TEMP/datasets" --json > "$result"
          calibration_path="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("path", ""))' "$result")"
          calibration_sha256="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("sha256", ""))' "$result")"
          calibration_kind="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("kind", "none"))' "$result")"
          echo "path=$calibration_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$calibration_sha256" >> "$GITHUB_OUTPUT"
          echo "kind=$calibration_kind" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify the immutable accuracy dataset
        id: accuracy_dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/accuracy-dataset.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch-accuracy-dataset "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" --component "$COMPONENT_ID" \
            --cache-dir "$RUNNER_TEMP/datasets" --json > "$result"
          accuracy_dataset_path="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("path", ""))' "$result")"
          accuracy_dataset_kind="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("kind", "none"))' "$result")"
          echo "path=$accuracy_dataset_path" >> "$GITHUB_OUTPUT"
          echo "kind=$accuracy_dataset_kind" >> "$GITHUB_OUTPUT"

      - name: Run model-specific surgery and compilation recipe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          CALIBRATION_PATH: ${{ steps.calibration.outputs.path }}
          CALIBRATION_KIND: ${{ steps.calibration.outputs.kind }}
        run: |
          set -euo pipefail
          test -f "$MODEL_DIR/$RECIPE"
          bash --noprofile --norc <<'BASH'
          set -euo pipefail
          source /etc/profile.d/vulcan-model-compiler.sh
          type activate-model-compiler
          activate-model-compiler
          command -v mla-masm
          dataset_args=()
          if [[ "$CALIBRATION_KIND" == "dataset" ]]; then
            dataset_args=(--dataset "$CALIBRATION_PATH")
          fi
          python "$MODEL_DIR/$RECIPE" \
            --model "$SOURCE_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --build-profile "$BUILD_PROFILE_ID" \
            --component "$COMPONENT_ID" \
            "${dataset_args[@]}"

          shopt -s nullglob
          archives=("$OUTPUT_DIR"/*_mpk.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one MPK archive, found ${#archives[@]} in $OUTPUT_DIR" >&2
            find "$OUTPUT_DIR" -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          BASH

      - name: Measure model accuracy
        if: steps.accuracy_dataset.outputs.kind == 'dataset'
        env:
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          ACCURACY_DATASET_PATH: ${{ steps.accuracy_dataset.outputs.path }}
        run: |
          set -euo pipefail
          bash --noprofile --norc <<'BASH'
          set -euo pipefail
          source /etc/profile.d/vulcan-model-compiler.sh
          activate-model-compiler
          candidate_model="$OUTPUT_DIR/${MODEL_ID}_${BUILD_PROFILE_ID}.sima"
          test -f "$candidate_model"
          accuracy_profile=regular
          if [[ "$ACCURACY_SAMPLES" == "5000" ]]; then
            accuracy_profile=qualification
          fi
          python -m model_registry evaluate "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" \
            --component "$COMPONENT_ID" \
            --reference-model "$SOURCE_PATH" \
            --candidate-model "$candidate_model" \
            --dataset "$ACCURACY_DATASET_PATH" \
            --profile "$accuracy_profile" \
            --samples "$ACCURACY_SAMPLES" \
            --workers 6 \
            --output "$OUTPUT_DIR/accuracy.json"
          evaluated="$(jq -er '.dataset.evaluated_samples' "$OUTPUT_DIR/accuracy.json")"
          available="$(jq -er '.dataset.available_samples' "$OUTPUT_DIR/accuracy.json")"
          scope="$(jq -er '.report_scope' "$OUTPUT_DIR/accuracy.json")"
          status="$(jq -er '.evaluation.status' "$OUTPUT_DIR/accuracy.json")"
          top1="$(jq -er '.metrics.candidate.top1_accuracy' "$OUTPUT_DIR/accuracy.json")"
          top5="$(jq -er '.metrics.candidate.top5_accuracy' "$OUTPUT_DIR/accuracy.json")"
          echo "Accuracy: status=\`$status\`, scope=\`$scope\`, samples=\`$evaluated/$available\`, top-1=\`$top1\`, top-5=\`$top5\`" \
            >> "$GITHUB_STEP_SUMMARY"
          BASH

      - name: Validate and checksum the MPK
        id: mpk
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/mpk-result.json"
          calibration_args=()
          if [[ -n "${{ steps.calibration.outputs.sha256 }}" ]]; then
            calibration_args=(--calibration-sha256 "${{ steps.calibration.outputs.sha256 }}")
          fi
          "$MODEL_COMPILER_PYTHON" -m model_registry verify-mpk "$OUTPUT_DIR" \
            --write-manifest --json \
            --model-id "$MODEL_ID" \
            --build-profile-id "$BUILD_PROFILE_ID" \
            --component-id "$COMPONENT_ID" \
            --target "${{ matrix.target }}" \
            --compiler-version "$EXPECTED_COMPILER_VERSION" \
            --compiler-label "$MODEL_COMPILER_LABEL" \
            --source-sha256 "${{ steps.source.outputs.sha256 }}" \
            "${calibration_args[@]}" \
            --git-sha "$GITHUB_SHA" \
            --environment "${{ needs.select.outputs.vulcan_environment }}" \
            --build-fingerprint "$BUILD_FINGERPRINT" \
            --requested-runner-class "$REQUESTED_RUNNER_CLASS" \
            --runner-class "$RUNNER_CLASS" \
            --runner-approval-id "$RUNNER_APPROVAL_ID" \
            --runner-approval-spec-revision "$RUNNER_APPROVAL_SPEC_REVISION" \
            > "$result"
          archive="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$result")"
          digest="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$result")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish this model compilation
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          result="$("$MODEL_COMPILER_PYTHON" -m model_registry publish \
            --repository . \
            --dist-dir "$ARTIFACT_ROOT" \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --branch "$GITHUB_REF_NAME" \
            --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json)"
          "$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; result=json.load(sys.stdin); assert result["count"] == 1' <<< "$result"
          printf '%s\n' "$result" > "$OUTPUT_DIR/registry-publication.json"
          echo "Published $MODEL_ID/$BUILD_PROFILE_ID/$COMPONENT_ID to the model registry." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the validated model output for benchmark handoff
        uses: actions/upload-artifact@v7
        with:
          name: compiled-model-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-${{ matrix.component_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14

      - name: Start this model benchmark without waiting for the compile matrix
        if: >-
          needs.select.outputs.vulcan_environment == 'staging' &&
          matrix.target == 'modalix' &&
          matrix.benchmark_test_id != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          BENCHMARK_MODEL_ID: ${{ matrix.model_id }}
          BENCHMARK_BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
          BENCHMARK_COMPONENT_ID: ${{ matrix.component_id }}
        run: |
          set -euo pipefail
          "$MODEL_COMPILER_PYTHON" - <<'PY'
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          import certifi

          payload = {
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "environment": os.environ["BENCHMARK_ENVIRONMENT"],
                  "source_run_id": os.environ["GITHUB_RUN_ID"],
                  "source_sha": os.environ["GITHUB_SHA"],
                  "model_id": os.environ["BENCHMARK_MODEL_ID"],
                  "build_profile_id": os.environ["BENCHMARK_BUILD_PROFILE_ID"],
                  "component_id": os.environ["BENCHMARK_COMPONENT_ID"],
              },
          }
          endpoint = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/Vulcan-Model-Benchmarking.yml/dispatches"
          )
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              tls = ssl.create_default_context(cafile=certifi.where())
              with urllib.request.urlopen(request, context=tls, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(f"Workflow dispatch returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")
              raise SystemExit(f"Workflow dispatch failed with HTTP {error.code}: {detail}") from error
          print(
              "Dispatched benchmark for "
              f"{os.environ['BENCHMARK_MODEL_ID']}/{os.environ['BENCHMARK_BUILD_PROFILE_ID']}/"
              f"{os.environ['BENCHMARK_COMPONENT_ID']}"
          )
          PY

  assemble-packages:
    name: Assemble complete model packages
    needs: [select, compile]
    if: >-
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      needs.compile.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Download every compiled component
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-model-*
          path: _compiled
          merge-multiple: true

      - name: Assemble every complete package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          model-registry assemble-package \
            --repository . \
            --compiled-dir _compiled \
            --output-dir _packages \
            --resource-cache-dir "$RUNNER_TEMP/model-registry-resources" \
            --all \
            --json > "$RUNNER_TEMP/packages.json"
          count="$(jq -er '.count' "$RUNNER_TEMP/packages.json")"
          (( count > 0 )) || { echo "No complete packages were assembled" >&2; exit 1; }
          echo "Assembled $count complete model package(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deterministic package bundles
        uses: actions/upload-artifact@v7
        with:
          name: model-packages-${{ github.sha }}
          path: _packages
          if-no-files-found: error
          retention-days: 14

  resolve-vulcan-config:
    name: Resolve Vulcan publication config
    needs: select
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ needs.select.outputs.vulcan_environment }}
    secrets: inherit

  publish-taxonomy:
    name: Publish model taxonomy
    needs: [select, resolve-vulcan-config]
    if: >-
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      needs.select.outputs.vulcan_environment == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-taxonomy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish canonical taxonomy
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish-taxonomy \
            --repository . \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION"
