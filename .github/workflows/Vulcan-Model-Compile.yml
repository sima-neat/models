name: Vulcan Model Compile

on:
  pull_request:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - ".github/workflows/Vulcan-Model-Benchmarking.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  push:
    paths:
      - ".github/workflows/Vulcan-Model-Compile.yml"
      - ".github/workflows/Vulcan-Model-Benchmarking.yml"
      - "deps/**"
      - "models/**"
      - "schemas/**"
      - "training/yolo26_tiny_drone/**"
      - "taxonomies/**"
      - "tools/model_registry/**"
      - "tools/runtime/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment whose Model Compiler runner and artifact bucket are used
        required: true
        default: staging
        type: choice
        options: [staging, production]
      models:
        description: Comma-separated model IDs; leave empty to build the entire catalog
        required: false
        type: string
      profiles:
        description: Comma-separated build profile IDs within selected models; leave empty to build every build profile
        required: false
        type: string
      components:
        description: Comma-separated component IDs within selected models; leave empty to build every component
        required: false
        type: string
      base_branch:
        description: Optional base branch for changed-model selection and artifact inheritance
        required: false
        type: string
      accuracy_samples:
        description: Validation samples for dataset-backed builds (500 smoke, 5000 qualification)
        required: true
        default: "500"
        type: choice
        options: ["500", "5000"]
      force_rebuild_all:
        description: Recompile every model regardless of semantic fingerprints
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-compile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  select:
    name: Select model component builds
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      vulcan_environment: ${{ steps.environment.outputs.vulcan_environment }}
      runner_environment: ${{ steps.environment.outputs.runner_environment }}
      model_compiler_version: ${{ steps.compiler.outputs.version }}
      model_compiler_label: ${{ steps.compiler.outputs.label }}
      publishable: ${{ steps.matrix.outputs.publishable }}
      base_branch: ${{ steps.base.outputs.base_branch }}
      validation_count: ${{ steps.matrix.outputs.validation_count }}
      validation_matrix: ${{ steps.matrix.outputs.validation_matrix }}
      benchmark_count: ${{ steps.matrix.outputs.benchmark_count }}
      benchmark_matrix: ${{ steps.matrix.outputs.benchmark_matrix }}
      metadata_changed: ${{ steps.matrix.outputs.metadata_changed }}
      taxonomy_changed: ${{ steps.matrix.outputs.taxonomy_changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Validate complete model catalog and taxonomy
        run: model-registry validate-catalog --repository .

      - name: Resolve Vulcan environment
        id: environment
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          environment="${REQUESTED_ENVIRONMENT:-staging}"
          case "$environment" in
            staging) runner_environment="vulcan-stg" ;;
            production) runner_environment="vulcan-production" ;;
            *) echo "Unsupported environment: $environment" >&2; exit 2 ;;
          esac
          echo "vulcan_environment=$environment" >> "$GITHUB_OUTPUT"
          echo "runner_environment=$runner_environment" >> "$GITHUB_OUTPUT"

      - name: Resolve Model Compiler dependency
        id: compiler
        run: |
          set -euo pipefail
          resolution="$(model-registry resolve-compiler --repository .)"
          version="$(jq -er '.version' <<< "$resolution")"
          label="$(jq -er '.label' <<< "$resolution")"
          identity="$(jq -er '.identity' <<< "$resolution")"
          {
            echo "version=$version"
            echo "label=$label"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"
          echo "Model Compiler dependency: \`$identity\` (\`$label\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve branch comparison base
        id: base
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: develop
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREFERRED_BRANCH: ${{ inputs.base_branch || github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          preferred_args=()
          if [[ -n "${PREFERRED_BRANCH:-}" ]]; then
            preferred_args=(--preferred-branch "$PREFERRED_BRANCH")
          fi
          resolution="$(model-registry resolve-base \
            --repository . \
            --current-branch "$CURRENT_BRANCH" \
            --head "$HEAD_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            "${preferred_args[@]}")"
          base_branch="$(jq -er '.base_branch' <<< "$resolution")"
          merge_base="$(jq -er '.merge_base' <<< "$resolution")"
          comparison_base="$merge_base"
          if [[ "$EVENT_NAME" == "push" && "$CURRENT_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            if [[ ! "${EVENT_BEFORE:-}" =~ ^[0-9a-f]{40}$ ]] || [[ "$EVENT_BEFORE" =~ ^0+$ ]] || \
               ! git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              echo "Push to $DEFAULT_BRANCH has no valid github.event.before commit: ${EVENT_BEFORE:-<empty>}" >&2
              exit 2
            fi
            comparison_base="$EVENT_BEFORE"
          fi
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "comparison_base=$comparison_base" >> "$GITHUB_OUTPUT"
          echo "Resolved base branch: \`$base_branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: \`$comparison_base..$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build deterministic matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODELS: ${{ inputs.models }}
          REQUESTED_PROFILES: ${{ inputs.profiles }}
          REQUESTED_COMPONENTS: ${{ inputs.components }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPARISON_BASE: ${{ steps.base.outputs.comparison_base }}
          COMPILER_VERSION: ${{ steps.compiler.outputs.identity }}
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild_all }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile_args=()
            if [[ -n "${REQUESTED_PROFILES:-}" ]]; then
              profile_args=(--profiles "$REQUESTED_PROFILES")
            fi
            component_args=()
            if [[ -n "${REQUESTED_COMPONENTS:-}" ]]; then
              component_args=(--components "$REQUESTED_COMPONENTS")
            fi
            force_args=()
            if [[ "${FORCE_REBUILD_ALL:-false}" == "true" ]]; then
              force_args=(--force-rebuild-all)
            fi
            if [[ -n "${REQUESTED_MODELS:-}" ]]; then
              matrix="$(model-registry matrix --repository . --models "$REQUESTED_MODELS" \
                --compiler-version "$COMPILER_VERSION" "${profile_args[@]}" "${component_args[@]}" "${force_args[@]}")"
            else
              matrix="$(model-registry matrix --repository . --all \
                --compiler-version "$COMPILER_VERSION" "${profile_args[@]}" "${component_args[@]}" "${force_args[@]}")"
            fi
          else
            matrix="$(model-registry matrix --repository . \
              --base "$COMPARISON_BASE" --head "$HEAD_SHA" \
              --compiler-version "$COMPILER_VERSION")"
          fi
          count="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")"
          validation_matrix="$(jq -c '{include: [(.validation_include // [])[] | select(.compile_changed == false)]}' <<< "$matrix")"
          benchmark_matrix="$(jq -c '{include: [(.benchmark_include // [])[] | select(.compile_changed == false)]}' <<< "$matrix")"
          validation_count="$(jq -r '.include | length' <<< "$validation_matrix")"
          benchmark_count="$(jq -r '.include | length' <<< "$benchmark_matrix")"
          metadata_changed="$(jq -r '.metadata_changed // false' <<< "$matrix")"
          taxonomy_changed="$(jq -r '.taxonomy_changed // false' <<< "$matrix")"
          publishable=true
          if [[ -n "${REQUESTED_PROFILES:-}" || -n "${REQUESTED_COMPONENTS:-}" ]]; then
            publishable=false
            echo "Targeted build-profile dispatch is compile-only; catalog publication is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "matrix=$matrix"
            echo "count=$count"
            echo "publishable=$publishable"
            echo "validation_count=$validation_count"
            echo "validation_matrix=$validation_matrix"
            echo "benchmark_count=$benchmark_count"
            echo "benchmark_matrix=$benchmark_matrix"
            echo "metadata_changed=$metadata_changed"
            echo "taxonomy_changed=$taxonomy_changed"
          } >> "$GITHUB_OUTPUT"
          echo "Catalog metadata changed: $metadata_changed; taxonomy changed: $taxonomy_changed." >> "$GITHUB_STEP_SUMMARY"
          echo "Selected $count compile invocation(s), $validation_count independent validation unit(s), and $benchmark_count independent benchmark invocation(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain pull-request safety boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull requests perform model discovery and metadata validation only." >> "$GITHUB_STEP_SUMMARY"
          echo "Untrusted pull-request code is never scheduled on a Vulcan self-hosted runner." >> "$GITHUB_STEP_SUMMARY"

  authorize-runner-classes:
    name: Authorize compile runner classes
    needs: [select, resolve-vulcan-config]
    if: github.event_name != 'pull_request' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.authorization.outputs.matrix }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure Vulcan specification reader credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.config_reader_role_arn }}
          role-session-name: model-runner-admission-${{ github.run_id }}

      - name: Authorize the selected runner requests
        id: authorization
        env:
          SELECTED_MATRIX: ${{ needs.select.outputs.matrix }}
          VULCAN_CONFIG_S3_URI: ${{ needs.resolve-vulcan-config.outputs.config_s3_uri }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/selected-matrix.json"
          spec_file="$RUNNER_TEMP/vulcan-environment.json"
          printf '%s' "$SELECTED_MATRIX" > "$matrix_file"
          aws s3 cp "$VULCAN_CONFIG_S3_URI" "$spec_file" --only-show-errors
          authorized="$(model-registry authorize-runner-matrix \
            --matrix "$matrix_file" \
            --vulcan-spec "$spec_file" \
            --repository-name "$GITHUB_REPOSITORY" \
            --environment "$VULCAN_ENVIRONMENT")"
          echo "matrix=$authorized" >> "$GITHUB_OUTPUT"
          count="$(jq -er '.include | length' <<< "$authorized")"
          elevated="$(jq -r '[.include[] | select(.runner_class != "default")] | length' <<< "$authorized")"
          echo "Authorized $count compile invocation(s), including $elevated elevated runner request(s)." \
            >> "$GITHUB_STEP_SUMMARY"

  initialize-catalog:
    name: Initialize catalog progress
    needs: [select, resolve-vulcan-config, authorize-runner-classes]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.count != '0' &&
      needs.select.outputs.publishable == 'true' &&
      needs.select.outputs.validation_count == '0' &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.authorize-runner-classes.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-catalog-initialize-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish the pending invocation plan
        env:
          BASE_BRANCH: ${{ needs.select.outputs.base_branch }}
          SELECTED_MATRIX: ${{ needs.authorize-runner-classes.outputs.matrix }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/selected-matrix.json"
          printf '%s' "$SELECTED_MATRIX" > "$matrix_file"
          model-registry publish-catalog --repository . \
            --selected-matrix "$matrix_file" \
            --api-url "$REGISTRY_API_URL" --read-api-url "$REGISTRY_READ_API_URL" \
            --aws-region "$AWS_REGION" --branch "$GITHUB_REF_NAME" \
            --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --base-branch "$BASE_BRANCH" --git-sha "$GITHUB_SHA"

  compile:
    name: Compile ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} (${{ matrix.build_profile_id }})
    needs: [select, resolve-vulcan-config, authorize-runner-classes, initialize-catalog]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.count != '0' &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.authorize-runner-classes.result == 'success' &&
      (
        needs.select.outputs.publishable != 'true' ||
        needs.select.outputs.validation_count != '0' ||
        needs.initialize-catalog.result == 'success'
      )
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      actions: write
      contents: read
    # Let each matrix entry finish independently. A failed or timed-out model
    # must not prevent durable publication of the other verified outputs.
    # report-partial-publication records the overall failure after publication.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize-runner-classes.outputs.matrix) }}
    runs-on:
      - self-hosted
      - linux
      - arm64
      - ${{ needs.select.outputs.runner_environment }}
      - model-compiler
      - ${{ needs.select.outputs.model_compiler_label }}
      - ${{ matrix.runner_class }}
      - model-id-${{ matrix.model_id }}
      # The scaler authorizes elevated model runners by the contract-v2
      # build-profile and primary-component identity. Grouped invocations use
      # their first declared component here; matrix authorization verifies the
      # complete component group before this job is queued.
      - build-profile-id-${{ matrix.build_profile_id }}
      - component-id-${{ matrix.component_id }}
    timeout-minutes: 90
    env:
      MODEL_COMPILER_PYTHON: /mnt/model-compiler/bin/python
      MODEL_ID: ${{ matrix.model_id }}
      MODEL_DIR: ${{ matrix.model_dir }}
      BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
      COMPILE_INVOCATION_ID: ${{ matrix.compile_invocation_id }}
      COMPONENT_ID: ${{ matrix.component_id }}
      COMPONENT_IDS: ${{ join(matrix.component_ids, ',') }}
      EXPLICIT_INVOCATION: ${{ matrix.explicit_invocation }}
      RECIPE: ${{ matrix.recipe }}
      PYTHON_PACKAGES: ${{ toJSON(matrix.python_packages) }}
      EXPECTED_COMPILER_VERSION: ${{ needs.select.outputs.model_compiler_version }}
      MODEL_COMPILER_LABEL: ${{ needs.select.outputs.model_compiler_label }}
      BUILD_FINGERPRINT: ${{ matrix.build_fingerprint }}
      REQUESTED_RUNNER_CLASS: ${{ matrix.requested_runner_class }}
      RUNNER_CLASS: ${{ matrix.runner_class }}
      RUNNER_APPROVAL_ID: ${{ matrix.runner_approval_id }}
      RUNNER_APPROVAL_IDS: ${{ toJSON(matrix.runner_approval_ids) }}
      RUNNER_APPROVAL_SPEC_REVISION: ${{ matrix.runner_approval_spec_revision }}
      ACCURACY_SAMPLES: ${{ inputs.accuracy_samples || '500' }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Prepare isolated output location
        run: |
          artifact_root="$RUNNER_TEMP/model-registry-output"
          profile_output="$artifact_root/$MODEL_ID/$BUILD_PROFILE_ID"
          output_dir="$profile_output/$COMPONENT_ID"
          if [[ "$EXPLICIT_INVOCATION" == "true" ]]; then
            output_dir="$profile_output"
          fi
          {
            echo "ARTIFACT_ROOT=$artifact_root"
            echo "PROFILE_OUTPUT_DIR=$profile_output"
            echo "OUTPUT_DIR=$output_dir"
          } >> "$GITHUB_ENV"

      - name: Verify the pinned Model Compiler environment
        run: |
          set -euo pipefail
          test -x "$MODEL_COMPILER_PYTHON"
          "$MODEL_COMPILER_PYTHON" - "$EXPECTED_COMPILER_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path("/etc/vulcan/model-compiler-artifact.json").read_text())
          expected = sys.argv[1]
          actual = metadata.get("version")
          if actual != expected:
              raise SystemExit(f"Model Compiler version mismatch: expected {expected}, found {actual}")
          print(json.dumps(metadata, sort_keys=True))
          PY
          "$MODEL_COMPILER_PYTHON" -c 'import afe'

      - name: Install dataset-registry from the main branch artifact
        env:
          DATASET_REGISTRY_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
          SIMA_CLI_CHECK_FOR_UPDATE: "0"
        run: |
          set -euo pipefail
          installer_log="$RUNNER_TEMP/sima-cli-installer.log"
          for attempt in 1 2 3; do
            if curl -fsSL https://docs.sima.ai/_static/tools/sima-cli-installer.sh \
              | bash 2>&1 | tee "$installer_log"; then
              break
            fi
            if (( attempt == 3 )) || ! grep -Eq \
              'Unable to acquire the dpkg frontend lock|Could not get lock .*(apt|dpkg)' \
              "$installer_log"; then
              echo "sima-cli installer failed with a non-retryable error" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "apt/dpkg is busy; retrying sima-cli installation in ${delay}s (attempt $((attempt + 1))/3)" >&2
            sleep "$delay"
          done
          sima_cli="${HOME}/.sima-cli/.venv/bin/sima-cli"
          test -x "$sima_cli"
          "$sima_cli" neat install --help | grep -q -- '--download-only'

          package_dir="$RUNNER_TEMP/dataset-registry-package"
          dataset_tools="$RUNNER_TEMP/dataset-registry-tools"
          "$sima_cli" neat install \
            --env "$DATASET_REGISTRY_ENVIRONMENT" \
            --install-dir "$package_dir" \
            --download-only \
            dataset/dataset-registry@main:latest
          mapfile -t wheels < <(find "$package_dir" -maxdepth 1 -type f -name 'sima_neat_dataset_registry-*.whl' -print)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected one dataset-registry wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check \
            --target "$dataset_tools" 'boto3>=1.34,<2'
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check \
            --no-deps --target "$dataset_tools" "${wheels[0]}"
          PYTHONPATH="$dataset_tools${PYTHONPATH:+:$PYTHONPATH}" \
            "$MODEL_COMPILER_PYTHON" -m dataset_registry --version
          echo "PYTHONPATH=$dataset_tools${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Install shared registry tooling outside the read-only compiler image
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/model-registry-tools"
          "$MODEL_COMPILER_PYTHON" -m pip install --disable-pip-version-check --no-deps --target "$tooling" .
          "$MODEL_COMPILER_PYTHON" -c 'import certifi, jsonschema, yaml'
          echo "PYTHONPATH=$tooling${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Fetch and verify the immutable model source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/source.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch "$MODEL_DIR" \
            --component "$COMPONENT_ID" --json > "$result"
          source_path="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$result")"
          source_sha256="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$result")"
          source_root="$("$MODEL_COMPILER_PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["root"])' "$result")"
          {
            echo "path=$source_path"
            echo "root=$source_root"
            echo "sha256=$source_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare the verified model exporter
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          exporter_packages="$RUNNER_TEMP/model-exporter"
          "$MODEL_COMPILER_PYTHON" - "$SOURCE_ROOT" "$exporter_packages" "$PYTHON_PACKAGES" <<'PY'
          import importlib
          import json
          import pathlib
          import subprocess
          import sys

          source_root = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          packages = json.loads(sys.argv[3])
          for package in packages:
              path = source_root / package["path"]
              if not path.is_file():
                  raise SystemExit(f"Declared Python package does not exist: {path}")
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "--disable-pip-version-check",
                      "--no-deps",
                      "--target",
                      str(target),
                      str(path),
                  ],
                  check=True,
              )
          if packages:
              sys.path.insert(0, str(target))
          for package in packages:
              for module in package["imports"]:
                  importlib.import_module(module)
          importlib.import_module("afe")
          PY
          echo "PYTHONPATH=$exporter_packages${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Fetch and verify the immutable calibration input
        id: calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/calibration.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch-calibration "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" --component "$COMPONENT_ID" \
            --cache-dir "$RUNNER_TEMP/datasets" --json > "$result"
          calibration_path="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("path", ""))' "$result")"
          calibration_sha256="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("sha256", ""))' "$result")"
          calibration_kind="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("kind", "none"))' "$result")"
          {
            echo "path=$calibration_path"
            echo "sha256=$calibration_sha256"
            echo "kind=$calibration_kind"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and verify the immutable accuracy dataset
        id: accuracy_dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/accuracy-dataset.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry fetch-accuracy-dataset "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" --component "$COMPONENT_ID" \
            --cache-dir "$RUNNER_TEMP/datasets" --json > "$result"
          accuracy_dataset_path="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("path", ""))' "$result")"
          accuracy_dataset_kind="$("$MODEL_COMPILER_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("kind", "none"))' "$result")"
          echo "path=$accuracy_dataset_path" >> "$GITHUB_OUTPUT"
          echo "kind=$accuracy_dataset_kind" >> "$GITHUB_OUTPUT"

      - name: Run model-specific surgery and compilation recipe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          CALIBRATION_PATH: ${{ steps.calibration.outputs.path }}
          CALIBRATION_KIND: ${{ steps.calibration.outputs.kind }}
          CORRECTNESS_DATASET_PATH: ${{ steps.accuracy_dataset.outputs.path }}
          CORRECTNESS_DATASET_KIND: ${{ steps.accuracy_dataset.outputs.kind }}
        run: |
          set -euo pipefail
          test -f "$MODEL_DIR/$RECIPE"
          bash --noprofile --norc <<'BASH'
          set -euo pipefail
          source /etc/profile.d/vulcan-model-compiler.sh
          type activate-model-compiler
          activate-model-compiler
          command -v mla-masm
          dataset_args=()
          if [[ "$CALIBRATION_KIND" == "dataset" ]]; then
            dataset_args=(--dataset "$CALIBRATION_PATH")
          fi
          identity_args=(--component "$COMPONENT_ID")
          correctness_args=()
          if [[ "$EXPLICIT_INVOCATION" == "true" ]]; then
            identity_args=(--compile-invocation "$COMPILE_INVOCATION_ID")
            if [[ "$CORRECTNESS_DATASET_KIND" == "dataset" ]]; then
              correctness_args=(--correctness-dataset "$CORRECTNESS_DATASET_PATH")
            fi
          fi
          export MODEL_COMPILE_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          "$MODEL_COMPILER_PYTHON" "$MODEL_DIR/$RECIPE" \
            --model "$SOURCE_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --build-profile "$BUILD_PROFILE_ID" \
            "${identity_args[@]}" \
            "${dataset_args[@]}" \
            "${correctness_args[@]}"

          "$MODEL_COMPILER_PYTHON" - "$PROFILE_OUTPUT_DIR" <<'PYTIMING'
          import datetime
          import json
          import os
          import pathlib
          import sys

          timing = {
              "scope": "compile_recipe",
              "started_at": os.environ["MODEL_COMPILE_STARTED_AT"],
              "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path(sys.argv[1], "compile-timing.json").write_text(json.dumps(timing) + "\n")
          PYTIMING

          if [[ "$EXPLICIT_INVOCATION" != "true" ]]; then
            shopt -s nullglob
            archives=("$OUTPUT_DIR"/*_mpk.tar.gz)
            if (( ${#archives[@]} != 1 )); then
              echo "Expected exactly one MPK archive, found ${#archives[@]} in $OUTPUT_DIR" >&2
              exit 1
            fi
            "$MODEL_COMPILER_PYTHON" - "$PROFILE_OUTPUT_DIR" "$MODEL_ID" "$BUILD_PROFILE_ID" \
              "$COMPILE_INVOCATION_ID" "$COMPONENT_ID" "${archives[0]}" <<'PY'
          import json
          import pathlib
          import sys

          from model_registry.fetch import sha256_file

          root, model_id, profile_id, invocation_id, component_id, archive = sys.argv[1:]
          path = pathlib.Path(archive)
          digest, _ = sha256_file(path)
          manifest = {
              "schema_version": 1,
              "model_id": model_id,
              "build_profile_id": profile_id,
              "compile_invocation_id": invocation_id,
              "outputs": [{
                  "component_id": component_id,
                  "mpk_path": f"{component_id}/{path.name}",
                  "mpk_sha256": digest,
              }],
          }
          pathlib.Path(root, "compile-outputs.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          fi
          BASH

      - name: Measure model accuracy
        if: steps.accuracy_dataset.outputs.kind == 'dataset' && matrix.explicit_invocation != true
        env:
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          ACCURACY_DATASET_PATH: ${{ steps.accuracy_dataset.outputs.path }}
        run: |
          set -euo pipefail
          bash --noprofile --norc <<'BASH'
          set -euo pipefail
          source /etc/profile.d/vulcan-model-compiler.sh
          activate-model-compiler
          candidate_model="$OUTPUT_DIR/${MODEL_ID}_${BUILD_PROFILE_ID}.sima"
          test -f "$candidate_model"
          accuracy_profile=regular
          if [[ "$ACCURACY_SAMPLES" == "5000" ]]; then
            accuracy_profile=qualification
          fi
          python -m model_registry evaluate "$MODEL_DIR" \
            --build-profile "$BUILD_PROFILE_ID" \
            --component "$COMPONENT_ID" \
            --reference-model "$SOURCE_PATH" \
            --candidate-model "$candidate_model" \
            --dataset "$ACCURACY_DATASET_PATH" \
            --profile "$accuracy_profile" \
            --samples "$ACCURACY_SAMPLES" \
            --workers 6 \
            --output "$OUTPUT_DIR/accuracy.json"
          evaluated="$(jq -er '.dataset.evaluated_samples' "$OUTPUT_DIR/accuracy.json")"
          available="$(jq -er '.dataset.available_samples' "$OUTPUT_DIR/accuracy.json")"
          scope="$(jq -er '.report_scope' "$OUTPUT_DIR/accuracy.json")"
          status="$(jq -er '.evaluation.status' "$OUTPUT_DIR/accuracy.json")"
          top1="$(jq -er '.metrics.candidate.top1_accuracy' "$OUTPUT_DIR/accuracy.json")"
          top5="$(jq -er '.metrics.candidate.top5_accuracy' "$OUTPUT_DIR/accuracy.json")"
          echo "Accuracy: status=\`$status\`, scope=\`$scope\`, samples=\`$evaluated/$available\`, top-1=\`$top1\`, top-5=\`$top5\`" \
            >> "$GITHUB_STEP_SUMMARY"
          BASH

      - name: Validate and checksum every MPK
        run: |
          set -euo pipefail
          manifest="$PROFILE_OUTPUT_DIR/compile-outputs.json"
          "$MODEL_COMPILER_PYTHON" -m model_registry validate-compile-outputs "$manifest" \
            --output-root "$PROFILE_OUTPUT_DIR" \
            --model-id "$MODEL_ID" \
            --build-profile-id "$BUILD_PROFILE_ID" \
            --compile-invocation-id "$COMPILE_INVOCATION_ID" \
            --components "$COMPONENT_IDS"
          calibration_args=()
          if [[ -n "${{ steps.calibration.outputs.sha256 }}" ]]; then
            calibration_args=(--calibration-sha256 "${{ steps.calibration.outputs.sha256 }}")
          fi
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for index in "${!components[@]}"; do
            component="${components[$index]}"
            approval_id="$RUNNER_APPROVAL_ID"
            if [[ "$RUNNER_APPROVAL_IDS" != "null" ]]; then
              approval_id="$(jq -r ".[${index}] // \"\"" <<< "$RUNNER_APPROVAL_IDS")"
            fi
            "$MODEL_COMPILER_PYTHON" -m model_registry verify-mpk "$PROFILE_OUTPUT_DIR/$component" \
              --write-manifest \
              --model-id "$MODEL_ID" \
              --build-profile-id "$BUILD_PROFILE_ID" \
              --component-id "$component" \
              --target "${{ matrix.target }}" \
              --compiler-version "$EXPECTED_COMPILER_VERSION" \
              --compiler-label "$MODEL_COMPILER_LABEL" \
              --source-sha256 "${{ steps.source.outputs.sha256 }}" \
              "${calibration_args[@]}" \
              --git-sha "$GITHUB_SHA" \
              --environment "${{ needs.select.outputs.vulcan_environment }}" \
              --build-fingerprint "$BUILD_FINGERPRINT" \
              --requested-runner-class "$REQUESTED_RUNNER_CLASS" \
              --runner-class "$RUNNER_CLASS" \
              --runner-approval-id "$approval_id" \
              --runner-approval-spec-revision "$RUNNER_APPROVAL_SPEC_REVISION"
          done

      - name: Retain the complete compiler output
        uses: actions/upload-artifact@v7
        with:
          name: compiler-output-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-${{ matrix.compile_invocation_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 14

  publish-compilations:
    name: Publish ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} (${{ matrix.build_profile_id }})
    needs: [select, resolve-vulcan-config, authorize-runner-classes, compile]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.count != '0' &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.authorize-runner-classes.result == 'success' &&
      (needs.compile.result == 'success' || needs.compile.result == 'failure')
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      actions: write
      contents: read
      id-token: write
    # A publisher whose compiler artifact is absent fails only that matrix
    # entry; the remaining verified component sets remain publishable.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize-runner-classes.outputs.matrix) }}
    env:
      MODEL_ID: ${{ matrix.model_id }}
      BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
      COMPILE_INVOCATION_ID: ${{ matrix.compile_invocation_id }}
      COMPONENT_IDS: ${{ join(matrix.component_ids, ',') }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Download this complete compiler output
        # A missing output fails only this invocation's publisher.
        uses: actions/download-artifact@v7
        with:
          name: compiler-output-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-${{ matrix.compile_invocation_id }}
          path: _compiled

      - name: Verify the complete component set
        run: |
          set -euo pipefail
          profile_output="_compiled/$MODEL_ID/$BUILD_PROFILE_ID"
          model-registry validate-compile-outputs "$profile_output/compile-outputs.json" \
            --output-root "$profile_output" \
            --model-id "$MODEL_ID" \
            --build-profile-id "$BUILD_PROFILE_ID" \
            --compile-invocation-id "$COMPILE_INVOCATION_ID" \
            --components "$COMPONENT_IDS"
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for component in "${components[@]}"; do
            test -f "$profile_output/$component/compile-result.json"
          done

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the complete component set
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish \
            --repository . \
            --dist-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --branch "$GITHUB_REF_NAME" \
            --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Published $MODEL_ID/$BUILD_PROFILE_ID components: $COMPONENT_IDS." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the published model output for benchmark handoff
        uses: actions/upload-artifact@v7
        with:
          name: compiled-model-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-${{ matrix.compile_invocation_id }}
          path: _compiled
          if-no-files-found: error
          retention-days: 14

      - name: Start the component benchmarks
        if: >-
          needs.select.outputs.vulcan_environment == 'staging' &&
          matrix.target == 'modalix' &&
          join(matrix.benchmark_component_ids, '') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
          BENCHMARK_MODEL_ID: ${{ matrix.model_id }}
          BENCHMARK_BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
          BENCHMARK_COMPILE_INVOCATION_ID: ${{ matrix.compile_invocation_id }}
          BENCHMARK_COMPONENT_IDS: ${{ join(matrix.benchmark_component_ids, ',') }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          import certifi

          payload = {
              "ref": os.environ["GITHUB_REF_NAME"],
              "inputs": {
                  "environment": os.environ["BENCHMARK_ENVIRONMENT"],
                  "source_run_id": os.environ["GITHUB_RUN_ID"],
                  "source_sha": os.environ["GITHUB_SHA"],
                  "source_branch": os.environ["GITHUB_REF_NAME"],
                  "model_id": os.environ["BENCHMARK_MODEL_ID"],
                  "build_profile_id": os.environ["BENCHMARK_BUILD_PROFILE_ID"],
                  "compile_invocation_id": os.environ["BENCHMARK_COMPILE_INVOCATION_ID"],
                  "component_ids": os.environ["BENCHMARK_COMPONENT_IDS"],
              },
          }
          endpoint = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/Vulcan-Model-Benchmarking.yml/dispatches"
          )
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              tls = ssl.create_default_context(cafile=certifi.where())
              with urllib.request.urlopen(request, context=tls, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(f"Workflow dispatch returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")
              raise SystemExit(f"Workflow dispatch failed with HTTP {error.code}: {detail}") from error
          print(
              "Dispatched benchmark for "
              f"{os.environ['BENCHMARK_MODEL_ID']}/{os.environ['BENCHMARK_BUILD_PROFILE_ID']}/"
              f"{os.environ['BENCHMARK_COMPONENT_IDS']}"
          )
          PY

      - name: Publish this invocation in the catalog
        if: >-
          needs.select.outputs.publishable == 'true' &&
          needs.select.outputs.validation_count == '0'
        env:
          BASE_BRANCH: ${{ needs.select.outputs.base_branch }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          failure="$RUNNER_TEMP/catalog-publication-error"
          for attempt in 1 2 3 4 5; do
            if model-registry publish-catalog --repository . --compiled-dir _compiled \
              --api-url "$REGISTRY_API_URL" --read-api-url "$REGISTRY_READ_API_URL" \
              --aws-region "$AWS_REGION" --branch "$GITHUB_REF_NAME" \
              --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
              --environment "$VULCAN_ENVIRONMENT" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --base-branch "$BASE_BRANCH" --git-sha "$GITHUB_SHA" 2>"$failure"; then
              exit 0
            fi
            if ! grep -q 'catalog_snapshot_conflict' "$failure" || (( attempt == 5 )); then
              cat "$failure" >&2
              exit 1
            fi
            sleep "$(( attempt * 2 ))"
          done

  assemble-packages:
    name: Assemble complete model packages
    needs: [select, publish-compilations]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      (needs.publish-compilations.result == 'success' || needs.publish-compilations.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      package_count: ${{ steps.packages.outputs.count }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Download every compiled component
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-model-*
          path: _compiled
          merge-multiple: true

      - name: Assemble every complete package
        id: packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          model-registry assemble-package \
            --repository . \
            --compiled-dir _compiled \
            --output-dir _packages \
            --resource-cache-dir "$RUNNER_TEMP/model-registry-resources" \
            --all \
          --json > "$RUNNER_TEMP/packages.json"
          count="$(jq -er '.count' "$RUNNER_TEMP/packages.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count == 0 )); then
            echo "No complete packages were assembled; the catalog will publish pending builds only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Assembled $count complete model package(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deterministic package bundles
        if: steps.packages.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: model-packages-${{ github.sha }}
          path: _packages
          if-no-files-found: error
          retention-days: 14

  resolve-vulcan-config:
    name: Resolve Vulcan publication config
    needs: select
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ needs.select.outputs.vulcan_environment }}
    secrets: inherit

  publish-packages:
    name: Publish complete model packages
    needs: [select, resolve-vulcan-config, assemble-packages]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      needs.assemble-packages.result == 'success' &&
      needs.assemble-packages.outputs.package_count != '0'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Download assembled package bundles
        uses: actions/download-artifact@v7
        with:
          name: model-packages-${{ github.sha }}
          path: _packages

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-package-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish finalized full packages
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish-package \
            --repository . --package-dir _packages --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
            --environment "${{ needs.select.outputs.vulcan_environment }}" --branch "$GITHUB_REF_NAME" \
            --git-sha "$GITHUB_SHA" --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json > "$RUNNER_TEMP/package-publication.json"

      - name: Retain durable package publication receipts
        uses: actions/upload-artifact@v7
        with:
          name: published-model-packages-${{ github.sha }}
          path: _packages
          if-no-files-found: error
          retention-days: 14

  validation-gate:
    name: Report validation-only changes
    needs: select
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VALIDATION_COUNT: ${{ needs.select.outputs.validation_count }}
      VALIDATION_MATRIX: ${{ needs.select.outputs.validation_matrix }}
    steps:
      - name: Require an implemented evaluator for validation-only changes
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_COUNT" == "0" ]]; then
            echo "No validation-only changes require an independent evaluator." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Validation-only changes require evaluation against retained MPKs, but that evaluator is not implemented yet."
          {
            echo "## Validation is outstanding"
            echo "Catalog publication was blocked rather than silently accepting correctness changes without evaluation."
            echo '```json'
            jq . <<< "$VALIDATION_MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  publish-catalog:
    name: Publish complete model catalog snapshot
    needs: [select, resolve-vulcan-config, publish-compilations, assemble-packages, publish-packages, validation-gate]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.publishable == 'true' &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.validation-gate.result == 'success' &&
      (needs.select.outputs.count == '0' || ((needs.publish-compilations.result == 'success' || needs.publish-compilations.result == 'failure') && needs.assemble-packages.result == 'success' && (needs.assemble-packages.outputs.package_count == '0' || needs.publish-packages.result == 'success')))
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Download newly published compilation receipts
        if: needs.select.outputs.count != '0'
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-model-*
          path: _compiled
          merge-multiple: true

      - name: Download finalized package receipts
        if: needs.publish-packages.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: published-model-packages-${{ github.sha }}
          path: _packages

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-catalog-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish and promote the complete catalog snapshot
        env:
          BASE_BRANCH: ${{ needs.select.outputs.base_branch }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          : "${REGISTRY_READ_API_URL:?VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL is required}"
          compiled_args=()
          if [[ -d _compiled ]]; then
            compiled_args=(--compiled-dir _compiled)
          fi
          package_args=()
          if [[ -d _packages ]]; then
            package_args=(--package-dir _packages)
          fi
          model-registry publish-catalog \
            --repository . \
            "${compiled_args[@]}" \
            "${package_args[@]}" \
            --api-url "$REGISTRY_API_URL" \
            --read-api-url "$REGISTRY_READ_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --branch "$GITHUB_REF_NAME" \
            --base-branch "$BASE_BRANCH" \
            --git-sha "$GITHUB_SHA"

  dispatch-reused-benchmarks:
    name: Dispatch benchmarks that reuse current compile runs
    needs: [select, publish-catalog]
    if: >-
      github.event_name != 'pull_request' &&
      needs.publish-catalog.result == 'success' &&
      needs.select.outputs.vulcan_environment == 'staging' &&
      needs.select.outputs.benchmark_count != '0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.benchmark_matrix) }}
    steps:
      - name: Dispatch benchmark against durable registry MPKs
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_IDS: ${{ join(matrix.component_ids, ',') }}
        run: |
          set -euo pipefail
          gh workflow run Vulcan-Model-Benchmarking.yml \
            --ref "$GITHUB_REF_NAME" \
            -f environment=staging \
            -f source_run_id= \
            -f source_sha="$GITHUB_SHA" \
            -f source_branch="$GITHUB_REF_NAME" \
            -f model_id="${{ matrix.model_id }}" \
            -f build_profile_id="${{ matrix.build_profile_id }}" \
            -f compile_invocation_id="${{ matrix.compile_invocation_id }}" \
            -f component_ids="$COMPONENT_IDS"
          echo "Dispatched registry-backed benchmark for ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} ($COMPONENT_IDS)." \
            >> "$GITHUB_STEP_SUMMARY"

  report-partial-publication:
    name: Report failed model builds after publication
    needs: [select, compile, publish-compilations, publish-catalog]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fail after publishing every available verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHABLE: ${{ needs.select.outputs.publishable }}
        run: |
          set -euo pipefail
          failed="$RUNNER_TEMP/failed-model-jobs.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq '[.[].jobs[] | select(
                (.name | startswith("Compile ") or startswith("Publish ")) and
                .conclusion != "success" and
                (env.PUBLISHABLE == "true" or .conclusion != "skipped")
              ) | {name, conclusion, html_url}]' > "$failed"
          count="$(jq 'length' "$failed")"
          if (( count == 0 )); then
            echo "All selected model builds and publications completed successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Partial model publication"
            echo
            echo "Published every complete, verified package that was available. The following jobs failed or were cancelled:"
            jq -r '.[] | "- [\(.name)](\(.html_url)) — \(.conclusion)"' "$failed"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$count model build or publication job(s) did not complete; available artifacts were still published."
          exit 1
