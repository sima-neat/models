name: Developer Docs Validation

# The orchestrator runs this independently of model processing and publishes the checked site it uploads;
# Target Branch Checks calls it on every pull request; a manual run checks one ref.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: staging
      ui_mode:
        type: string
        default: ""
      catalog_snapshot:
        type: string
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build developer documentation
    env:
      MODEL_BROWSER_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      MODEL_BROWSER_UI_MODE: ${{ inputs.ui_mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check TypeScript
        working-directory: website
        run: npm run typecheck

      - name: Set up registry tooling for portal assembly and the preview API
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install registry tooling for portal assembly and the preview API
        run: python -m pip install .

      - name: Pin the catalog snapshot of a production customer build
        env:
          MODEL_BROWSER_CATALOG_SNAPSHOT: ${{ inputs.catalog_snapshot }}
        run: node website/scripts/pin-catalog-snapshot.mjs >> "$GITHUB_ENV"

      - name: Build unified Model Browser portal
        working-directory: website
        env:
          DOCS_SITE_URL: ${{ inputs.environment == 'production' && 'https://developer.sima.ai' || 'https://developer-stg.sima.ai' }}
          DOCS_BASE_URL: /models/
        run: npm run build:portal

      - name: Test browser modules
        run: node --test tests/browser/*.test.mjs

      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the assembled portal in Chromium
        working-directory: website
        run: npm run smoke:portal

      - name: Upload the checked portal
        uses: actions/upload-artifact@v7
        with:
          name: model-browser-site
          path: website/portal-build/
          if-no-files-found: error
          retention-days: 1
