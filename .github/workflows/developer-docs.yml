name: Developer Docs Validation

on:
  pull_request:
    paths:
      - ".github/workflows/developer-docs.yml"
      - "artifact-browser/**"
      - "docs/**"
      - "tests/browser/**"
      - "website/**"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/developer-docs.yml"
      - "artifact-browser/**"
      - "docs/**"
      - "tests/browser/**"
      - "website/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: developer-docs-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build developer documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check TypeScript
        working-directory: website
        run: npm run typecheck

      - name: Build unified Model Registry portal
        working-directory: website
        env:
          DOCS_SITE_URL: https://developer-stg.sima.ai
          DOCS_BASE_URL: /models/
        run: npm run build:portal

      - name: Test browser modules
        run: node --test tests/browser/*.test.mjs

      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the assembled portal in Chromium
        working-directory: website
        run: npm run smoke:portal
