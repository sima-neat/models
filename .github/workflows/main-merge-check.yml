name: Main Merge Check

# Target Branch Checks calls this for a pull request into main. It reads the public registry and publishes nothing.
on:
  workflow_call: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check that main takes develop's builds and results
    runs-on: ubuntu-latest
    steps:
      # The default checkout is the merge result. Its second parent is the pull request head.
      - name: Check out the merge result
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model-registry
        run: python -m pip install -e .

      - name: Check the merge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check_main_merge.sh "$HEAD_SHA"
