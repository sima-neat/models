name: Publish Main model metadata

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-main-model-metadata
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'sima-neat/models' && github.ref == 'refs/heads/develop'
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: production

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out Main's release definitions and matching producer
        uses: actions/checkout@v6
        with:
          ref: main
          path: _main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the producer belonging to the Main revision
        run: python -m pip install ./_main
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: main-metadata-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish source metadata without compiling or selecting artifacts
        env:
          VULCAN_ENV: production
          VULCAN_ARTIFACT_REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          VULCAN_ARTIFACT_REGISTRY_BUCKET: ${{ needs.resolve.outputs.artifact_bucket }}
          VULCAN_ARTIFACT_REGISTRY_KMS_KEY_ID: ${{ needs.resolve.outputs.artifact_kms_key_id }}
        run: scripts/publish_main_catalog_metadata.sh _main
      - uses: actions/upload-artifact@v7
        with:
          name: main-catalog-metadata-${{ github.run_id }}
          path: _main-catalog/receipt.json
          if-no-files-found: error
          retention-days: 30
