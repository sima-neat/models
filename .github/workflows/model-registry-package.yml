name: Model Registry Package

# Build and Publish Model Registry and Target Branch Checks call this; it publishes nothing.
on:
  workflow_call: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SIMA_CLI_CHECK_FOR_UPDATE: "0"

jobs:
  build:
    name: Build Model Registry Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and test tooling
        run: python -m pip install -e '.[dev]'

      - name: Install sima-cli
        run: scripts/install_sima_cli.sh

      - name: Test model-registry contracts and each model's scripts
        run: python -m pytest

      # A plain run deselects the tests that check real stage output. Selecting them without running them
      # still imports each one and reads its tests.yaml entry.
      - name: Collect each model's stage-output tests
        run: >-
          python -m pytest --collect-only -q models/*/tests/build models/*/tests/benchmark
          --converted=/dev/null --compiled=/dev/null --accuracy=/dev/null --performance=/dev/null

      - name: Build wheel and Vulcan metadata
        run: packaging/model-registry/build.sh

      - name: Verify package installer and author command surface
        run: packaging/model-registry/verify_package.sh

      - name: Upload package payload
        uses: actions/upload-artifact@v7
        with:
          name: model-registry-dist
          path: dist/model-registry/*
          if-no-files-found: error
          retention-days: 3
