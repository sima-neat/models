name: Vulcan Model Benchmarking
run-name: ${{ inputs.promoted_missing && 'Promoted models missing benchmarks (excluding text generation)' || format('Benchmarking ({0}/{1}, {2})', inputs.model_id, inputs.compile_invocation_id, inputs.build_profile_id) }}

# Benchmarks one build on a DevKit and publishes each stage's report. The orchestrator calls it per build and
# passes the Vulcan config and DevKit runner it resolved once; a manual dispatch resolves its own.

on:
  workflow_dispatch:
    inputs:
      promoted_missing:
        description: Benchmark promoted models missing results (excludes text generation); ignores per-model fields
        type: boolean
        required: false
        default: false
      environment:
        description: Registry and dataset environment; default uses repository VULCAN_ENV (DevKits remain on staging)
        required: true
        default: default
        type: choice
        options: [default, staging, production]
      source_run_id:
        description: Source workflow run containing the compiled-model artifact; empty restores the build from the registry
        required: false
        default: ""
        type: string
      source_sha:
        description: Single model only; source revision containing the benchmark and model definitions
        required: false
        type: string
      source_branch:
        description: Single model only; branch containing the source revision and benchmark workflow
        required: false
        type: string
      deployment_branch:
        description: Registry catalog supplying compiled deployments; empty uses source_branch
        required: false
        default: ""
        type: string
      model_id:
        description: Single model only; model ID to benchmark
        required: false
        type: string
      build_profile_id:
        description: Single model only; build profile ID to benchmark
        required: false
        type: string
      compile_invocation_id:
        description: Single model only; compile invocation that produced the components
        required: false
        type: string
      stages:
        description: Comma-separated benchmarks to run (performance, accuracy)
        required: false
        default: performance,accuracy
        type: string

  workflow_call:
    inputs:
      environment:
        description: Registry and dataset environment, staging or production (DevKits remain on staging)
        required: true
        type: string
      source_run_id:
        description: Source workflow run containing the compiled-model artifact; empty restores the build from the registry
        required: false
        default: ""
        type: string
      source_sha:
        description: Source revision containing the benchmark and model definitions
        required: true
        type: string
      source_branch:
        description: Branch containing the source revision and benchmark workflow
        required: true
        type: string
      deployment_branch:
        description: Registry catalog supplying compiled deployments; empty uses source_branch
        required: false
        default: ""
        type: string
      model_id:
        description: Model ID to benchmark
        required: true
        type: string
      build_profile_id:
        description: Build profile ID to benchmark
        required: true
        type: string
      compile_invocation_id:
        description: Compile invocation that produced the components
        required: true
        type: string
      stages:
        description: Comma-separated benchmarks to run (performance, accuracy)
        required: true
        type: string
      vulcan_config:
        description: JSON outputs of vulcan-resolve-config.yml for the environment
        required: false
        default: ""
        type: string
      devkit_runner:
        description: JSON outputs of vulcan-resolve-modalix-runner.yml
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-benchmark-${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}-${{ github.ref }}-${{ inputs.source_sha }}-${{ inputs.source_run_id }}-${{ inputs.stages }}-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}-${{ inputs.promoted_missing || false }}
  cancel-in-progress: false

jobs:
  resolve-vulcan-config:
    name: Resolve Vulcan config
    if: inputs.vulcan_config == ''
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
    secrets: inherit

  resolve-benchmark-runner:
    name: Resolve the benchmark DevKit runner
    if: inputs.devkit_runner == '' && !inputs.promoted_missing
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main
    with:
      # DevKit placement is independent of registry and dataset selection.
      runner-labels: '["self-hosted", "Linux", "ARM64", "modalix", "modalix-som-16gig", "model-registry", "vulcan-staging"]'

  promoted:
    name: Queue promoted profiles missing results (excluding text generation)
    needs: resolve-vulcan-config
    if: github.event_name == 'workflow_dispatch' && inputs.promoted_missing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install registry tooling
        run: python -m pip install .
      - name: Configure authenticated production registry reads
        if: (inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging') == 'production'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-promoted-benchmarks-${{ github.run_id }}
      - name: Queue missing measurements through this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VULCAN_ENV: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ (inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging') == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          STAGES: ${{ inputs.stages }}
        run: scripts/benchmark_promoted_models.py

  stage:
    name: Stage benchmark input
    needs: [resolve-vulcan-config, resolve-benchmark-runner]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !inputs.promoted_missing
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
      vulcan_config: ${{ inputs.vulcan_config || toJSON(needs.resolve-vulcan-config.outputs) }}
      devkit_runner: ${{ inputs.devkit_runner || toJSON(needs.resolve-benchmark-runner.outputs) }}
      benchmark_backend: ${{ steps.settings.outputs.backend }}
      timeout_minutes: ${{ steps.settings.outputs.timeout_minutes }}
    steps:
      - name: Verify the source run and compiled artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          [[ -n "$STAGES" ]]
          [[ "$SOURCE_BRANCH" == "$GITHUB_REF_NAME" ]]
          IFS=',' read -ra stages <<< "$STAGES"
          for stage in "${stages[@]}"; do
            [[ "$stage" == performance || "$stage" == accuracy ]]
          done
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$SOURCE_RUN_ID" || "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
          [[ "$MODEL_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$BUILD_PROFILE_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$COMPILE_INVOCATION_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "attempt=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" \
            '.head_sha == $sha and .head_branch == $branch and
             (.event == "push" or .event == "workflow_dispatch")' \
            <<< "$run_json" >/dev/null
          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -er '.run_attempt | tostring' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          artifact_name="compiled-model-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID"
          artifact_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?name=$artifact_name" \
              --jq '[.artifacts[] | select(.expired | not)] | length'
          )"
          test "$artifact_count" = "1"

      - name: Check out trusted registry tooling from the protected workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false

      - name: Download this compiled model from its source run
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: compiled-model-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Set up registry publication tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install registry publication tooling
        run: python -m pip install .

      - name: Resolve benchmark job settings
        id: settings
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          STAGES: ${{ inputs.stages }}
        run: model-registry benchmark-job "_source/models/$MODEL_ID" --build-profile "$BUILD_PROFILE_ID" --stages "$STAGES" >> "$GITHUB_OUTPUT"

      - name: Require the measured revision's board-stage tooling
        run: scripts/require_source_board_tooling.sh _source "${{ steps.settings.outputs.backend }}"

      - name: Configure authenticated production registry reads
        if: >-
          (inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging') == 'production' &&
          (inputs.source_run_id == '' || steps.settings.outputs.needs_baseline == 'true')
        id: registry-reader-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ fromJSON(inputs.vulcan_config || toJSON(needs.resolve-vulcan-config.outputs)).aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-benchmark-input-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false

      - name: Restore the current immutable compilation from the registry
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.registry-reader-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.registry-reader-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.registry-reader-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ fromJSON(inputs.vulcan_config || toJSON(needs.resolve-vulcan-config.outputs)).aws_region }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ (inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging') == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          STAGES: ${{ inputs.stages }}
        run: scripts/stage_benchmark_inputs.sh _source _compiled

      # A benchmark runs under the profile's published package, so the build must be registered whole.
      - name: Verify the registered build and its package
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
        run: |
          set -euo pipefail
          model-registry model-component-artifacts _compiled --repository _source \
            --model "$MODEL_ID" --build-profile "$BUILD_PROFILE_ID"
          test -f "_compiled/$MODEL_ID/$BUILD_PROFILE_ID/packages/default/registry-publication.json"

      - name: Retain benchmark input independently of compile-run cleanup
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Benchmark on DevKit
    needs: stage
    if: ${{ !cancelled() && needs.stage.result == 'success' && inputs.source_branch == github.ref_name }}
    environment: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
    runs-on:
      group: ${{ fromJSON(needs.stage.outputs.devkit_runner).modalix_runner_group }}
      labels: ${{ fromJSON(fromJSON(needs.stage.outputs.devkit_runner).runner_labels) }}
    timeout-minutes: ${{ fromJSON(needs.stage.outputs.timeout_minutes) }}
    permissions:
      actions: read
      contents: read
      id-token: write
    # Each stage publishes on its own outcome, so one stage's failure does not discard the other's result. A
    # stage's tests run only on its measured result and succeed once they record passed, failed or skipped.
    outputs:
      performance: ${{ steps.performance-tests.outcome }}
      accuracy: ${{ steps.accuracy-tests.outcome }}
    env:
      MODEL_ID: ${{ inputs.model_id }}
      BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
      SOURCE_BRANCH: ${{ needs.stage.outputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BENCHMARK_BACKEND: ${{ needs.stage.outputs.benchmark_backend }}
      SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
      # One orchestrator run benchmarks many builds under the same run ID, so each build gets its own scratch.
      WORK_DIR: /media/nvme/neat-tests/model-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.model_id }}-${{ inputs.build_profile_id }}
    steps:
      - name: Check out trusted tooling from the protected workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false

      - name: Download the staged compiled model output
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled

      - name: Install registry tooling in an isolated environment
        run: |
          # Platform 3.0.0 images ship without python3-venv; Core's installer adds it, but Core installs later.
          python3 -c 'import ensurepip' 2>/dev/null || sudo -n apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/model-registry-tools"
          "$RUNNER_TEMP/model-registry-tools/bin/python" -m pip install '.[tests]'
          echo "REGISTRY_PYTHON=$RUNNER_TEMP/model-registry-tools/bin/python" >> "$GITHUB_ENV"

      # A manual dispatch requests both stages by default; a stage the profile does not declare is skipped.
      - name: Select the requested stages the profile declares
        id: stages
        env:
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          "$REGISTRY_PYTHON" - "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID" "$STAGES" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from model_registry.benchmark_declarations import BENCHMARK_STAGES, benchmarked_profiles
          from model_registry.model import load_model

          model_dir, profile, stages = sys.argv[1:]
          model, requested = load_model(model_dir), stages.split(",")
          for stage in BENCHMARK_STAGES:
              declared = profile in benchmarked_profiles(model, stage)
              if stage in requested and not declared:
                  print(f"{profile} declares no {stage} benchmark; skipping it.", file=sys.stderr)
              print(f"{stage}={str(stage in requested and declared).lower()}")
          PY

      - name: Resolve and verify benchmark runtime
        id: runtime
        run: |
          set -euo pipefail
          runtime="$("$REGISTRY_PYTHON" -m model_registry resolve-benchmark-runtime --repository _source)"
          platform_version="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["devkit"]["platform_version"])' <<< "$runtime")"
          actual_platform="$(
            awk -F= '
              /^[[:space:]]*DISTRO_VERSION[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' /etc/buildinfo
          )"
          if [[ -z "$actual_platform" ]]; then
            echo "Could not read DISTRO_VERSION from /etc/buildinfo" >&2
            exit 1
          fi
          if [[ "$actual_platform" != "$platform_version" ]]; then
            echo "DevKit platform mismatch: expected $platform_version, found $actual_platform" >&2
            exit 1
          fi
          echo "Verified DevKit platform $actual_platform."
          echo "BENCHMARK_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Install trusted dataset tooling
        # Both stages read the accuracy dataset: accuracy scores it, and performance benchmarks a sample of it.
        if: env.BENCHMARK_BACKEND == 'core' && (steps.stages.outputs.accuracy == 'true' || steps.stages.outputs.performance == 'true')
        env:
          DATASET_REGISTRY_ENVIRONMENT: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
        run: |
          scripts/install_dataset_registry.sh "$REGISTRY_PYTHON" "$DATASET_REGISTRY_ENVIRONMENT"

      - name: Configure dataset reader credentials
        id: dataset-credentials
        if: env.BENCHMARK_BACKEND == 'core' && (steps.stages.outputs.accuracy == 'true' || steps.stages.outputs.performance == 'true')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ fromJSON(needs.stage.outputs.vulcan_config).dataset_aws_region }}
          role-to-assume: ${{ fromJSON(needs.stage.outputs.vulcan_config).dataset_reader_role_arn }}
          role-session-name: models-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: true
          output-env-credentials: false

      - name: Cache the accuracy dataset on NVMe
        id: dataset-cache
        if: env.BENCHMARK_BACKEND == 'core' && (steps.stages.outputs.accuracy == 'true' || steps.stages.outputs.performance == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.dataset-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.dataset-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.dataset-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ fromJSON(needs.stage.outputs.vulcan_config).dataset_aws_region }}
          AWS_DEFAULT_REGION: ${{ fromJSON(needs.stage.outputs.vulcan_config).dataset_aws_region }}
          SIMA_DATASET_S3_URI: s3://${{ fromJSON(needs.stage.outputs.vulcan_config).dataset_bucket }}
        run: scripts/cache_accuracy_dataset.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID"

      - name: Install selected Neat Core
        id: core
        # Each stage checks the dataset step itself.
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: >-
          "$REGISTRY_PYTHON" -m model_registry ensure-neat-core --repository _source --environment production

      - name: Install selected MoLE
        id: mole
        if: ${{ !cancelled() && steps.core.outcome == 'success' && env.BENCHMARK_BACKEND == 'llima' }}
        env:
          SIMA_MOLE_VENV_PATH: /media/nvme/llima/mole-venv
          PIP_CACHE_DIR: /media/nvme/llima/pip-cache
          TMPDIR: /media/nvme/llima/tmp
        run: scripts/install_mole_benchmark_runtime.sh "$BENCHMARK_RUNTIME"

      - name: Measure performance on DevKit
        id: performance
        if: >-
          ${{ !cancelled() && steps.core.outcome == 'success' && (steps.dataset-cache.outcome == 'success' ||
          steps.mole.outcome == 'success') && steps.stages.outputs.performance == 'true' }}
        run: scripts/run_model_performance.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID" _compiled _performance

      # Publication sends each recorded outcome with its report and then fails the run on a failed one.
      - name: Test the performance report with the model's performance tests
        id: performance-tests
        if: ${{ !cancelled() && steps.performance.outcome == 'success' }}
        run: |
          set -euo pipefail
          scripts/run_model_tests.sh performance "_source/models/$MODEL_ID" _performance/model-report.json \
            "$BUILD_PROFILE_ID" > _performance/test-status.txt || [[ "$(<_performance/test-status.txt)" == failed ]]

      - name: Measure accuracy on DevKit
        id: accuracy
        if: >-
          ${{ !cancelled() && steps.core.outcome == 'success' && steps.dataset-cache.outcome == 'success' &&
          steps.stages.outputs.accuracy == 'true' }}
        run: scripts/run_model_accuracy.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID" _compiled _accuracy

      - name: Test the accuracy report with the model's accuracy tests
        id: accuracy-tests
        if: ${{ !cancelled() && steps.accuracy.outcome == 'success' }}
        run: |
          set -euo pipefail
          scripts/run_model_tests.sh accuracy "_source/models/$MODEL_ID" _accuracy/model-report.json \
            "$BUILD_PROFILE_ID" > _accuracy/test-status.txt || [[ "$(<_accuracy/test-status.txt)" == failed ]]

      - name: Retain performance evidence
        if: always() && steps.stages.outputs.performance == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _performance/
          if-no-files-found: error
          retention-days: 14

      - name: Retain accuracy evidence
        if: always() && steps.stages.outputs.accuracy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _accuracy/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish benchmarks to Vulcan
    needs: [stage, benchmark]
    if: >-
      !cancelled() &&
      inputs.source_branch == github.ref_name &&
      (needs.benchmark.outputs.performance == 'success' ||
      needs.benchmark.outputs.accuracy == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      failed_tests: ${{ steps.tests.outputs.failed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Publication tooling must come from the trusted workflow revision.
          # The older source SHA remains the benchmark's provenance below.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Download performance evidence
        if: ${{ !cancelled() && needs.benchmark.outputs.performance == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: performance-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _performance
      - name: Download accuracy evidence
        if: ${{ !cancelled() && needs.benchmark.outputs.accuracy == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: accuracy-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _accuracy
      - name: Download the registered build the stages measured
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
      - id: benchmark-publisher-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ fromJSON(needs.stage.outputs.vulcan_config).aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: true
          output-env-credentials: false
      # Each measured stage publishes on its own, so one stage's failure does not discard the other's report.
      - name: Publish each measured stage's run
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.benchmark-publisher-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.benchmark-publisher-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.benchmark-publisher-credentials.outputs.aws-session-token }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ fromJSON(needs.stage.outputs.vulcan_config).artifact_bucket }}
          KMS_KEY_ID: ${{ fromJSON(needs.stage.outputs.vulcan_config).artifact_kms_key_id }}
          AWS_REGION: ${{ fromJSON(needs.stage.outputs.vulcan_config).aws_region }}
          VULCAN_ENV: ${{ inputs.environment != 'default' && inputs.environment || vars.VULCAN_ENV || 'staging' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
        run: |
          set -euo pipefail
          failed=0
          for stage in performance accuracy; do
            # Only a stage whose tests ran downloaded its evidence.
            [[ -f "_$stage/test-status.txt" ]] || continue
            model-registry publish-report "_$stage" \
              --stage "$stage" \
              --repository _source \
              --compiled-dir _compiled \
              --model "$MODEL_ID" \
              --build-profile "$BUILD_PROFILE_ID" \
              --api-url "$REGISTRY_API_URL" \
              --aws-region "$AWS_REGION" \
              --bucket "$ARTIFACT_BUCKET" \
              --kms-key-id "$KMS_KEY_ID" \
              --environment "$VULCAN_ENV" \
              --branch "$SOURCE_BRANCH" \
              --git-sha "$SOURCE_SHA" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --test-status "$(<"_$stage/test-status.txt")" || failed=1
          done
          exit "$failed"
      - name: Record the stages whose model tests failed
        id: tests
        run: |
          set -euo pipefail
          failed=()
          for stage in performance accuracy; do
            status="_$stage/test-status.txt"
            if [[ -f "$status" && "$(<"$status")" == failed ]]; then
              failed+=("$stage")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"

  # The results are published either way; a failed test still fails the run, which keeps its evidence. The check
  # is its own job, so re-running failed jobs repeats the check and never publishes the same results again.
  check:
    name: Check model tests and clean up
    needs: [benchmark, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Fail the run on a failed model test
        env:
          FAILED_STAGES: ${{ needs.publish.outputs.failed_tests }}
        run: |
          if [[ -n "$FAILED_STAGES" ]]; then
            echo "The model's tests failed on the published results of: $FAILED_STAGES" >&2
            exit 1
          fi

      # A failed stage keeps its evidence for diagnosis.
      - name: Delete benchmark input and evidence from GitHub
        if: needs.benchmark.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
        run: |
          set -euo pipefail
          # An orchestrator run holds every build's artifacts, so look each one up by name.
          for prefix in benchmark-input performance accuracy; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$prefix-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID" \
              --jq '.artifacts[].id'
          done |
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
