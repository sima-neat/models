name: Vulcan Model Benchmarking
run-name: Benchmarking (${{ inputs.model_id }}/${{ inputs.compile_invocation_id }}, ${{ inputs.build_profile_id }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vulcan environment used to benchmark the compiled model
        required: true
        default: staging
        type: choice
        options: [staging]
      source_run_id:
        description: Source workflow run containing the compiled-model artifact
        required: false
        default: ""
        type: string
      source_sha:
        description: Source revision used to compile the model
        required: true
        type: string
      source_branch:
        description: Source branch used to compile the model
        required: true
        type: string
      model_id:
        description: Model ID to benchmark
        required: true
        type: string
      build_profile_id:
        description: Build profile ID to benchmark
        required: true
        type: string
      compile_invocation_id:
        description: Compile invocation that produced the components
        required: true
        type: string
      component_ids:
        description: Comma-separated component IDs whose performance to measure, in declared order
        required: false
        default: ""
        type: string
      stages:
        description: Comma-separated DevKit stages to run (performance, accuracy)
        required: false
        default: performance,accuracy
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: model-benchmark-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha }}-${{ inputs.source_run_id }}-${{ inputs.stages }}-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
  cancel-in-progress: false

jobs:
  stage-dispatched-benchmark:
    name: Stage ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) benchmark input
    needs: resolve-dispatched-benchmark-config
    if: >-
      inputs.source_branch == github.ref_name &&
      inputs.environment == 'staging' &&
      inputs.source_sha != '' && inputs.source_branch != '' &&
      inputs.model_id != '' && inputs.build_profile_id != '' &&
      inputs.compile_invocation_id != '' && inputs.stages != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Verify the source run and compiled artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          IFS=',' read -ra stages <<< "$STAGES"
          for stage in "${stages[@]}"; do
            [[ "$stage" == performance || "$stage" == accuracy ]]
          done
          # Performance measures named components; accuracy alone measures none.
          [[ ",$STAGES," != *",performance,"* || -n "$COMPONENT_IDS" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$SOURCE_RUN_ID" || "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
          [[ "$MODEL_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$BUILD_PROFILE_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          [[ "$COMPILE_INVOCATION_ID" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for component in "${components[@]}"; do
            [[ "$component" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*$ ]]
          done
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "attempt=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" \
            '.head_sha == $sha and .head_branch == $branch and
             (.event == "push" or .event == "workflow_dispatch")' \
            <<< "$run_json" >/dev/null
          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -er '.run_attempt | tostring' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          artifact_name="compiled-model-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID"
          artifact_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
              jq --arg artifact "$artifact_name" \
                '[.artifacts[] | select(.name == $artifact and (.expired | not))] | length'
          )"
          test "$artifact_count" = "1"

      - name: Check out trusted registry tooling from the protected workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false

      - name: Download this compiled model from its source run
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: compiled-model-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Set up registry publication tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install registry publication tooling
        run: python -m pip install .

      - name: Require the measured revision's board-stage tooling
        run: scripts/require_source_board_tooling.sh _source

      - name: Restore the current immutable compilation from the registry
        if: inputs.source_run_id == ''
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL is required}"
          model-registry stage-registry-build \
            --repository _source \
            --output-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --branch "$SOURCE_BRANCH" \
            --catalog-revision "${{ inputs.source_sha }}" \
            --model-id "${{ inputs.model_id }}" \
            --build-profile-id "${{ inputs.build_profile_id }}" \
            --compile-invocation-id "${{ inputs.compile_invocation_id }}"

      - name: Check whether the compilation is already registered
        id: publication
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
        run: |
          for component_dir in "_compiled/$MODEL_ID/$BUILD_PROFILE_ID"/*/; do
            publication="${component_dir}registry-publication.json"
            [[ -f "$publication" ]] || { echo "required=true" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "required=false" >> "$GITHUB_OUTPUT"

      - name: Verify the dispatched component set
        env:
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          python - "$MODEL_ID" "$BUILD_PROFILE_ID" "$COMPILE_INVOCATION_ID" "$COMPONENT_IDS" <<'PY'
          import pathlib
          import sys

          from model_registry.benchmark_manifest import validate_benchmark_components

          model_id, profile_id, invocation_id, raw_components = sys.argv[1:]
          validate_benchmark_components(
              pathlib.Path("_source"), pathlib.Path("_compiled"),
              model_id, profile_id, invocation_id, [item for item in raw_components.split(",") if item],
          )
          PY

      - name: Configure artifact-registry publisher credentials
        id: artifact-publisher-credentials
        if: steps.publication.outputs.required == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-registry-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: true
          output-env-credentials: false

      - name: Register an unpublished compilation for benchmarking
        if: inputs.source_run_id != '' && steps.publication.outputs.required == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.artifact-publisher-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.artifact-publisher-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.artifact-publisher-credentials.outputs.aws-session-token }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish \
            --repository _source \
            --dist-dir _compiled \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment staging \
            --branch "$SOURCE_BRANCH" \
            --git-sha "$SOURCE_SHA" \
            --github-run-id "$SOURCE_RUN_ID" \
            --github-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"

      - name: Retain benchmark input independently of compile-run cleanup
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
          if-no-files-found: error
          retention-days: 1

  resolve-dispatched-benchmark-runner:
    name: Resolve dispatched benchmark DevKit runner
    if: inputs.source_branch == github.ref_name && inputs.environment == 'staging'
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  resolve-dispatched-benchmark-config:
    name: Resolve dispatched benchmark Vulcan config
    if: inputs.source_branch == github.ref_name && inputs.environment == 'staging'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment }}
    secrets: inherit

  benchmark-dispatched-model:
    name: Benchmark ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) on DevKit
    needs: [stage-dispatched-benchmark, resolve-dispatched-benchmark-runner, resolve-dispatched-benchmark-config]
    if: inputs.source_branch == github.ref_name && inputs.environment == 'staging'
    environment: ${{ inputs.environment }}
    runs-on:
      group: ${{ needs.resolve-dispatched-benchmark-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix, "vulcan-${{ inputs.environment }}"]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    # Each stage publishes on its own outcome, so one stage's failure does not discard the other's result.
    outputs:
      performance: ${{ steps.performance.outcome }}
      accuracy: ${{ steps.accuracy.outcome }}
    env:
      MODEL_ID: ${{ inputs.model_id }}
      BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
      COMPONENT_IDS: ${{ inputs.component_ids }}
      SOURCE_BRANCH: ${{ needs.stage-dispatched-benchmark.outputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIMA_CLI_AUTO_ACCEPT_UPDATE: "1"
      MEASURE_PERFORMANCE: ${{ contains(format(',{0},', inputs.stages), ',performance,') }}
      MEASURE_ACCURACY: ${{ contains(format(',{0},', inputs.stages), ',accuracy,') }}
    steps:
      - name: Check out trusted tooling from the protected workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false

      - name: Download the staged compiled model output
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled

      - name: Install registry tooling in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/model-registry-tools"
          "$RUNNER_TEMP/model-registry-tools/bin/python" -m pip install .
          echo "REGISTRY_PYTHON=$RUNNER_TEMP/model-registry-tools/bin/python" >> "$GITHUB_ENV"

      - name: Resolve and verify benchmark runtime
        id: runtime
        run: |
          set -euo pipefail
          runtime="$("$REGISTRY_PYTHON" -m model_registry resolve-benchmark-runtime --repository _source)"
          platform_version="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["devkit"]["platform_version"])' <<< "$runtime")"
          actual_platform="$(
            awk -F= '
              /^[[:space:]]*DISTRO_VERSION[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' /etc/buildinfo
          )"
          if [[ -z "$actual_platform" ]]; then
            echo "Could not read DISTRO_VERSION from /etc/buildinfo" >&2
            exit 1
          fi
          if [[ "$actual_platform" != "$platform_version" ]]; then
            echo "DevKit platform mismatch: expected $platform_version, found $actual_platform" >&2
            exit 1
          fi
          echo "Verified DevKit platform $actual_platform."
          echo "BENCHMARK_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Install trusted dataset tooling
        if: env.MEASURE_ACCURACY == 'true'
        env:
          DATASET_REGISTRY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          scripts/install_dataset_registry.sh "$REGISTRY_PYTHON" "$DATASET_REGISTRY_ENVIRONMENT"

      - name: Configure dataset reader credentials
        id: dataset-credentials
        if: env.MEASURE_ACCURACY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.dataset_aws_region }}
          role-to-assume: ${{ needs.resolve-dispatched-benchmark-config.outputs.dataset_reader_role_arn }}
          role-session-name: models-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: true
          output-env-credentials: false

      - name: Cache the accuracy dataset on NVMe
        id: dataset-cache
        if: env.MEASURE_ACCURACY == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.dataset-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.dataset-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.dataset-credentials.outputs.aws-session-token }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.dataset_aws_region }}
          AWS_DEFAULT_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.dataset_aws_region }}
          SIMA_DATASET_S3_URI: s3://${{ needs.resolve-dispatched-benchmark-config.outputs.dataset_bucket }}
        run: scripts/cache_accuracy_dataset.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID"

      - name: Install selected Neat Core
        id: core
        # A failed accuracy dataset step must not stop the performance stage.
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          target="$("$REGISTRY_PYTHON" -c 'import json, sys; print(json.load(sys.stdin)["neat_core"]["install_target"])' <<< "$BENCHMARK_RUNTIME")"
          sima-cli neat install --env production --type minimal "$target"
          "$HOME/pyneat/bin/python" -c 'import pyneat; print("Core:", pyneat.__version__, pyneat.__file__)'
          dpkg-query -W '*neat*'

      - name: Measure performance on DevKit
        id: performance
        if: ${{ !cancelled() && steps.core.outcome == 'success' && env.MEASURE_PERFORMANCE == 'true' }}
        run: scripts/run_model_performance.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID" _compiled _benchmark "$COMPONENT_IDS"

      - name: Measure accuracy on DevKit
        id: accuracy
        if: >-
          ${{ !cancelled() && steps.core.outcome == 'success' && steps.dataset-cache.outcome == 'success' &&
          env.MEASURE_ACCURACY == 'true' }}
        run: scripts/run_model_accuracy.sh "_source/models/$MODEL_ID" "$BUILD_PROFILE_ID" _compiled _accuracy

      - name: Retain benchmark evidence
        if: always() && env.MEASURE_PERFORMANCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: |
            _benchmark/*/performance-result.json
            _benchmark/*/core-benchmark.json
            _benchmark/*/performance-test.json
            _benchmark/*/benchmark.log
          if-no-files-found: error
          retention-days: 14

      - name: Retain accuracy evidence
        if: always() && env.MEASURE_ACCURACY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _accuracy/
          if-no-files-found: error
          retention-days: 14

  publish-dispatched-benchmark:
    name: Publish ${{ inputs.model_id }}/${{ inputs.compile_invocation_id }} (${{ inputs.build_profile_id }}) benchmarks to Vulcan
    needs: [benchmark-dispatched-model, resolve-dispatched-benchmark-config]
    if: >-
      !cancelled() &&
      inputs.source_branch == github.ref_name &&
      needs.resolve-dispatched-benchmark-config.result == 'success' &&
      (needs.benchmark-dispatched-model.outputs.performance == 'success' ||
      needs.benchmark-dispatched-model.outputs.accuracy == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Publication tooling must come from the trusted workflow revision.
          # The older source SHA remains the benchmark's provenance below.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the source revision as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: _source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Download performance evidence
        if: ${{ !cancelled() && needs.benchmark-dispatched-model.outputs.performance == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: benchmark-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _benchmarks
      - name: Download accuracy evidence
        if: ${{ !cancelled() && needs.benchmark-dispatched-model.outputs.accuracy == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: accuracy-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _accuracy
      - name: Download the registered compilation the accuracy measured
        if: ${{ !cancelled() && needs.benchmark-dispatched-model.outputs.accuracy == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: benchmark-input-${{ inputs.model_id }}-${{ inputs.build_profile_id }}-${{ inputs.compile_invocation_id }}
          path: _compiled
      - id: benchmark-publisher-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: true
          output-env-credentials: false
      - name: Publish each component's performance run
        if: ${{ !cancelled() && needs.benchmark-dispatched-model.outputs.performance == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.benchmark-publisher-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.benchmark-publisher-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.benchmark-publisher-credentials.outputs.aws-session-token }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMPONENT_IDS: ${{ inputs.component_ids }}
        run: |
          set -euo pipefail
          model-registry validate-benchmark-set \
            --repository _source \
            --result-root _benchmarks \
            --model-id "${{ inputs.model_id }}" \
            --build-profile-id "${{ inputs.build_profile_id }}" \
            --components "$COMPONENT_IDS" \
            --git-sha "$SOURCE_SHA"
          IFS=',' read -ra components <<< "$COMPONENT_IDS"
          for component in "${components[@]}"; do
            model-registry publish-benchmark \
              --repository _source \
              --result "_benchmarks/$component/performance-result.json" \
              --log "_benchmarks/$component/benchmark.log" \
              --schema schemas/performance-result.schema.json \
              --api-url "$REGISTRY_API_URL" \
              --aws-region "$AWS_REGION" \
              --bucket "$ARTIFACT_BUCKET" \
              --kms-key-id "$KMS_KEY_ID" \
              --environment staging \
              --branch "$SOURCE_BRANCH" \
              --git-sha "$SOURCE_SHA" \
              --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
      - name: Publish the accuracy run
        if: ${{ !cancelled() && needs.benchmark-dispatched-model.outputs.accuracy == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.benchmark-publisher-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.benchmark-publisher-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.benchmark-publisher-credentials.outputs.aws-session-token }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          ARTIFACT_BUCKET: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-dispatched-benchmark-config.outputs.artifact_kms_key_id }}
          AWS_REGION: ${{ needs.resolve-dispatched-benchmark-config.outputs.aws_region }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          model-registry publish-accuracy \
            --repository _source \
            --compiled-dir _compiled \
            --result _accuracy/accuracy-result.json \
            --log _accuracy/accuracy.log \
            --api-url "$REGISTRY_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment staging \
            --branch "$SOURCE_BRANCH" \
            --git-sha "$SOURCE_SHA" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  cleanup-dispatched-benchmark-artifacts:
    name: Clean up dispatched benchmark artifacts
    needs: [benchmark-dispatched-model, publish-dispatched-benchmark]
    # A failed stage keeps its evidence for diagnosis.
    if: >-
      !cancelled() &&
      needs.benchmark-dispatched-model.result == 'success' &&
      needs.publish-dispatched-benchmark.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete benchmark input and evidence from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          BUILD_PROFILE_ID: ${{ inputs.build_profile_id }}
          COMPILE_INVOCATION_ID: ${{ inputs.compile_invocation_id }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"benchmark-input-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID\" or .name == \"benchmark-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID\" or .name == \"accuracy-$MODEL_ID-$BUILD_PROFILE_ID-$COMPILE_INVOCATION_ID\") | .id" |
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
