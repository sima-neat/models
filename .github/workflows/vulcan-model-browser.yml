name: Vulcan Model Browser

on:
  push:
    branches:
      - main
      - develop
      - feat/artifact-browser
    paths:
      - ".github/workflows/vulcan-model-browser.yml"
      - "artifact-browser/**"
      - "docs/**"
      - "website/**"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-vulcan-config:
    name: Resolve staging Vulcan config
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: staging

  build:
    name: Package model browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install portal dependencies
        working-directory: website
        run: npm ci

      - name: Check documentation TypeScript
        working-directory: website
        run: npm run typecheck

      - name: Assemble catalog and developer documentation
        working-directory: website
        env:
          DOCS_SITE_URL: https://developer-stg.sima.ai
          DOCS_BASE_URL: /models/
        run: npm run build:portal

      - name: Set up registry tooling for the preview API
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install registry tooling for the preview API
        run: python -m pip install .

      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      # A portal that does not load or render fails here, before anything is published.
      - name: Smoke-test the assembled portal
        working-directory: website
        run: npm run smoke:portal

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulcan-model-browser-staging
          path: website/portal-build/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish staging model browser
    needs:
      - resolve-vulcan-config
      - build
    uses: sima-neat/.github/.github/workflows/vulcan-publish-static-site.yml@main
    with:
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      site_key: DOCS
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.docs_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.docs_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.docs_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-vulcan-config.outputs.sysdoc_cloudfront_distribution_id }}
      artifact_pattern: vulcan-model-browser-staging
      s3_prefix: models
      cloudfront_paths: "/models /models/*"
