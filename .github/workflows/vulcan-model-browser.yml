name: Vulcan Model Browser

on:
  push:
    branches:
      - main
      - develop
      - feat/artifact-browser
    paths:
      - ".github/workflows/vulcan-model-browser.yml"
      - "artifact-browser/**"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-staging
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-vulcan-config:
    name: Resolve staging Vulcan config
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: staging

  build:
    name: Package model browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp artifact-browser/index.html _site/
          cp artifact-browser/app.js _site/
          cp artifact-browser/styles.css _site/
          cp artifact-browser/config.js _site/
          cp artifact-browser/favicon.svg _site/

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulcan-model-browser-staging
          path: _site/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish staging model browser
    needs:
      - resolve-vulcan-config
      - build
    uses: sima-neat/.github/.github/workflows/vulcan-publish-static-site.yml@main
    with:
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      site_key: DOCS
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.docs_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.docs_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.docs_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-vulcan-config.outputs.sysdoc_cloudfront_distribution_id }}
      artifact_pattern: vulcan-model-browser-staging
      s3_prefix: models
      cloudfront_paths: "/models /models/*"
