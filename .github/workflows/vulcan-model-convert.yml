name: Vulcan Model Convert
run-name: Convert ${{ inputs.model }} (${{ inputs.conversion }})
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Registry and runner environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      model:
        description: Model directory ID
        required: true
        type: string
      conversion:
        description: Conversion entry in the model's model.yaml
        default: default
        type: string
permissions:
  contents: read
jobs:
  config:
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ inputs.environment }}
    secrets: inherit
  convert:
    needs: config
    # The resolver emits stg/prod aliases; GitHub environments use canonical names.
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, linux, arm64, "${{ inputs.environment == 'staging' && 'vulcan-stg' || 'vulcan-production' }}", ubuntu, default]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ needs.config.outputs.aws_region }}
      REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
      ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
      KMS_KEY_ID: ${{ needs.config.outputs.artifact_kms_key_id }}
      VULCAN_ENVIRONMENT: ${{ inputs.environment }}
      MODEL_ID: ${{ inputs.model }}
      CONVERSION: ${{ inputs.conversion }}
      EXPORT_VENV: /mnt/nvme/model-export-${{ github.run_id }}-${{ github.run_attempt }}-venv
      EXPORT_DIR: /mnt/nvme/model-export-${{ github.run_id }}-${{ github.run_attempt }}
      PIP_CACHE_DIR: /mnt/nvme/pip-cache
      MODEL_REGISTRY_CACHE: /mnt/nvme/model-sources
      HF_HOME: /mnt/nvme/huggingface
      TORCH_HOME: /mnt/nvme/torch
      TMPDIR: /mnt/nvme/tmp
      PYTHONPATH: ""
      PYTHONHOME: ""
      PYTHONNOUSERSITE: "1"
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Validate model selection
        run: |
          [[ "$MODEL_ID" =~ ^[a-z][a-z0-9_]*$ ]]
          [[ "$CONVERSION" == default ]]
          test -f "models/$MODEL_ID/scripts/convert.py"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: onnx-python312-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('models/{0}/scripts/requirements-convert.txt', inputs.model)) }}
      - name: Convert and smoke-test with the model's convert script
        env:
          CONVERSION_VENV: ${{ env.EXPORT_VENV }}
        run: |
          mkdir -p "$TMPDIR"
          scripts/run_model_conversion.sh "models/$MODEL_ID" "$CONVERSION" "$EXPORT_DIR"
      - name: Test the converted model with the model's conversion tests
        run: |
          "$EXPORT_VENV/bin/python" -E -s -m pip --isolated install --cache-dir "$PIP_CACHE_DIR" '.[tests]'
          entrypoint="$("$EXPORT_VENV/bin/python" -E -s -m model_registry conversion-entrypoint "models/$MODEL_ID")"
          outcome="$(REGISTRY_PYTHON="$EXPORT_VENV/bin/python" \
            scripts/run_model_tests.sh conversion "models/$MODEL_ID" "$EXPORT_DIR/$entrypoint")"
          [[ "$outcome" == passed ]]
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
      - name: Publish validated conversion to the registry
        run: |
          "$EXPORT_VENV/bin/python" -E -s -m model_registry publish-conversion "$MODEL_ID" "$EXPORT_DIR" \
            --api-url "$REGISTRY_API_URL" --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" --aws-region "$AWS_REGION" --validation passed | tee "$EXPORT_DIR/registry-publication.json"
          cat "$EXPORT_DIR/registry-publication.json" >> "$GITHUB_STEP_SUMMARY"
