name: Vulcan Model Orchestrator

run-name: Vulcan Model Orchestrator (${{ vars.VULCAN_ENV }}) — ${{ github.ref_name }}

on:
  # Every push publishes its revision's catalog; unchanged fingerprints compile and benchmark nothing.
  push:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model IDs; leave empty to plan the entire catalog
        required: false
        type: string
      profiles:
        description: Comma-separated build profile IDs; on-demand models require explicit model and profile IDs
        required: false
        type: string
      components:
        description: Comma-separated component IDs within selected models; leave empty to plan every component
        required: false
        type: string
      base_branch:
        description: Optional branch whose catalog this branch reuses builds from, in place of the resolved base branches
        required: false
        type: string
      force_rebuild_all:
        description: Recompile every selected invocation regardless of its compile fingerprint
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A push to develop or main waits for the running push run of that ref, so a merge never cancels compiles in
# flight. GitHub keeps one waiting run per group: a newer push replaces the waiting one, whose changes the newer
# revision also holds. On any other branch a newer push cancels the running one; the next run plans the builds
# it left pending. Each manual dispatch runs to completion.
concurrency:
  group: >-
    model-compile-${{ github.ref }}-${{ vars.VULCAN_ENV }}${{
    github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' &&
    github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  select:
    name: Validate the catalog and resolve the build environment
    runs-on: ubuntu-latest
    outputs:
      vulcan_environment: ${{ steps.environment.outputs.vulcan_environment }}
      runner_environment: ${{ steps.environment.outputs.runner_environment }}
      model_compiler_version: ${{ steps.compiler.outputs.version }}
      model_compiler_label: ${{ steps.compiler.outputs.label }}
      model_compiler_identity: ${{ steps.compiler.outputs.identity }}
      base_branches: ${{ steps.base.outputs.base_branches }}
      publishable: ${{ steps.scope.outputs.publishable }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Validate every model and the taxonomy
        run: model-registry validate-models --repository .

      - name: Resolve Vulcan environment
        id: environment
        env:
          REQUESTED_ENVIRONMENT: ${{ vars.VULCAN_ENV }}
        run: |
          set -euo pipefail
          environment="${REQUESTED_ENVIRONMENT:?Set VULCAN_ENV to staging or production}"
          case "$environment" in
            staging) runner_environment="vulcan-stg" ;;
            production) runner_environment="vulcan-production" ;;
            *) echo "Unsupported environment: $environment" >&2; exit 2 ;;
          esac
          echo "vulcan_environment=$environment" >> "$GITHUB_OUTPUT"
          echo "runner_environment=$runner_environment" >> "$GITHUB_OUTPUT"

      - name: Resolve Model Compiler dependency
        id: compiler
        run: |
          set -euo pipefail
          resolution="$(model-registry resolve-compiler --repository .)"
          version="$(jq -er '.version' <<< "$resolution")"
          label="$(jq -er '.label' <<< "$resolution")"
          identity="$(jq -er '.identity' <<< "$resolution")"
          {
            echo "version=$version"
            echo "label=$label"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"
          echo "Model Compiler dependency: \`$identity\` (\`$label\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the base branches whose catalogs builds may come from
        id: base
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PREFERRED_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          preferred_args=()
          if [[ -n "${PREFERRED_BRANCH:-}" ]]; then
            preferred_args=(--preferred-branch "$PREFERRED_BRANCH")
          fi
          resolution="$(model-registry resolve-base \
            --repository . \
            --current-branch "$CURRENT_BRANCH" \
            --head "$HEAD_SHA" \
            "${preferred_args[@]}")"
          base_branches="$(jq -er '.base_branches | join(",")' <<< "$resolution")"
          echo "base_branches=$base_branches" >> "$GITHUB_OUTPUT"
          echo "Base branches: \`${base_branches:-none}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether this run updates the catalog
        id: scope
        env:
          REQUESTED_PROFILES: ${{ inputs.profiles }}
          REQUESTED_COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          publishable=true
          if [[ -n "${REQUESTED_PROFILES:-}" || -n "${REQUESTED_COMPONENTS:-}" ]]; then
            publishable=false
            echo "Targeted dispatch skips ordinary build updates; finalized on-demand candidates are selected in their feature catalog." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

  # Portal checks run independently of model processing and gate browser publication.
  portal:
    name: Check the model browser portal
    uses: ./.github/workflows/developer-docs.yml
    with:
      environment: staging

  resolve-vulcan-config:
    name: Resolve Vulcan publication config
    needs: select
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ needs.select.outputs.vulcan_environment }}
    secrets: inherit

  # The run's benchmarks share one resolution: every resolver call uploads the same artifact name.
  resolve-benchmark-runner:
    name: Resolve the benchmark DevKit runner
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main
    with:
      # DevKit placement is independent of registry and dataset selection.
      runner-labels: '["self-hosted", "Linux", "ARM64", "modalix", "modalix-som-16gig", "model-registry", "vulcan-staging"]'

  # Frontend staging publication is independent of the model build/registry environment.
  resolve-staging-browser-config:
    name: Resolve staging model browser publication config
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: staging
    secrets: inherit

  # Staging serves the model browser of main and develop: the portal this run built and checked.
  # Both branches publish to the same prefix, and a publish deletes files missing from its site, so
  # publishes queue in one group instead of overlapping.
  publish-model-browser:
    name: Publish the staging model browser
    needs: [portal, resolve-staging-browser-config]
    concurrency:
      group: ${{ github.repository }}-model-browser-staging
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-publish-static-site.yml@main
    with:
      environment_name: ${{ needs.resolve-staging-browser-config.outputs.vulcan_env }}
      site_key: DOCS
      aws_region: ${{ needs.resolve-staging-browser-config.outputs.aws_region }}
      bucket: ${{ needs.resolve-staging-browser-config.outputs.docs_bucket }}
      role_to_assume: ${{ needs.resolve-staging-browser-config.outputs.docs_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-staging-browser-config.outputs.docs_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-staging-browser-config.outputs.sysdoc_cloudfront_distribution_id }}
      artifact_pattern: model-browser-site
      s3_prefix: models
      cloudfront_paths: "/models /models/*"

  plan:
    name: Plan compilations and benchmarks against the registry
    needs: [select, resolve-vulcan-config]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    outputs:
      conversion_sources: ${{ steps.plan.outputs.conversion_sources }}
      compile_count: ${{ steps.plan.outputs.compile_count }}
      compile_matrix: ${{ steps.plan.outputs.compile_matrix }}
      benchmark_count: ${{ steps.plan.outputs.benchmark_count }}
      benchmark_matrix: ${{ steps.plan.outputs.benchmark_matrix }}
      candidate_matrix: ${{ steps.plan.outputs.candidate_matrix }}
      candidate_count: ${{ steps.plan.outputs.candidate_count }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure registry planning credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-plan-${{ github.run_id }}

      - name: Compare fingerprints with published runs
        id: plan
        env:
          VULCAN_ARTIFACT_REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ needs.select.outputs.vulcan_environment == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          COMPILER_IDENTITY: ${{ needs.select.outputs.model_compiler_identity }}
          BASE_BRANCHES: ${{ needs.select.outputs.base_branches }}
          REQUESTED_MODELS: ${{ inputs.models }}
          REQUESTED_PROFILES: ${{ inputs.profiles }}
          REQUESTED_COMPONENTS: ${{ inputs.components }}
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild_all }}
          MANUAL_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          : "${REGISTRY_READ_API_URL:?VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL is required}"
          scope_args=()
          [[ -z "${REQUESTED_MODELS:-}" ]] || scope_args+=(--models "$REQUESTED_MODELS")
          [[ -z "${REQUESTED_PROFILES:-}" ]] || scope_args+=(--profiles "$REQUESTED_PROFILES")
          [[ -z "${REQUESTED_COMPONENTS:-}" ]] || scope_args+=(--components "$REQUESTED_COMPONENTS")
          [[ "${FORCE_REBUILD_ALL:-false}" != "true" ]] || scope_args+=(--force-rebuild-all)
          if [[ "$MANUAL_BUILD" == "true" && -n "${REQUESTED_MODELS:-}" ]]; then
            scope_args+=(--include-on-demand)
          fi
          plan="$(model-registry plan-stages --repository . \
            --read-api-url "$REGISTRY_READ_API_URL" \
            --compiler-version "$COMPILER_IDENTITY" \
            --branch "$GITHUB_REF_NAME" --base-branches "$BASE_BRANCHES" \
            "${scope_args[@]}")"
          echo "conversion_sources=$(jq -c .conversion_sources <<< "$plan")" >> "$GITHUB_OUTPUT"
          compile_matrix="$(jq -c '.compile' <<< "$plan")"
          # Benchmarks run on Modalix boards only.
          benchmark_matrix="$(jq -c '{include: [.benchmark.include[] | select(.target == "modalix")]}' <<< "$plan")"
          compile_count="$(jq -r '.include | length' <<< "$compile_matrix")"
          candidate_matrix="$(jq -c '{include: [.include[] | select(.build_on_demand and .runner_script != "scripts/run_llima_compilation.sh") | {model_id, build_profile_id}] | unique}' <<< "$compile_matrix")"
          candidate_count="$(jq -r '.include | length' <<< "$candidate_matrix")"
          benchmark_count="$(jq -r '.include | length' <<< "$benchmark_matrix")"
          {
            echo "compile_matrix=$compile_matrix"
            echo "compile_count=$compile_count"
            echo "candidate_matrix=$candidate_matrix"
            echo "candidate_count=$candidate_count"
            echo "benchmark_matrix=$benchmark_matrix"
            echo "benchmark_count=$benchmark_count"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Compile: $compile_count invocation(s)."
            echo "Benchmarks for reused builds: $benchmark_count invocation(s)."
            jq -r '.benchmark.include[] | "- \(.model_id)/\(.build_profile_id)/\(.compile_invocation_id): \(.stages | join(", "))"' <<< "$plan"
          } >> "$GITHUB_STEP_SUMMARY"

  authorize-runner-classes:
    name: Authorize compile runner classes
    needs: [select, plan, resolve-vulcan-config]
    if: needs.plan.outputs.compile_count != '0'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.authorization.outputs.matrix }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure Vulcan specification reader credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.config_reader_role_arn }}
          role-session-name: model-runner-admission-${{ github.run_id }}

      - name: Authorize the selected runner requests
        id: authorization
        env:
          SELECTED_MATRIX: ${{ needs.plan.outputs.compile_matrix }}
          VULCAN_CONFIG_S3_URI: ${{ needs.resolve-vulcan-config.outputs.config_s3_uri }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/selected-matrix.json"
          spec_file="$RUNNER_TEMP/vulcan-environment.json"
          printf '%s' "$SELECTED_MATRIX" > "$matrix_file"
          aws s3 cp "$VULCAN_CONFIG_S3_URI" "$spec_file" --only-show-errors
          authorized="$(model-registry authorize-runner-matrix \
            --matrix "$matrix_file" \
            --vulcan-spec "$spec_file" \
            --repository-name "$GITHUB_REPOSITORY")"
          echo "matrix=$authorized" >> "$GITHUB_OUTPUT"
          count="$(jq -er '.include | length' <<< "$authorized")"
          elevated="$(jq -r '[.include[] | select(.runner_class != "default")] | length' <<< "$authorized")"
          echo "Authorized $count compile invocation(s), including $elevated elevated runner request(s)." \
            >> "$GITHUB_STEP_SUMMARY"

  initialize-catalog:
    name: Mark the selected builds pending in the catalog
    needs: [select, plan, resolve-vulcan-config, authorize-runner-classes]
    if: >-
      !cancelled() &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.authorize-runner-classes.result == 'success' &&
      (needs.select.outputs.publishable == 'true' ||
       (github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' &&
        contains(fromJSON(needs.authorize-runner-classes.outputs.matrix).include.*.build_on_demand, true)))
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-catalog-initialize-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish the pending invocation plan
        env:
          BASE_BRANCHES: ${{ needs.select.outputs.base_branches }}
          FORCE_REBUILD_ALL: ${{ inputs.force_rebuild_all }}
          SELECTED_MATRIX: ${{ needs.authorize-runner-classes.outputs.matrix }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          MODEL_REGISTRY_CONVERSIONS: ${{ needs.plan.outputs.conversion_sources || '{}' }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ needs.select.outputs.vulcan_environment == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/selected-matrix.json"
          printf '%s' "$SELECTED_MATRIX" > "$matrix_file"
          force_args=()
          if [[ "$FORCE_REBUILD_ALL" == "true" ]]; then
            force_args+=(--force-rebuild-all)
          fi
          model-registry publish-catalog --repository . "${force_args[@]}" \
            --selected-matrix "$matrix_file" \
            --api-url "$REGISTRY_API_URL" --read-api-url "$REGISTRY_READ_API_URL" \
            --aws-region "$AWS_REGION" --branch "$GITHUB_REF_NAME" \
            --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --base-branches "$BASE_BRANCHES" --git-sha "$GITHUB_SHA"

  compile:
    name: ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} (${{ matrix.build_profile_id }})
    needs: [select, plan, resolve-vulcan-config, resolve-benchmark-runner, authorize-runner-classes, initialize-catalog]
    if: >-
      !cancelled() &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.resolve-benchmark-runner.result == 'success' &&
      needs.authorize-runner-classes.result == 'success' &&
      (needs.initialize-catalog.result == 'success' ||
       (needs.select.outputs.publishable != 'true' && needs.initialize-catalog.result == 'skipped'))
    permissions:
      actions: write
      contents: read
      id-token: write
    # Each build publishes on its own; a failed build leaves its catalog entry pending.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize-runner-classes.outputs.matrix) }}
    uses: ./.github/workflows/vulcan-model-compile.yml
    with:
      entry: ${{ toJSON(matrix) }}
      vulcan_environment: ${{ needs.select.outputs.vulcan_environment }}
      runner_environment: ${{ needs.select.outputs.runner_environment }}
      model_compiler_version: ${{ needs.select.outputs.model_compiler_version }}
      model_compiler_label: ${{ needs.select.outputs.model_compiler_label }}
      base_branches: ${{ needs.select.outputs.base_branches }}
      publishable: ${{ needs.select.outputs.publishable == 'true' }}
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      conversion_sources: ${{ needs.plan.outputs.conversion_sources }}
      dataset_bucket: ${{ needs.resolve-vulcan-config.outputs.dataset_bucket }}
      artifact_bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      artifact_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      vulcan_config: ${{ toJSON(needs.resolve-vulcan-config.outputs) }}
      devkit_runner: ${{ toJSON(needs.resolve-benchmark-runner.outputs) }}
    secrets: inherit

  publish-candidates:
    name: Finalize candidate ${{ matrix.model_id }}/${{ matrix.build_profile_id }}
    needs: [select, plan, compile, resolve-vulcan-config]
    if: >-
      !cancelled() && needs.plan.outputs.candidate_count != '0' &&
      (needs.compile.result == 'success' || needs.compile.result == 'failure')
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.candidate_matrix) }}
    env:
      MODEL_REGISTRY_CONVERSIONS: ${{ needs.plan.outputs.conversion_sources || '{}' }}
      MODEL_ID: ${{ matrix.model_id }}
      BUILD_PROFILE_ID: ${{ matrix.build_profile_id }}
      REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
      MODEL_REGISTRY_IAM_READ_API_URL: ${{ needs.select.outputs.vulcan_environment == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
      REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
      AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .

      - name: Download every invocation of this model/profile
        uses: actions/download-artifact@v7
        with:
          pattern: compiler-output-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-*
          path: _invocations

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore publication receipts from earlier attempts
        if: github.run_attempt != '1'
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-*
          path: _candidate
          merge-multiple: true

      - name: Publish and finalize the complete candidate
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          model-registry publish-candidate --repository . --dist-dir _invocations --output-dir _candidate \
            --model "$MODEL_ID" --build-profile "$BUILD_PROFILE_ID" \
            --api-url "$REGISTRY_API_URL" --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" --branch "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish this candidate in the feature-branch catalog
        if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          model-registry publish-branch-deployment --candidate _candidate/candidate.json \
            --api-url "$REGISTRY_API_URL" --read-api-url "$REGISTRY_READ_API_URL" --aws-region "$AWS_REGION"

      - name: Retain publication receipts even when publication fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.model_id }}-${{ matrix.build_profile_id }}-${{ github.run_attempt }}
          path: |
            _candidate/candidate.json
            _candidate/publication.json
            _candidate/branch-publication.json
            _candidate/uploads/*.json
          if-no-files-found: ignore
          retention-days: 14

  publish-catalog:
    name: Publish the catalog at this revision
    needs: [select, resolve-vulcan-config, plan, initialize-catalog, compile]
    if: >-
      !cancelled() &&
      needs.select.outputs.publishable == 'true' &&
      needs.resolve-vulcan-config.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.compile_count == '0' || needs.initialize-catalog.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-catalog-${{ github.run_id }}-${{ github.run_attempt }}

      # Each build already published itself. This snapshot carries metadata-only changes and, when
      # nothing compiles, pins the catalog revision the reused builds' benchmarks read.
      - name: Publish and promote the catalog snapshot
        env:
          BASE_BRANCHES: ${{ needs.select.outputs.base_branches }}
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          MODEL_REGISTRY_CONVERSIONS: ${{ needs.plan.outputs.conversion_sources || '{}' }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ needs.select.outputs.vulcan_environment == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: |
          set -euo pipefail
          : "${REGISTRY_API_URL:?VULCAN_ARTIFACT_REGISTRY_API_URL is required}"
          : "${REGISTRY_READ_API_URL:?VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL is required}"
          model-registry publish-catalog \
            --repository . \
            --api-url "$REGISTRY_API_URL" \
            --read-api-url "$REGISTRY_READ_API_URL" \
            --aws-region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --kms-key-id "$KMS_KEY_ID" \
            --environment "$VULCAN_ENVIRONMENT" \
            --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --branch "$GITHUB_REF_NAME" \
            --base-branches "$BASE_BRANCHES" \
            --git-sha "$GITHUB_SHA"

  # Benchmarks the reused builds still lack, one call per build. The pending catalog already links every reused
  # build, so its benchmarks need not wait for compiles.
  benchmark:
    name: ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} (${{ matrix.build_profile_id }})
    needs: [select, plan, resolve-vulcan-config, resolve-benchmark-runner, initialize-catalog]
    if: >-
      !cancelled() &&
      needs.initialize-catalog.result == 'success' &&
      needs.resolve-benchmark-runner.result == 'success' &&
      needs.select.outputs.publishable == 'true' &&
      needs.plan.outputs.benchmark_count != '0'
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.benchmark_matrix) }}
    uses: ./.github/workflows/vulcan-model-benchmarking.yml
    with:
      environment: ${{ needs.select.outputs.vulcan_environment }}
      source_sha: ${{ github.sha }}
      source_branch: ${{ github.ref_name }}
      model_id: ${{ matrix.model_id }}
      build_profile_id: ${{ matrix.build_profile_id }}
      compile_invocation_id: ${{ matrix.compile_invocation_id }}
      stages: ${{ join(matrix.stages, ',') }}
      vulcan_config: ${{ toJSON(needs.resolve-vulcan-config.outputs) }}
      devkit_runner: ${{ toJSON(needs.resolve-benchmark-runner.outputs) }}
    secrets: inherit

  # Without compiles the pending catalog is skipped, so the snapshot is the catalog the benchmarks read.
  benchmark-without-compiles:
    name: ${{ matrix.model_id }}/${{ matrix.compile_invocation_id }} (${{ matrix.build_profile_id }})
    needs: [select, plan, resolve-vulcan-config, resolve-benchmark-runner, publish-catalog]
    if: >-
      !cancelled() &&
      needs.plan.outputs.compile_count == '0' &&
      needs.publish-catalog.result == 'success' &&
      needs.resolve-benchmark-runner.result == 'success' &&
      needs.plan.outputs.benchmark_count != '0'
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.benchmark_matrix) }}
    uses: ./.github/workflows/vulcan-model-benchmarking.yml
    with:
      environment: ${{ needs.select.outputs.vulcan_environment }}
      source_sha: ${{ github.sha }}
      source_branch: ${{ github.ref_name }}
      model_id: ${{ matrix.model_id }}
      build_profile_id: ${{ matrix.build_profile_id }}
      compile_invocation_id: ${{ matrix.compile_invocation_id }}
      stages: ${{ join(matrix.stages, ',') }}
      vulcan_config: ${{ toJSON(needs.resolve-vulcan-config.outputs) }}
      devkit_runner: ${{ toJSON(needs.resolve-benchmark-runner.outputs) }}
    secrets: inherit

  # A merge into main is a release: its complete catalog becomes the selection customers on its platform and Core
  # see, and the platform's default. The registry rejects a catalog with pending builds or unmeasured benchmarks.
  publish-selection:
    name: Publish the platform and Core selection
    needs: [select, resolve-vulcan-config, publish-catalog, benchmark, benchmark-without-compiles]
    if: >-
      !cancelled() &&
      github.ref_name == 'main' &&
      needs.publish-catalog.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.vulcan_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry tooling
        run: python -m pip install .

      - name: Configure artifact-registry publisher credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLISHER_ROLE_ARN }}
          role-session-name: models-selection-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the selection and the platform default
        env:
          REGISTRY_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          MODEL_REGISTRY_IAM_READ_API_URL: ${{ needs.select.outputs.vulcan_environment == 'production' && vars.VULCAN_ARTIFACT_REGISTRY_API_URL || '' }}
          REGISTRY_READ_API_URL: ${{ vars.VULCAN_ARTIFACT_REGISTRY_PUBLIC_READ_URL || vars.VULCAN_ARTIFACT_REGISTRY_API_URL }}
          AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          VULCAN_ENVIRONMENT: ${{ needs.select.outputs.vulcan_environment }}
        run: >-
          model-registry publish-selection
          --repository .
          --api-url "$REGISTRY_API_URL"
          --read-api-url "$REGISTRY_READ_API_URL"
          --aws-region "$AWS_REGION"
          --bucket "$ARTIFACT_BUCKET"
          --kms-key-id "$KMS_KEY_ID"
          --environment "$VULCAN_ENVIRONMENT"
          --github-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --branch "$GITHUB_REF_NAME"
          --git-sha "$GITHUB_SHA"

  report-partial-publication:
    name: Report failed model builds
    needs: [plan, compile, publish-catalog]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.compile_count != '0'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: List the builds that did not publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$RUNNER_TEMP/run-jobs.json"
          failed="$RUNNER_TEMP/failed-model-jobs.json"
          # GitHub answers HTTP 502 for 100 jobs per page on a run with about 100 jobs; 50 succeeds.
          for attempt in 1 2 3; do
            if gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > "$jobs"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Could not list this run's jobs, so the builds that did not publish are unknown."
              exit 1
            fi
            sleep $(( attempt * 15 ))
          done
          # A build's own jobs end in / Compile or / Publish; its nested benchmark jobs report their own failures.
          jq '[.[].jobs[] | select(
                (.name | test(" / (Compile|Publish)$")) and
                .conclusion != "success" and .conclusion != "skipped"
              ) | {name, conclusion, html_url}]' "$jobs" > "$failed"
          count="$(jq 'length' "$failed")"
          if (( count == 0 )); then
            echo "All selected model builds published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Partial model publication"
            echo
            echo "Every other build published on its own. These jobs failed or were cancelled; their catalog entries stay pending:"
            jq -r '.[] | "- [\(.name)](\(.html_url)) — \(.conclusion)"' "$failed"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$count model build job(s) did not publish."
          exit 1
