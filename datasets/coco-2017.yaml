# What every model evaluating its accuracy on COCO 2017 must report, by the model's task.
name: COCO 2017
required_metrics:
  object_detection: [coco_map]
  instance_segmentation: [coco_mask_map]
  pose_estimation: [coco_keypoint_map]
  # Masks from each object's ground-truth box as the prompt.
  promptable_segmentation: [coco_mask_map]
