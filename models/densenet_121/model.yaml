# DenseNet-161 and DenseNet-169 compile for over 90 minutes, so this model also builds only on request.
build-on-demand: true
display_name: DenseNet-121
description: Classifies an image into one of the 1,000 ImageNet classes.
example_app: https://developer.sima.ai/examples/app/classification%2Fimage-classification-explorer
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: densenet

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from torchvision's DenseNet-121 ImageNet weights (IMAGENET1K_V1, BSD-3-Clause) as published in timm/densenet121.tv_in1k, and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/timm/densenet121.tv_in1k
  revision: f0d0f2698a02cb133b09d48396db6e1e46fe9f3b
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/densenet.py

resources:
  license:
    # timm publishes the checkpoint under Apache-2.0; the weights come from torchvision under BSD-3-Clause.
    source:
      uri: https://raw.githubusercontent.com/huggingface/pytorch-image-models/c709c9a4a26af45d01221caadfdc6b00a9622630/LICENSE
      sha256: 71b111620fa32c17a80ccd6db2da759d31a591e497d8b5f382174f59d1b59d49
      size_bytes: 11343
    install_path: licenses/LICENSE
  license_torchvision:
    source:
      uri: https://raw.githubusercontent.com/pytorch/vision/134f6382956071833f05f072763c03f9858453f2/LICENSE
      sha256: 6502f676851cfe25f8af75531dfb32375b7325b73c37e7b43741fa422893e71d
      size_bytes: 1517
    install_path: licenses/LICENSE-torchvision

conversion:
  source:
    repository: timm/densenet121.tv_in1k
    revision: f0d0f2698a02cb133b09d48396db6e1e46fe9f3b
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: c894c6d9caa317a8ca1942986dee7a16a86c77734a4d691d2abe05389cfef358, size_bytes: 32334434}
      config.json: {sha256: f667ea99fd6e02b9f91ab67a5264c9e26ad4d4d408f0cfbad096a27bacc49ff1, size_bytes: 579}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 20

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 5}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.875, bicubic, FP32
  note: timm's densenet121.tv_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.74750, top5_accuracy: 0.92158}
