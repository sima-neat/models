display_name: DenseNet-161
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: densenet

license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Derived from torchvision's DenseNet-161 ImageNet weights (IMAGENET1K_V1) as published in timm/densenet161.tv_in1k, and distributed under BSD-3-Clause.

upstream:
  repository: https://huggingface.co/timm/densenet161.tv_in1k
  revision: a037a91d210d8dd8fd8e1cb8b8e53a093e3b2a2c
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/densenet.py

conversion:
  source:
    repository: timm/densenet161.tv_in1k
    revision: a037a91d210d8dd8fd8e1cb8b8e53a093e3b2a2c
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: a84032cb6405dc38f0b92f2363a6b13fcf326e4df4ea4698fc58be66061da90f, size_bytes: 115717302}
      config.json: {sha256: bfbbc5d13aa4dedd17950ec197becab845383cc7d034cfefeec68412b81ccb29, size_bytes: 579}

compilation:
  format: onnx
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/densenet_161/02c808cf10968376808a811d4a1b0b572c555ddddc037e240e3f177b16aee860/41593169006-1/model.onnx
    sha256: 02c808cf10968376808a811d4a1b0b572c555ddddc037e240e3f177b16aee860
    size_bytes: 115684121

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 1000

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.875, bicubic, FP32
  note: timm's densenet161.tv_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.77384, top5_accuracy: 0.93656}
