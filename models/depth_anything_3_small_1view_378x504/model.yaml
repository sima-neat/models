display_name: Depth Anything 3 Small
description: Single-view relative depth estimation at 378×504 (4:3).
model_type: vision
tasks: [depth_estimation]
modalities:
  inputs: [image]
  outputs: [depth_map]
architecture: depth_anything_3

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Depth Anything 3 is developed by ByteDance Seed and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/depth-anything/DA3-SMALL
  revision: e08cab65ca0ec38e7826075418411ab90cab4da3
  derived_from: https://github.com/ByteDance-Seed/Depth-Anything-3/tree/41736238f5bced4debf3f2a12375d2466874866d

conversion:
  source:
    repository: depth-anything/DA3-SMALL
    revision: e08cab65ca0ec38e7826075418411ab90cab4da3
    main_file: model.safetensors
    files:
      model.safetensors:
        sha256: 364492e38a3a06d221ac75da7f6621ada3f2361cd24fde11ba79091e9f40efcf
        size_bytes: 137248940
      config.json:
        sha256: a486e29e82b7ab4a7d4cefc1ea4526cfe2ae438a572c8ca98917cfbcde7447d2
        size_bytes: 1202

compilation:
  format: onnx
  source: conversion

# BF16 activations and per-token dynamic quantization do not need calibration images.
build_profiles:
  w8a16:
    components:
      model:
        parameters: {precision: w8a16, input_shape: [1, 3, 378, 504]}

accuracy:
  # All 654 official test images are distributed across these archive's val/cal/test directories; no train images.
  datasets:
  - {id: nyu-depth-v2, variant: default, sha256: cd2ac66f8957ef5dee03124dda93c8557002d7d7ab1f14502a232b4bf169a77a, size_bytes: 346009575}

performance: {}

reference_metrics:
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset: {id: nyu-depth-v2, split: test}
  conditions: >-
    FP32 ONNX; 654 NYU test images; 378x504; original PNG/float32 depth;
    Eigen crop; per-image inverse-depth scale/shift alignment.
  note: Full 4:3 image retained.
  metrics: {abs_rel: 0.09419286468503807, delta1: 0.9041079043065734}
