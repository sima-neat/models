  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: image0
        dtype: float32
        shape: [1, 3, 280, 504]
        layout: NCHW
        description: Reference view; RGB image resized to cover 280x504, center-cropped, scaled to [0, 1], and ImageNet-normalized.
      - name: image1
        dtype: float32
        shape: [1, 3, 280, 504]
        layout: NCHW
        description: Second view of the same scene, preprocessed like image0.
      outputs:
      - name: depth
        dtype: float32
        shape: [1, 2, 280, 504]
        layout: NCHW
        description: Depth of each view, channel 0 for image0, up to one scale shared by both views.
      - name: depth_conf
        dtype: float32
        shape: [1, 2, 280, 504]
        layout: NCHW
        description: Depth confidence of each view; higher is more confident.
      - name: pose_enc
        dtype: float32
        shape: [1, 2, 9]
        description: Camera of each view as camera-to-world translation, xyzw quaternion, and vertical and horizontal field of view in radians.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 280, width: 504, fit: cover, upscale_resample: bicubic, downscale_resample: area}
    - op: center_crop
      parameters: {height: 280, width: 504}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
