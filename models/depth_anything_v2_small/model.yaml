display_name: Depth Anything V2 Small
description: Estimates relative depth for every pixel of an image with a ViT-S encoder and DPT head.
model_type: vision
tasks: [depth_estimation]

modalities:
  inputs: [image]
  outputs: [depth_map]

architecture: depth_anything

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from depth-anything/Depth-Anything-V2-Small-hf and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/onnx-community/depth-anything-v2-small
  revision: 4472b7362082ad9968fee890ca0f1e5aca36b93d
  derived_from: https://huggingface.co/depth-anything/Depth-Anything-V2-Small-hf/tree/5426e4f0f36572d16453bbda7a8389317b1bef99

# The ONNX export has dynamic shapes; compile.py folds it (surgery.py) to 1x3x518x686, the authors' input size for
# a 640x480 frame: 518 on the short side, both sides multiples of 14.
compilation:
  format: onnx
  source:
    uri: hf://models/onnx-community/depth-anything-v2-small@4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model.onnx
    sha256: afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c
    size_bytes: 99060839

calibrations:
- id: nyu-depth-v2-cal
  dataset: {id: nyu-depth-v2, variant: cal, sha256: 2fdf34652b47f3b2c4b28917f2c06bc25347e4a3ac480a5bfc040c91497ebb0b, size_bytes: 48030102}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 518, 686]

  w8a8:
    calibration_dataset: nyu-depth-v2-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 518, 686]
          calibration_samples: 50

  # W8A8 raises NYU AbsRel 40% above FP32 (0.0718 against 0.0513). BF16 activations keep FP32's 0.0513; the INT8
  # weights make it 6% faster than W16A16, as BF16 attention and softmax take most of the MLA's time.
  w8a16:
    components:
      model:
        parameters:
          precision: w8a16
          input_name: pixel_values
          input_shape: [1, 3, 518, 686]

numerical_fidelity:
  status: diagnostic
  dataset: {id: nyu-depth-v2, variant: val, sha256: 6e94b032248af78cc091b6a295808fc95ed4830d32e5084f1e7ec3797eec679e, size_bytes: 156136510}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 10}
  outputs: [predicted_depth]

accuracy:
  # NYU's official 654-image test split, scored with the MiDaS protocol Depth Anything reports (see accuracy.py).
  datasets:
  - {id: nyu-depth-v2, variant: val, sha256: 6e94b032248af78cc091b6a295808fc95ed4830d32e5084f1e7ec3797eec679e, size_bytes: 156136510}

performance: {}

reference_metrics:
- source: https://arxiv.org/abs/2406.09414v2
  dataset: {id: nyu-depth-v2, split: test}
  conditions: Zero-shot relative depth, affine-invariant inverse depth, FP32
  note: Table 2 of the Depth Anything V2 paper, ViT-S row.
  metrics: {abs_rel: 0.053, delta1: 0.973}
