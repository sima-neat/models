schema_version: 2
id: depthart_base
display_name: DepthART Base dynamic-p64 INT8 QAT
description: Mathematically equivalent DepthART Base with strict W8A8 compute and compiler-exact dynamic INT8 recurrence.
taxonomy_version: 3
model_type: vision
tasks:
  - depth_estimation
modalities:
  inputs:
    - image
  outputs:
    - depth_map
architecture:
  id: depthart
  variant: base_dynamic_p64_tree_448x576
owners:
  - "@sima-neat/models"
license:
  spdx: Apache-2.0
  redistribution: restricted
  attribution: DepthART by Feng Xue et al.; the checkpoint model card declares Apache-2.0, while upstream source redistribution remains restricted pending approval.
source:
  uri: https://api.github.com/repos/sima-neat/models/releases/assets/538839418
  sha256: 34c508fc9d200a8bffb281bbfe484623bec2ec45b294f4541894365516790d9c
  size_bytes: 57786977
  media_type: application/onnx
upstream:
