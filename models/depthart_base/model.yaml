interface:
  format: onnx
  opset: 17
  inputs:
    - name: image
      dtype: float32
      shape: [1, 3, 448, 576]
      layout: NCHW
      description: RGB image resized to 576x448 and ImageNet-normalized; Q/DQ is represented explicitly in the source.
  outputs:
    - name: depth
      dtype: float32
      shape: [1, 1, 448, 576]
      layout: NCHW
      description: Relative inverse depth before strict-INT8 public-ABI relocation.
preprocessing:
  pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {width: 576, height: 448, resample: bicubic, preserve_aspect_ratio: false}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
postprocessing:
  pipeline:
    - op: affine_relative_depth_alignment
      parameters: {prediction_domain: inverse_depth, metric_depth_requires_scale_and_shift: true}
calibration:
  status: not_required
  reason: The checksum-pinned source-QAT snapshot carries frozen QAT grids and a content-bound dynamic-p64 compile profile.
surgery:
  type: none
compile_variants:
