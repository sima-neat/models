display_name: DETR ResNet-50 DC5
description: The original DETR transformer detector with a ResNet-50 backbone whose last stage is dilated, for COCO objects.
model_type: vision
tasks: [object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: detr

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: DETR is developed by Facebook AI Research and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/facebook/detr-resnet-50-dc5
  revision: 6da4ef8c063ac1e8b8df9522e8113c5cc9ade5c9
  derived_from: https://github.com/facebookresearch/detr/tree/29901c51d7fe8712168b8d0d64351170bc0f83e0

conversion:
  source:
    repository: facebook/detr-resnet-50-dc5
    revision: 6da4ef8c063ac1e8b8df9522e8113c5cc9ade5c9
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: ec729a51f970737ef4c5c419520c36e175d160cf537011e7f972518368b75a85, size_bytes: 166587896}
      config.json: {sha256: 570c2d73983c5ab17c271d21bc1456afb94d775a122ba5019cbd04adfa49dcd3, size_bytes: 4380}
      preprocessor_config.json: {sha256: 84084dff7cb5f0ab9394adc87f34d813a4e0c3d7ad56aa7d73d775174ffaca3f, size_bytes: 274}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  # At 640x640, INT8 ran DC5 no faster than BF16, so its INT8 build waits until it does.
  # w8a8_mixed:
  #   calibration_dataset: coco-2017-cal
  #   components:
  #     model:
  #       parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50, bf16_regions: [heads]}

accuracy:
  # The reference resizes the shortest side to 800, caps the longest at 1333 and masks the padding. accuracy.py
  # stretches each image to the fixed 1280x720 input, which distorts COCO's mostly non-16:9 images.
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://github.com/facebookresearch/detr/blob/29901c51d7fe8712168b8d0d64351170bc0f83e0/README.md
  dataset: {id: coco-2017, split: val}
  conditions: shortest side 800, longest side 1333, padding masked
  metrics: {coco_map: 0.433}
