# Native measurements use the validated source-overlay compiler; normal publication
# still requires that compiler fix and the native Focal BoxDecode dependencies.
display_name: D-FINE Small
description: Small D-FINE COCO object detector with default deformable-attention sampling.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture: dfine
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: D-FINE is distributed by the D-FINE authors under Apache-2.0; this
    checkpoint is the USTC community Transformers port.
upstream:
  repository: https://huggingface.co/ustc-community/dfine-small-coco
  revision: f79e65b5fbb33ceb9d3ebba042955d7410c608f8
conversion:
  source:
    repository: ustc-community/dfine-small-coco
    revision: f79e65b5fbb33ceb9d3ebba042955d7410c608f8
    main_file: model.safetensors
    files:
      model.safetensors:
        sha256: a144baff3a27bfd538fe37b11fa8d4fca5744b8c054b5301e7c699a1379cd18f
        size_bytes: 41497620
      config.json:
        sha256: 9f206c4c935c67c957af2f15c3333b4ff224e72b1881bc7bbde9f873edf4448e
        size_bytes: 6865
      preprocessor_config.json:
        sha256: 7e9e2245806aa3ef068a5321f5eebee3116fa4cec560173231954ffaca930eca
        size_bytes: 470
compilation:
  format: onnx
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/dfine_s/cee260ed25585c208847846a1e9435ab6a556a3350cae262d632565cbb7adb6d/41664679689-1/model.onnx
    sha256: cee260ed25585c208847846a1e9435ab6a556a3350cae262d632565cbb7adb6d
    size_bytes: 42160707
  components:
  - backbone
  - decoder
calibrations:
- id: coco-2017-cal
  dataset: &id001
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
build_profiles:
  # Not yet natively qualified; keep this profile out of CI and the catalog.
  # w16a16_w16a16:
  #   calibration_dataset: coco-2017-cal
  #   components:
  #     backbone:
  #       parameters:
  #         precision: w16a16
  #         calibration_bins: 2048
  #         calibration_samples: 50
  #     decoder:
  #       parameters:
  #         precision: w16a16
  #         calibration_bins: 2048
  #         calibration_samples: 50
  # Weight precision choice, not a throughput optimization.
  w8a16_w16a16:
    calibration_dataset: coco-2017-cal
    components:
      backbone:
        parameters:
          precision: w8a16
          calibration_bins: 2048
          calibration_samples: 50
      decoder:
        parameters:
          precision: w16a16
          calibration_bins: 2048
          calibration_samples: 50
  # INT8 body with BF16 output paths and FP32 public tensors. Reference masking
  # stays BF16 so max-float sentinels do not collapse valid coordinates.
  w8a8_w16a16:
    calibration_dataset: coco-2017-cal
    components:
      backbone:
        parameters:
          precision: w8a8
          calibration_bins: 1024
          calibration_samples: 50
      decoder:
        parameters:
          precision: w16a16
          calibration_bins: 2048
          calibration_samples: 50
  # Not yet natively qualified; keep this profile out of CI and the catalog.
  # w8a8_mixed_w16a16:
  #   calibration_dataset: coco-2017-cal
  #   components:
  #     backbone:
  #       parameters:
  #         precision: w8a8
  #         calibration_bins: 1024
  #         calibration_samples: 50
  #         # Keep HGNet, non-convolution arithmetic and output producers BF16;
  #         # the remaining neck/projection convolutions run INT8.
  #         bf16_regions: [backbone, nonconv, outputs]
  #     decoder:
  #       parameters:
  #         precision: w16a16
  #         calibration_bins: 2048
  #         calibration_samples: 50
pipeline:
- component: backbone
- cpu: Top 300 content/reference queries
- component: decoder
numerical_fidelity:
  status: diagnostic
  dataset: *id001
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 10
  outputs:
  - pred_boxes
  - pred_logits
accuracy:
  datasets:
  - id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
performance: {}
reference_metrics:
- source: https://proceedings.iclr.cc/paper_files/paper/2025/file/6cf58a87e3097e7d1f9be3e8693a93de-Paper-Conference.pdf
  dataset:
    id: coco-2017
    split: val
  conditions: 640x640, D-FINE-S, COCO-only training, Table 7 (not Objects365 pretraining)
  metrics:
    coco_map: 0.485
    coco_ap50: 0.656
    coco_ap75: 0.526
    coco_ap_small: 0.291
    coco_ap_medium: 0.522
    coco_ap_large: 0.654
