# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: HRNet-W32
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: hrnet

license:
  spdx: MIT
  redistribution: allowed
  attribution: Derived from the HRNet authors' HRNet-W32 ImageNet weights (HRNet/HRNet-Image-Classification) as published in timm/hrnet_w32.ms_in1k, and distributed under MIT.

upstream:
  repository: https://huggingface.co/timm/hrnet_w32.ms_in1k
  revision: 9093cb96558ecab21907c780034b3ad0a8be72ea
  derived_from: https://github.com/HRNet/HRNet-Image-Classification/tree/f760c988482cdb8a1f69b10b219d669721144582

resources:
  license:
    source:
      uri: https://raw.githubusercontent.com/HRNet/HRNet-Image-Classification/f760c988482cdb8a1f69b10b219d669721144582/LICENSE
      sha256: 285c174bc9a991f013d2f205c63f1d7ec90bb91e7acb428151f119a76cfd6d00
      size_bytes: 1078
    install_path: licenses/LICENSE

conversion:
  source:
    repository: timm/hrnet_w32.ms_in1k
    revision: 9093cb96558ecab21907c780034b3ad0a8be72ea
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 021a21ea62a8dbc33e48543a54eb433c1b3abb247ead3857cc407d81d19c1ba8, size_bytes: 165432914}
      config.json: {sha256: 06c3f37db124546e0d2f20d34a65f73c6ccbfc46ab67cdd10d1a0e97eb218167, size_bytes: 569}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 20

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 5}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.875, bilinear, FP32
  note: timm's hrnet_w32.ms_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.78452, top5_accuracy: 0.94184}
