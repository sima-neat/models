# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: LightStereo-L
description: The large LightStereo network, estimating disparity from a rectified stereo image pair.
model_type: vision
tasks: [depth_estimation]

modalities:
  inputs: [image]
  outputs: [depth_map]

architecture: lightstereo

license:
  # OpenStereo ships no license file, and its README limits the code to academic, noncommercial use. CI
  # compiles and benchmarks the model, and its page offers no download (sima-neat/models#364).
  spdx: LicenseRef-OpenStereo-Academic
  redistribution: restricted
  attribution: LightStereo is developed by Xianda Guo et al. in OpenStereo; academic, noncommercial use only.

upstream:
  repository: https://huggingface.co/XiandaGuo/OpenStereo
  revision: cac6f81baeb0099522adc72859b1bda46bfcf6e7
  derived_from: https://github.com/XiandaGuo/OpenStereo/tree/23d71c92e33ad1f80dfc42bf29f5c6a914d38769/stereo/modeling/models/lightstereo

conversion:
  source:
    uri: hf://models/XiandaGuo/OpenStereo@cac6f81baeb0099522adc72859b1bda46bfcf6e7/checkpoint/LightStereo/LightStereo-L-SceneFlow.ckpt
    sha256: 25d07a7d2e1edfb300296ab15430a131c0f48932c343236c49a8952a4c1c265d
    size_bytes: 98896265
  outputs: [weights.pth]

compilation:
  format: onnx
  source: conversion

calibrations:
- id: scene-flow-cal
  dataset: {id: scene-flow, variant: cal, sha256: bc17d4c23539824b4dc5d159579a59c1727a80e6d7f82597a13c90be493a66ff, size_bytes: 1688561036}

# Every profile calibrates: each instance normalization ends in a square root, which the Model Compiler runs as an
# INT8 lookup table even when activations are BF16.
build_profiles:
  # W8A8 whose read-out runs BF16: the two softmaxes, the disparity regression and the context upsampling. Their
  # INT8 rounding cost LightStereo-S most of the accuracy its plain W8A8 build lost, and every size shares them.
  w8a8_mixed:
    calibration_dataset: scene-flow-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 16, bf16_regions: [readout]}

  # No w16a16 yet: its compile lost the default 32 GiB runner on both CI attempts, after 59 and 40 minutes, and
  # left no log. Uncomment it once the build has a runner class that completes it. compile.py keeps its recipe.
  # w16a16:
  #   calibration_dataset: scene-flow-cal
  #   components:
  #     model:
  #       parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 16}

  # No w8a8 or w8a16: on LightStereo-S, w8a8_mixed replaced w8a8 and w8a16 offered no trade-off
  # (models/lightstereo_s/model.yaml).

numerical_fidelity:
  # Mean absolute error of the disparity output is its end-point error against the ONNX source, in pixels.
  status: diagnostic
  dataset: {id: scene-flow, variant: cal, sha256: bc17d4c23539824b4dc5d159579a59c1727a80e6d7f82597a13c90be493a66ff, size_bytes: 1688561036}
  # Calibration takes the first pairs of the same seeded order, so the fidelity pairs start after them.
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 16, samples: 8}
  outputs: [disparity]

accuracy:
  # scene-flow-val holds the Scene Flow finalpass test list: 4,370 FlyingThings3D pairs and their left-view disparity.
  datasets:
  - {id: scene-flow, variant: val, sha256: f355b01ceab38e3ac1e3fd069bf3af61a140fff88d7cf21acaa610195799c500, size_bytes: 14868088916}

performance: {}

reference_metrics:
- source: https://github.com/XiandaGuo/OpenStereo/blob/23d71c92e33ad1f80dfc42bf29f5c6a914d38769/docs/1.model_zoo.md
  dataset: {id: scene-flow, split: test}
  conditions: Mixed precision (AMP), each view edge-padded above to 544x960, pixels with true disparity above 0 and under 192
  note: The model config pads to 544x960, but upstream's documented evaluation loads cfgs/sceneflow_eval.yaml, which pads to 576x960. The source does not say which produced this score.
  metrics: {epe: 0.59}
