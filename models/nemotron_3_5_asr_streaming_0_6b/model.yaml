display_name: Nemotron 3.5 ASR Streaming 0.6B
description: Transcribes multilingual speech continuously using a cache-aware encoder and a CPU transducer decoder.
model_type: audio
tasks:
- automatic_speech_recognition
modalities:
  inputs:
  - audio
  outputs:
  - text
architecture: nemotron_asr
