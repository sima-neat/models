build_profiles:
  w8a16:
    # Spot reclaimed every recompile mid-compile; the on-demand market requires the grant in sima-neat/vulcan#527.
    runner_market: on-demand
    components:
      model:
        parameters:
          precision: w8a16
          chunk_ms: 560
          lookahead: 6
pipeline:
- cpu: 16 kHz audio to 128-bin log-mel features
- component: model
- cpu: INT8 ONNX predictor and joiner decode to text

accuracy:
  datasets:
  - {id: fleurs, variant: en-us-test, sha256: c2b7984079a73f169b147f531699af5ffe0eb60bb071277ac9f4a455e786acb2, size_bytes: 289947446}

performance: {}

# The model card's FLEURS English score covers en-US and en-GB, and its exact normalizer is not published.
# scripts/fp32_baseline_accuracy.py measures the FP32 baseline with the package's own pipeline.
reference_metrics:
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset: {id: fleurs, split: test}
  conditions: FP32 ONNX encoder, predictor and joiner on ONNX Runtime CPU; 560 ms cached chunks; en-US language prompt; 647 English recordings
  note: Audio and transcriptions from google/fleurs on Hugging Face rather than the registry's pinned archive; not compared byte for byte.
  metrics: {wer: 0.0826, wer_as_written: 0.1081, cer: 0.0376}
