display_name: NetVLAD
description: Describes a street-level image as one 4,096-value place descriptor for finding revisited places.
model_type: vision
tasks: [loop_closure]

modalities:
  inputs: [image]
  outputs: [embeddings]

architecture: netvlad

license:
  spdx: MIT
  redistribution: allowed
  attribution: >-
    NetVLAD weights from Patch-NetVLAD by Stephen Hausler, Sourav Garg, Ming Xu, Michael Milford and Tobias Fischer,
    distributed under MIT.

upstream:
  repository: https://huggingface.co/TobiasRobotics/Patch-NetVLAD
  revision: fdb01d151cb91509adcfc7020ab7fb2d492077b5
  derived_from: https://github.com/QVPR/Patch-NetVLAD/tree/d7fc6e874e54f18a71e19eaa01f92313177060a3

conversion:
  source:
    uri: hf://models/TobiasRobotics/Patch-NetVLAD@fdb01d151cb91509adcfc7020ab7fb2d492077b5/pitts_WPCA4096.pth.tar
    sha256: 2c3cf17de91974156cb6aee40a6f7a229825095273d7de87c0792084ae1bf4aa
    size_bytes: 1132901186

compilation:
  format: onnx
  # TODO(convert-pin): replace with the source block Vulcan Model Convert prints for this conversion.
  source: {uri: TODO(convert-pin), sha256: TODO(convert-pin), size_bytes: 0}

# No loop closure set (Pitts30k, MSLS, Tokyo 24/7) is in Dataset Registry; COCO's outdoor and urban scenes calibrate.
calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  # No W8A8: per-tensor INT8 activations erase the small residuals of weakly assigned clusters, which
  # intra-normalization then scales up to full weight; a W8A8 build kept 0.40 descriptor cosine on a DevKit.
  w8a16:
    calibration_dataset: coco-2017-cal
    components:
      model:
        parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 50}

numerical_fidelity:
  # Calibration takes the first images of this seed's shuffle, so the comparison starts after them.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 10}
  outputs: [descriptor]

performance: {}
