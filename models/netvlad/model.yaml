display_name: NetVLAD
description: Describes a street-level image as one 4,096-value place descriptor for finding revisited places.
model_type: vision
tasks: [loop_closure]

modalities:
  inputs: [image]
  outputs: [embeddings]

architecture: netvlad

license:
  spdx: MIT
  redistribution: allowed
  attribution: >-
    NetVLAD weights from Patch-NetVLAD by Stephen Hausler, Sourav Garg, Ming Xu, Michael Milford and Tobias Fischer,
    distributed under MIT.

upstream:
  repository: https://huggingface.co/TobiasRobotics/Patch-NetVLAD
  revision: fdb01d151cb91509adcfc7020ab7fb2d492077b5
  derived_from: https://github.com/QVPR/Patch-NetVLAD/tree/d7fc6e874e54f18a71e19eaa01f92313177060a3

conversion:
  source:
    uri: hf://models/TobiasRobotics/Patch-NetVLAD@fdb01d151cb91509adcfc7020ab7fb2d492077b5/pitts_WPCA4096.pth.tar
    sha256: 2c3cf17de91974156cb6aee40a6f7a229825095273d7de87c0792084ae1bf4aa
    size_bytes: 1132901186
  outputs: [weights.pth]

compilation:
  format: onnx
  source: conversion

# Pitts30k-train database images, the training set of these weights; none is in Pitts30k test.
calibrations:
- id: pitts30k-cal
  dataset: {id: pitts30k, variant: cal, sha256: 7df86e763de22f83c67d89bb594f80a22ba1fee4e0bded5141ba2053c3dad156, size_bytes: 38853089}

build_profiles:
  w16a16:
    calibration_dataset: pitts30k-cal
    components:
      model:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a16:
    calibration_dataset: pitts30k-cal
    components:
      model:
        parameters: {precision: w8a16, calibration_bins: 2048, calibration_samples: 50}

  w8a8_mixed:
    calibration_dataset: pitts30k-cal
    components:
      model:
        # The VGG16 encoder runs W8A8 up to conv5_3, and conv5_3 and the pooling run BF16 activations. INT8
        # activations from conv5_3 on drop the descriptor to 0.41 cosine with float. On the registry's fidelity images
        # this build keeps 0.969 (W8A16: 0.948) and runs at 122.6/s on a DevKit (W8A16: 90.2/s), with Recall@1
        # 0.3 points below W16A16.
        parameters:
          precision: w8a8
          bf16_regions: [pooling]
          calibration_bins: 2048
          calibration_samples: 50

numerical_fidelity:
  # Calibration takes the first images of this seed's shuffle, so the comparison starts after them.
  status: diagnostic
  dataset: {id: pitts30k, variant: cal, sha256: 7df86e763de22f83c67d89bb594f80a22ba1fee4e0bded5141ba2053c3dad156, size_bytes: 38853089}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 10}
  outputs: [descriptor]

accuracy:
  # pitts30k-val holds the Pittsburgh 30k test split NetVLAD and these weights' authors evaluate: 6,816 queries.
  datasets:
  - {id: pitts30k, variant: val, sha256: 11099213681d0b0037b497d02c983a4a53c09c6e3eed0ac08637bf22cfeee395, size_bytes: 611858077}

performance: {}

reference_metrics:
- source: https://arxiv.org/html/2103.01486v1
  dataset: {id: pitts30k, split: test}
  conditions: 640x480, Pittsburgh 30k-trained NetVLAD global descriptor, 25 m tolerance
  note: Patch-NetVLAD Table 1, NetVLAD row; the paper does not state that row's PCA dimension.
  metrics: {recall_at_1: 0.835, recall_at_5: 0.913, recall_at_10: 0.94}
