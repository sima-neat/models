display_name: RegNetY-800MF
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: regnet_y

license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Derived from torchvision's RegNetY-800MF ImageNet weights (IMAGENET1K_V2) as published in timm/regnety_008_tv.tv2_in1k, and distributed under BSD-3-Clause.

upstream:
  repository: https://huggingface.co/timm/regnety_008_tv.tv2_in1k
  revision: 56a71621f7f864477ab136983a05392438e3918f
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/regnet.py

resources:
  license:
    # timm publishes the checkpoint under Apache-2.0; the weights come from torchvision under BSD-3-Clause.
    source:
      uri: https://raw.githubusercontent.com/huggingface/pytorch-image-models/c709c9a4a26af45d01221caadfdc6b00a9622630/LICENSE
      sha256: 71b111620fa32c17a80ccd6db2da759d31a591e497d8b5f382174f59d1b59d49
      size_bytes: 11343
    install_path: licenses/LICENSE
  license_torchvision:
    source:
      uri: https://raw.githubusercontent.com/pytorch/vision/134f6382956071833f05f072763c03f9858453f2/LICENSE
      sha256: 6502f676851cfe25f8af75531dfb32375b7325b73c37e7b43741fa422893e71d
      size_bytes: 1517
    install_path: licenses/LICENSE-torchvision

conversion:
  source:
    repository: timm/regnety_008_tv.tv2_in1k
    revision: 56a71621f7f864477ab136983a05392438e3918f
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 6f813b63debc3a5e0ba9f7c6ce4db5d160e0e7271d9174319bc8430b7e935572, size_bytes: 25882940}
      config.json: {sha256: ac3cce4234a3acd5c0ceac810fd88a3488ea962cb45b9255b7f0da161af7c8db, size_bytes: 660}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 50

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.965, bicubic, FP32
  note: timm's regnety_008_tv.tv2_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.78672, top5_accuracy: 0.94380}
