display_name: ResNet-18
description: Classifies an image into one of the 1,000 ImageNet classes.
example_app: https://developer.sima.ai/examples/app/classification%2Fimage-classification-explorer
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: resnet

license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Derived from torchvision's ResNet-18 ImageNet weights (IMAGENET1K_V1) as published in timm/resnet18.tv_in1k, and distributed under BSD-3-Clause.

upstream:
  repository: https://huggingface.co/timm/resnet18.tv_in1k
  revision: bbd144b3e5565108aad885f145491d11bc6ce807
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/resnet.py

resources:
  license:
    source:
      uri: https://raw.githubusercontent.com/pytorch/vision/134f6382956071833f05f072763c03f9858453f2/LICENSE
      sha256: 6502f676851cfe25f8af75531dfb32375b7325b73c37e7b43741fa422893e71d
      size_bytes: 1517
    install_path: licenses/LICENSE

conversion:
  source:
    repository: timm/resnet18.tv_in1k
    revision: bbd144b3e5565108aad885f145491d11bc6ce807
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 694f673df6520a3158624e8a89af086f59923ee4cd7436fe5bc3bc71d295ad81, size_bytes: 46807446}
      config.json: {sha256: 98e8e96252378bde6af8489d77afc329340f119f96d942667ed01a3cfab9f396, size_bytes: 645}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 20

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 5}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.875, bilinear, FP32
  note: timm's resnet18.tv_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.69752, top5_accuracy: 0.89082}
