display_name: ResNet-50
description: Classifies an image into one of the 1,000 ImageNet classes.
example_app: https://developer.sima.ai/examples/app/classification%2Fimage-classification-explorer
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: resnet

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from microsoft/resnet-50 and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/onnx-community/resnet-50-ONNX
  revision: b6ef686fe842388c9449c7acb7269d02c69bacfb
  derived_from: https://huggingface.co/microsoft/resnet-50/tree/34c2154c194f829b11125337b98c8f5f9965ff19

resources:
  license:
    # microsoft/resnet-50 omits LICENSE. Google's BERT repository carries the standard Apache-2.0 text.
    source:
      repository: google-bert/bert-base-uncased
      revision: 86b5e0934494bd15c9632b12f734a8a67f723594
      files:
        LICENSE: {sha256: 43070e2d4e532684de521b885f385d0841030efa2b1a20bafb76133a5e1379c1, size_bytes: 11356}
    install_path: licenses

compilation:
  format: onnx
  source:
    uri: hf://models/onnx-community/resnet-50-ONNX@b6ef686fe842388c9449c7acb7269d02c69bacfb/onnx/model.onnx
    sha256: de5d34d98e29c8f436264685f0b0e6a83b0d023516e40df0f96e02d5dd8e4c50
    size_bytes: 102182062

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 50

  w8a16:
    components:
      model:
        parameters:
          precision: w8a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.95, bicubic, FP32
  note: timm's resnet50.a1_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.80382, top5_accuracy: 0.94598}
