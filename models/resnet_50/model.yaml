id: resnet_50
display_name: ResNet-50
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks:
- image_classification
modalities:
  inputs:
  - image
  outputs:
  - class_scores
architecture:
  id: resnet
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from microsoft/resnet-50 and distributed under Apache-2.0.
upstream:
  repository: https://huggingface.co/onnx-community/resnet-50-ONNX
  revision: b6ef686fe842388c9449c7acb7269d02c69bacfb
  model_card: https://huggingface.co/onnx-community/resnet-50-ONNX
  derived_from: https://huggingface.co/microsoft/resnet-50/tree/34c2154c194f829b11125337b98c8f5f9965ff19
components:
- id: model
  role: inference
  source:
    type: file
    uri: hf://models/onnx-community/resnet-50-ONNX@b6ef686fe842388c9449c7acb7269d02c69bacfb/onnx/model.onnx
    sha256: de5d34d98e29c8f436264685f0b0e6a83b0d023516e40df0f96e02d5dd8e4c50
    size_bytes: 102182062
    media_type: application/onnx
  interface:
    format: onnx
    opset: 11
    entrypoints:
    - id: default
      inputs:
      - name: pixel_values
        dtype: float32
        shape:
        - batch_size
        - num_channels
        - height
        - width
        layout: NCHW
        description: Normalized RGB image tensor.
      outputs:
      - name: logits
        dtype: float32
        shape:
        - batch_size
        - 1000
        layout: NC
        description: ImageNet-1k class logits.
    shape_profiles:
    - id: compile_input
      entrypoint: default
      bindings:
        batch_size: 1
        num_channels: 3
        height: 224
        width: 224
  preprocessing:
    pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: resize
      parameters:
        shortest_edge: 256
        resample: bicubic
    - op: center_crop
      parameters:
        height: 224
        width: 224
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: normalize
      parameters:
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
    - op: transpose
      parameters:
        from: HWC
        to: CHW
  postprocessing:
    pipeline:
    - op: softmax
      parameters:
        axis: 1
    - op: top_k
      parameters:
        k: 5
  surgery:
    type: none
  recipe: scripts/compile.py
resources: []
calibrations:
- id: default
  status: ready
  dataset:
    id: imagenet-2012
    variant: mini
    sha256: d769e759abba1fe6e03db704020dcff3f1e8309a8cac8885ab60f5a0e512c239
    size_bytes: 356052889
build_profiles:
# The BF16 build checks that the model still compiles; it is not accuracy-qualified.
- id: w16a16
  target: modalix
  components:
  - id: model
    parameters:
      precision: bf16
      input_name: pixel_values
      input_shape:
      - 1
      - 3
      - 224
      - 224
    shape_profile: compile_input
- id: w8a8
  target: modalix
  components:
  - id: model
    parameters:
      precision: int8
      input_name: pixel_values
      input_shape:
      - 1
      - 3
      - 224
      - 224
      calibration_samples: 500
    shape_profile: compile_input
    calibration: default
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
- id: default
  default: true
  components:
  - model
  resources: []
  build_profiles:
  - w16a16
  - w8a8
  composition: default
fidelity:
- id: logits_fidelity
  scope: {type: package, package: default}
  build_profiles: [w16a16, w8a8]
  status: diagnostic
  result_component: model
  dataset:
    id: imagenet-2012
    variant: mini
    sha256: d769e759abba1fe6e03db704020dcff3f1e8309a8cac8885ab60f5a0e512c239
    size_bytes: 356052889
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 0
    samples: 50
  outputs: [logits]
accuracy:
- id: imagenet_accuracy
  scope: {type: package, package: default}
  build_profiles: [w8a8]
  engine: devkit_script
  status: provisional
  result_component: model
  dataset:
    id: imagenet-2012
    variant: mini
    sha256: d769e759abba1fe6e03db704020dcff3f1e8309a8cac8885ab60f5a0e512c239
    size_bytes: 356052889
  metrics: [top1_accuracy, top5_accuracy]
  required_metrics: [top1_accuracy]
published_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.95, bicubic, FP32
  note: timm's resnet50.a1_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.80382, top5_accuracy: 0.94598}
benchmark:
- id: modalix_latency
  scope:
    type: component
    component: model
  build_profiles:
  - w16a16
  - w8a8
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics:
  - latency_avg_ms
  - throughput_fps
  - avg_power_watts
  - energy_joules
  - energy_per_inference_joules
maturity: experimental
