# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: RF-DETR Large
description: The largest RF-DETR transformer detector here, for COCO objects.
example_app: https://developer.sima.ai/examples/app/object-detection%2Frfdetr-detection-segmentation
model_type: vision
tasks: [object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: rf_detr

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Large is distributed by Roboflow under Apache-2.0.

upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-large
  revision: f62f7dd5252b61097cbace33886045816dadbde9

resources:
  license:
    # The checkpoint repository omits LICENSE. Roboflow's RF-DETR repository carries the Apache-2.0 text.
    source:
      uri: https://raw.githubusercontent.com/roboflow/rf-detr/b49df291cdd6b8d19fb722ab402e9a018d2edcd4/LICENSE
      sha256: 8cabf52c61130fc97a7e5da5e3685ccf44841c0c53d6f881189369b136603cca
      size_bytes: 11345
    install_path: licenses/LICENSE

conversion:
  source:
    repository: Roboflow/rf-detr-large
    revision: f62f7dd5252b61097cbace33886045816dadbde9
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 1ec604598aea748627eb5755a9989f3c80839fc7fb977a91bfba107ee76fcd7d, size_bytes: 135795376}
      config.json: {sha256: 6630951d97cc8dd2f32da43df7c79af153b032f6df196bbe9bf9e47bd7be0c0c, size_bytes: 5771}
      preprocessor_config.json: {sha256: 7bd6854cb9798f22bb0e1ec3c4e7ae4da9192623c4aee7c3a3991d5fbd9f28f7, size_bytes: 442}

compilation:
  format: onnx
  source: conversion
  components: [backbone, decoder]

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

# Both profiles request on-demand because Spot runners repeatedly lost these
# compiles mid-run (sima-neat/vulcan#298), at the default size because a larger
# runner did not shorten RF-DETR compiles (#118).
build_profiles:
  # No w8a8_w16a16: its COCO val2017 mAP of 0.499, measured with 50 calibration samples, is 11.7% below the
  # published 0.565, more than the 8% that model-registry validate allows. compile.py keeps its recipe.
  # w8a8_w16a16:
  #   calibration_dataset: coco-2017-cal
  #   runner_market: on-demand
  #   components:
  #     backbone:
  #       parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 20}
  #     # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
  #     decoder:
  #       parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 20}

  w8a16_w16a16:
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 20}

  w8a8_mixed_w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        # A W8A8 backbone whose residual stream, global attention, projector, proposal head and outputs run BF16.
        parameters:
          precision: w8a8
          calibration_bins: 2048
          calibration_samples: 20
          bf16_regions: [residual, attention_global, projector, head, outputs]
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 20}

pipeline:
- {component: backbone}
- {cpu: Top 300 proposals}
- {component: decoder}

numerical_fidelity:
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 5}
  outputs: [dets, labels]

accuracy:
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 704x704
  metrics: {coco_map: 0.565, coco_ap50: 0.751}
