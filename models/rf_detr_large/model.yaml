display_name: RF-DETR Large
description: The largest RF-DETR transformer detector here, for COCO objects.
model_type: vision
tasks: [object_detection]
modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]
architecture: rf_detr
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Large is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-large
  revision: f62f7dd5252b61097cbace33886045816dadbde9
conversion:
  default:
    source:
      repository: Roboflow/rf-detr-large
      revision: f62f7dd5252b61097cbace33886045816dadbde9
      entrypoint: model.safetensors
      files:
        model.safetensors:
          sha256: 1ec604598aea748627eb5755a9989f3c80839fc7fb977a91bfba107ee76fcd7d
          size_bytes: 135795376
        config.json:
          sha256: 6630951d97cc8dd2f32da43df7c79af153b032f6df196bbe9bf9e47bd7be0c0c
          size_bytes: 5771
        preprocessor_config.json:
          sha256: 7bd6854cb9798f22bb0e1ec3c4e7ae4da9192623c4aee7c3a3991d5fbd9f28f7
          size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_large/b618b08491b7a85ef3d6afc0d55e0bc85458fbfa5acb2446d80f8ca0d74308ef/37903234520-1/model.onnx
    sha256: b618b08491b7a85ef3d6afc0d55e0bc85458fbfa5acb2446d80f8ca0d74308ef
    size_bytes: 121813393
  interface:
    format: onnx
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 704, 704]
        layout: NCHW
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 44, 44]
        layout: NCHW
      - name: proposal_scores
        dtype: float32
        shape: [1, 1936]
        layout: NC
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1936, 4]
        layout: NLC
- id: decoder
  role: detection_head
  source: *source
  interface:
    format: onnx
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 44, 44]
        layout: NCHW
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
  depends_on: [backbone]
datasets:
  coco_images:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
  accuracy:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
build_profiles:
- id: w8a8_w16a16
  components:
  - id: backbone
    calibration: coco_images
    parameters:
      precision: w8a8
      calibration_bins: 2048
      calibration_samples: 50
  - id: decoder
    parameters:
      precision: w16a16
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
- id: w8a16_w16a16
  components:
  - id: backbone
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration: coco_images
    parameters:
      precision: w8a16
      per_token: true
  - id: decoder
    parameters:
      precision: w16a16
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
compositions:
- id: default
  type: declarative
  components:
  - id: backbone
    component: backbone
    entrypoint: default
  - id: decoder
    component: decoder
    entrypoint: default
  connections:
  - from:
      component: backbone
      output: backbone_features
    to:
      component: decoder
      input: backbone_features
  inputs:
  - name: input
    to:
      component: backbone
      input: input
  - name: proposals
    to:
      component: decoder
      input: proposals
  outputs:
  - name: proposal_scores
    from:
      component: backbone
      output: proposal_scores
  - name: proposal_boxes
    from:
      component: backbone
      output: proposal_boxes
  - name: dets
    from:
      component: decoder
      output: dets
  - name: labels
    from:
      component: decoder
      output: labels
pipeline:
- component: backbone
- cpu: Top 300 proposals
- component: decoder
packages:
- id: default
  default: true
  components: [backbone, decoder]
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  composition: default
fidelity:
- id: full_pipeline_fidelity
  scope:
    type: package
    package: default
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  result_component: decoder
  dataset: coco_images
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 10
  outputs: [dets, labels]
accuracy:
- id: coco_accuracy
  scope:
    type: package
    package: default
  engine: devkit_script
  status: ready
  result_component: decoder
  dataset: accuracy
  required_metrics: [coco_map]
published_metrics:
- source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
  dataset:
    id: coco-2017
    split: val
  conditions: 704x704
  metrics:
    coco_map: 0.565
    coco_ap50: 0.751
benchmark:
- id: orchestration
  scope:
    type: package
    package: default
  required_metrics: [avg_power_watts, energy_per_inference_joules]
