id: rf_detr_large
display_name: RF-DETR Large 704x704
description: RF-DETR Large object detection split into independently deployable backbone and transformer components.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: rf_detr
  variant: large_coco_704x704
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Large is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-large
  revision: f62f7dd5252b61097cbace33886045816dadbde9
  model_card: https://huggingface.co/Roboflow/rf-detr-large
conversion:
  default:
    source:
      type: file_set
      entrypoint: model.safetensors
      files:
      - path: model.safetensors
        uri: hf://models/Roboflow/rf-detr-large@f62f7dd5252b61097cbace33886045816dadbde9/model.safetensors
        sha256: 1ec604598aea748627eb5755a9989f3c80839fc7fb977a91bfba107ee76fcd7d
        size_bytes: 135795376
      - path: config.json
        uri: hf://models/Roboflow/rf-detr-large@f62f7dd5252b61097cbace33886045816dadbde9/config.json
        sha256: 6630951d97cc8dd2f32da43df7c79af153b032f6df196bbe9bf9e47bd7be0c0c
        size_bytes: 5771
      - path: preprocessor_config.json
        uri: hf://models/Roboflow/rf-detr-large@f62f7dd5252b61097cbace33886045816dadbde9/preprocessor_config.json
        sha256: 7bd6854cb9798f22bb0e1ec3c4e7ae4da9192623c4aee7c3a3991d5fbd9f28f7
        size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_large/b618b08491b7a85ef3d6afc0d55e0bc85458fbfa5acb2446d80f8ca0d74308ef/37903234520-1/model.onnx
    sha256: b618b08491b7a85ef3d6afc0d55e0bc85458fbfa5acb2446d80f8ca0d74308ef
    size_bytes: 121813393
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 704, 704]
        layout: NCHW
        description: RGB image after resize and ImageNet normalization.
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 44, 44]
        layout: NCHW
        description: Feature map consumed by the transformer.
      - name: proposal_scores
        dtype: float32
        shape: [1, 1936]
        layout: NC
        description: Objectness score for each proposal.
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1936, 4]
        layout: NLC
        description: Decoded box for each proposal.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 704, width: 704, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
- id: transformer
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 44, 44]
        layout: NCHW
        description: Feature map emitted by the backbone.
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Highest-scoring boxes selected by TopK and Gather on A65.
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Predicted boxes.
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
        description: COCO class scores for each predicted box.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
  depends_on:
  - backbone
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
