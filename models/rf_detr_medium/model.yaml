  reason: Establish a Core API baseline for the default MPK workload.
  metrics: [latency_avg_ms, throughput_fps, avg_power_watts, energy_joules, energy_per_inference_joules]
  required_metrics: [avg_power_watts, energy_per_inference_joules]
- id: transformer_modalix
  scope: {type: component, component: transformer}
  build_profiles: [modalix_int8_bf16]
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics: [latency_avg_ms, throughput_fps, avg_power_watts, energy_joules, energy_per_inference_joules]
  required_metrics: [avg_power_watts, energy_per_inference_joules]
maturity: experimental
