id: rf_detr_medium
display_name: RF-DETR Medium
description: A mid-size RF-DETR transformer detector for COCO objects.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: rf_detr
  variant: medium_coco_576x576
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Medium is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-medium
  revision: 1b5b672408f86dd38e05dd3cf3f2e0834e545a59
  model_card: https://huggingface.co/Roboflow/rf-detr-medium
conversion:
  default:
    source:
      type: file_set
      entrypoint: model.safetensors
      files:
      - path: model.safetensors
        uri: hf://models/Roboflow/rf-detr-medium@1b5b672408f86dd38e05dd3cf3f2e0834e545a59/model.safetensors
        sha256: e52098adc46969794fbdd16e0548a62b81ba0c0f4b14392676edba50be9a69f6
        size_bytes: 134812328
      - path: config.json
        uri: hf://models/Roboflow/rf-detr-medium@1b5b672408f86dd38e05dd3cf3f2e0834e545a59/config.json
        sha256: 03b30b6ec4305333d81faf3884946818de6d390ed4b71781ae06b92b127010ac
        size_bytes: 5771
      - path: preprocessor_config.json
        uri: hf://models/Roboflow/rf-detr-medium@1b5b672408f86dd38e05dd3cf3f2e0834e545a59/preprocessor_config.json
        sha256: 4e55a721a4ca13007d7ee4bbe914958060519f64da7c6e21b8e75732d46b8fb6
        size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_medium/e7647d716ad697d9ee88babbd9a59b2cb9c70cbdce25154a09794b56bd2743b3/37736664059-1/model.onnx
    sha256: e7647d716ad697d9ee88babbd9a59b2cb9c70cbdce25154a09794b56bd2743b3
    size_bytes: 120816271
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 576, 576]
        layout: NCHW
        description: RGB image after resize and ImageNet normalization.
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 36, 36]
        layout: NCHW
        description: Feature map consumed by the transformer.
      - name: proposal_scores
        dtype: float32
        shape: [1, 1296]
        layout: NC
        description: Objectness score for each proposal.
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1296, 4]
        layout: NLC
        description: Decoded box for each proposal.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 576, width: 576, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
- id: transformer
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 36, 36]
        layout: NCHW
        description: Feature map emitted by the backbone.
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Highest-scoring boxes selected by TopK and Gather on A65.
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Normalized (cx, cy, w, h) box for each query; scale by the original image size.
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
        description: COCO class logits for each query; apply a sigmoid to get scores.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
  depends_on:
  - backbone
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
build_profiles:
- id: modalix_int8_bf16
  target: modalix
  components:
  - id: backbone
    artifact_suffix: backbone_int8_mse_bcr
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 2048
      calibration_samples: 50
  - id: transformer
    artifact_suffix: transformer_bf16
    parameters:
      precision: bf16
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, transformer]
compositions:
- id: default
  type: declarative
  components:
  - {id: backbone, component: backbone, entrypoint: default}
  - {id: transformer, component: transformer, entrypoint: default}
  connections:
  - from: {component: backbone, output: backbone_features}
    to: {component: transformer, input: backbone_features}
  inputs:
  - name: input
    to: {component: backbone, input: input}
  - name: proposals
    to: {component: transformer, input: proposals}
  outputs:
  - name: proposal_scores
    from: {component: backbone, output: proposal_scores}
  - name: proposal_boxes
    from: {component: backbone, output: proposal_boxes}
  - name: dets
    from: {component: transformer, output: dets}
  - name: labels
    from: {component: transformer, output: labels}
packages:
- id: default
  default: true
  components: [backbone, transformer]
  resources: []
  build_profiles: [modalix_int8_bf16]
  composition: default
  maturity: experimental
fidelity:
- id: full_pipeline_fidelity
  scope: {type: package, package: default}
  build_profiles: [modalix_int8_bf16]
  status: diagnostic
  result_component: transformer
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 50
  outputs: [dets, labels]
accuracy:
- id: coco_accuracy
  scope: {type: package, package: default}
  build_profiles: [modalix_int8_bf16]
  engine: devkit_script
  status: ready
  result_component: transformer
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
  metrics: [coco_map, coco_ap50, coco_ap75, coco_ap_small, coco_ap_medium, coco_ap_large,
    coco_ar1, coco_ar10, coco_ar100, coco_ar_small, coco_ar_medium, coco_ar_large]
  required_metrics: [coco_map]
  reference:
    source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
    metrics: {coco_map: 0.547, coco_ap50: 0.736}
benchmark:
- id: backbone_modalix
  scope: {type: component, component: backbone}
  build_profiles: [modalix_int8_bf16]
