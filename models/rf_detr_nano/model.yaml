# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: RF-DETR Nano
description: The smallest RF-DETR transformer detector for COCO objects.
model_type: vision
tasks: [object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: rf_detr

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Nano is distributed by Roboflow under Apache-2.0.

upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-nano
  revision: 9f201577d9415f0378084748d27e68586e6b3600

conversion:
  source:
    repository: Roboflow/rf-detr-nano
    revision: 9f201577d9415f0378084748d27e68586e6b3600
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 497b1dbcc8f9d115b806fb82d140d7e22e5b5c3fba45abefef39dd4f99c1f737, size_bytes: 121926336}
      config.json: {sha256: bee6f42c3ab26f9c11064a72080d87c6298d7b7fa0b49c0403ddb4db22020071, size_bytes: 5771}
      preprocessor_config.json: {sha256: d7a4562ce4ebbbba4904e82edcb415f3f7637c0b9e98752d2cbc6a06bdf25740, size_bytes: 442}

compilation:
  format: onnx
  source: conversion
  components: [backbone, decoder]

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

# Both profiles request on-demand because Spot runners repeatedly lost these
# compiles mid-run (sima-neat/vulcan#298), at the default size because a larger
# runner did not shorten RF-DETR compiles (#118).
build_profiles:
  w8a8_w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        # 1,024 backbone bins scored 0.7 COCO val2017 mAP above 2,048.
        parameters: {precision: w8a8, calibration_bins: 1024, calibration_samples: 50}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a16_w16a16:
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a8_mixed_w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        # A W8A8 backbone whose residual stream, global attention, projector, proposal head and outputs run BF16.
        parameters:
          precision: w8a8
          calibration_bins: 1024
          calibration_samples: 50
          bf16_regions: [residual, attention_global, projector, head, outputs]
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

pipeline:
- {component: backbone}
- {cpu: Top 300 proposals}
- {component: decoder}

numerical_fidelity:
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 10}
  outputs: [dets, labels]

accuracy:
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 384x384
  metrics: {coco_map: 0.484, coco_ap50: 0.676}
