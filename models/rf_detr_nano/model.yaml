id: rf_detr_nano
display_name: RF-DETR Nano
description: The smallest RF-DETR transformer detector for COCO objects.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: rf_detr
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Nano is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-nano
  revision: 9f201577d9415f0378084748d27e68586e6b3600
  model_card: https://huggingface.co/Roboflow/rf-detr-nano
conversion:
  default:
    source:
      type: file_set
      entrypoint: model.safetensors
      files:
      - path: model.safetensors
        uri: hf://models/Roboflow/rf-detr-nano@9f201577d9415f0378084748d27e68586e6b3600/model.safetensors
        sha256: 497b1dbcc8f9d115b806fb82d140d7e22e5b5c3fba45abefef39dd4f99c1f737
        size_bytes: 121926336
      - path: config.json
        uri: hf://models/Roboflow/rf-detr-nano@9f201577d9415f0378084748d27e68586e6b3600/config.json
        sha256: bee6f42c3ab26f9c11064a72080d87c6298d7b7fa0b49c0403ddb4db22020071
        size_bytes: 5771
      - path: preprocessor_config.json
        uri: hf://models/Roboflow/rf-detr-nano@9f201577d9415f0378084748d27e68586e6b3600/preprocessor_config.json
        sha256: d7a4562ce4ebbbba4904e82edcb415f3f7637c0b9e98752d2cbc6a06bdf25740
        size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_nano/5eda9c1defd4dd2bf2f8c5ccd72cc3f4a16d2f50a242e1229416df445a1e54a3/37736659788-1/model.onnx
    sha256: 5eda9c1defd4dd2bf2f8c5ccd72cc3f4a16d2f50a242e1229416df445a1e54a3
    size_bytes: 107862815
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 384, 384]
        layout: NCHW
        description: RGB image after resize and ImageNet normalization.
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 24, 24]
        layout: NCHW
        description: Feature map consumed by the decoder.
      - name: proposal_scores
        dtype: float32
        shape: [1, 576]
        layout: NC
        description: Objectness score for each proposal.
      - name: proposal_boxes
        dtype: float32
        shape: [1, 576, 4]
        layout: NLC
        description: Decoded box for each proposal.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 384, width: 384, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
- id: decoder
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 24, 24]
        layout: NCHW
        description: Feature map emitted by the backbone.
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Highest-scoring boxes selected by TopK and Gather on A65.
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Normalized (cx, cy, w, h) box for each query; scale by the original image size.
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
        description: COCO class logits for each query; apply a sigmoid to get scores.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
  depends_on:
  - backbone
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
build_profiles:
- id: w8a8_w16a16
  target: modalix
  components:
  - id: backbone
    calibration: coco_images
    parameters:
      precision: w8a8
      # In one build of each, 1,024 backbone bins scored 0.7 COCO val2017 mAP above 2,048.
      calibration_bins: 1024
      calibration_samples: 50
  - id: decoder
    parameters:
      precision: w16a16
      # AFE runs Sin and Cos as INT8 lookup tables even at BF16, so the decoder's query sine
      # embedding needs calibrated input ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
- id: w8a16_w16a16
  target: modalix
  components:
  - id: backbone
    # The decoder calibrates on this backbone's outputs for these images; the W8A16 backbone itself skips
    # calibration.
    calibration: coco_images
    parameters:
      precision: w8a16
      per_token: true
  - id: decoder
    parameters:
      precision: w16a16
      # AFE runs Sin and Cos as INT8 lookup tables even at BF16, so the decoder's query sine
      # embedding needs calibrated input ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
compositions:
- id: default
  type: declarative
  components:
  - {id: backbone, component: backbone, entrypoint: default}
  - {id: decoder, component: decoder, entrypoint: default}
  connections:
  - from: {component: backbone, output: backbone_features}
    to: {component: decoder, input: backbone_features}
  inputs:
  - name: input
    to: {component: backbone, input: input}
  - name: proposals
    to: {component: decoder, input: proposals}
  outputs:
  - name: proposal_scores
    from: {component: backbone, output: proposal_scores}
  - name: proposal_boxes
    from: {component: backbone, output: proposal_boxes}
  - name: dets
    from: {component: decoder, output: dets}
  - name: labels
    from: {component: decoder, output: labels}
pipeline:
- component: backbone
- cpu: Top 300 proposals
- component: decoder
packages:
- id: default
  default: true
  components: [backbone, decoder]
  resources: []
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  composition: default
  maturity: experimental
fidelity:
- id: full_pipeline_fidelity
  scope: {type: package, package: default}
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  # Reordered queries can lower numerical similarity for equivalent detections,
  # so fidelity does not gate publication.
  status: diagnostic
  result_component: decoder
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 10
  outputs: [dets, labels]
accuracy:
- id: coco_accuracy
  scope: {type: package, package: default}
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  engine: devkit_script
  status: ready
  result_component: decoder
  dataset:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
  metrics: [coco_map, coco_ap50, coco_ap75, coco_ap_small, coco_ap_medium, coco_ap_large,
    coco_ar1, coco_ar10, coco_ar100, coco_ar_small, coco_ar_medium, coco_ar_large]
  required_metrics: [coco_map]
published_metrics:
- source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 384x384
  metrics: {coco_map: 0.484, coco_ap50: 0.676}
benchmark:
- id: orchestration
  scope: {type: package, package: default}
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  status: pending
  target: modalix
  reason: Measure the package's components running as one pipeline.
  metrics: [latency_avg_ms, throughput_fps, avg_power_watts, energy_joules, energy_per_inference_joules]
  required_metrics: [avg_power_watts, energy_per_inference_joules]
maturity: experimental
