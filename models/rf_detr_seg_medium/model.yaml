# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: RF-DETR Seg Medium
description: A mid-size RF-DETR transformer instance segmenter for COCO objects.
model_type: vision
tasks: [instance_segmentation]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores, masks]

architecture: rf_detr_seg

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Seg Medium is distributed by Roboflow under Apache-2.0.

upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-seg-medium
  revision: f9bac6edd3c55fb39f765c3425464dccfde0d503

resources:
  license:
    # The checkpoint repository omits LICENSE. Roboflow's RF-DETR repository carries the Apache-2.0 text.
    source:
      uri: https://raw.githubusercontent.com/roboflow/rf-detr/b49df291cdd6b8d19fb722ab402e9a018d2edcd4/LICENSE
      sha256: 8cabf52c61130fc97a7e5da5e3685ccf44841c0c53d6f881189369b136603cca
      size_bytes: 11345
    install_path: licenses/LICENSE

conversion:
  source:
    repository: Roboflow/rf-detr-seg-medium
    revision: f9bac6edd3c55fb39f765c3425464dccfde0d503
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 0b1656792d51e2ecfaa49434248c0093bac883f9b75723e04a1ba23f45666d64, size_bytes: 142846748}
      config.json: {sha256: 06ec0a120caa83a73847f966cc0ac20b4faaf063a4876f830fc353d7dd561f4e, size_bytes: 5778}
      preprocessor_config.json: {sha256: 54287bdd487c98a439f9c8c8039b69544dce6fc1735dca50ca4de4d5bbf27382, size_bytes: 442}

compilation:
  format: onnx
  source: conversion
  components: [backbone, decoder]

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

# Every profile requests on-demand because Spot runners repeatedly lost RF-DETR
# compiles mid-run (sima-neat/vulcan#298).
build_profiles:
  w8a8_w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a16_w16a16:
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a8_mixed_w16a16:
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        # A W8A8 backbone whose residual stream, global attention, projector, proposal head and outputs run BF16.
        parameters:
          precision: w8a8
          calibration_bins: 2048
          calibration_samples: 50
          bf16_regions: [residual, attention_global, projector, head, outputs]
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      decoder:
        parameters: {precision: w16a16, calibration_bins: 2048, calibration_samples: 50}

  w8a16_w8a8_mixed:
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration_dataset: coco-2017-cal
    runner_market: on-demand
    components:
      backbone:
        parameters: {precision: w8a16, per_token: true}
      decoder:
        # A W8A8 decoder whose transformer and outputs run BF16; the mask head and mask product run INT8.
        parameters:
          precision: w8a8
          calibration_bins: 2048
          calibration_samples: 50
          bf16_regions: [transformer, outputs]

  # A W8A16 decoder fails in the compiler's large-tensor support ("Overlap in L1 detected");
  # restore this profile once it compiles.
  # w8a16_w8a16:
  #   calibration_dataset: coco-2017-cal
  #   runner_market: on-demand
  #   components:
  #     backbone:
  #       parameters: {precision: w8a16, per_token: true}
  #     decoder:
  #       parameters: {precision: w8a16, per_token: true, calibration_bins: 2048, calibration_samples: 50}

pipeline:
- {component: backbone}
- {cpu: Top 200 proposals}
- {component: decoder}

numerical_fidelity:
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 50, samples: 10}
  outputs: [dets, labels, masks]

accuracy:
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://github.com/roboflow/rf-detr/blob/a459eeade6387927c599a50f287a319a19d7ae82/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 432x432
  metrics: {coco_mask_map: 0.453, coco_mask_ap50: 0.684}
