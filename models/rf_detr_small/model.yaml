id: rf_detr_small
display_name: RF-DETR Small
description: A compact RF-DETR transformer detector for COCO objects.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: rf_detr
  variant: small_coco_512x512
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Small is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-small
  revision: 3bdc465063270f99769da5a1b4c00c68bd2d439d
  model_card: https://huggingface.co/Roboflow/rf-detr-small
conversion:
  default:
    source:
      type: file_set
      entrypoint: model.safetensors
      files:
      - path: model.safetensors
        uri: hf://models/Roboflow/rf-detr-small@3bdc465063270f99769da5a1b4c00c68bd2d439d/model.safetensors
        sha256: 2bfab2fa5f5fcc4870e756c8dc8d2d5acca3a68ffcc0f7e84972661873eb5a1d
        size_bytes: 128504496
      - path: config.json
        uri: hf://models/Roboflow/rf-detr-small@3bdc465063270f99769da5a1b4c00c68bd2d439d/config.json
        sha256: cbc9ccde8860c7587c0672cd4df1e9ae2ee93112fef853283435e95dd7e0a595
        size_bytes: 5771
      - path: preprocessor_config.json
        uri: hf://models/Roboflow/rf-detr-small@3bdc465063270f99769da5a1b4c00c68bd2d439d/preprocessor_config.json
        sha256: dba1fb5bb4d70d94b3495b7bcb1f881bc61d42c73433fcec13be34c523550a0b
        size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_small/065fa96c52731a25e0ca481a98be90a3d4fb28943984b724bc3eee17e475847a/37610414373-1/model.onnx
    sha256: 065fa96c52731a25e0ca481a98be90a3d4fb28943984b724bc3eee17e475847a
    size_bytes: 114476199
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 512, 512]
        layout: NCHW
        description: RGB image after resize and ImageNet normalization.
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
        description: Feature map consumed by the transformer.
      - name: proposal_scores
        dtype: float32
        shape: [1, 1024]
        layout: NC
        description: Objectness score for each proposal.
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1024, 4]
        layout: NLC
        description: Decoded box for each proposal.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 512, width: 512, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
- id: transformer
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
        description: Feature map emitted by the backbone.
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Highest-scoring boxes selected by TopK and Gather on A65.
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Normalized (cx, cy, w, h) box for each query; scale by the original image size.
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
        description: COCO class logits for each query; apply a sigmoid to get scores.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
  depends_on:
  - backbone
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
build_profiles:
- id: modalix_int8_bf16
  target: modalix
  components:
  - id: backbone
    artifact_suffix: backbone_int8_mse_bcr
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 2048
      calibration_samples: 50
  - id: transformer
    artifact_suffix: transformer_bf16
    parameters:
      precision: bf16
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, transformer]
compositions:
- id: default
  type: declarative
  components:
  - {id: backbone, component: backbone, entrypoint: default}
  - {id: transformer, component: transformer, entrypoint: default}
  connections:
  - from: {component: backbone, output: backbone_features}
    to: {component: transformer, input: backbone_features}
  inputs:
  - name: input
    to: {component: backbone, input: input}
  - name: proposals
    to: {component: transformer, input: proposals}
  outputs:
  - name: proposal_scores
    from: {component: backbone, output: proposal_scores}
  - name: proposal_boxes
    from: {component: backbone, output: proposal_boxes}
  - name: dets
    from: {component: transformer, output: dets}
  - name: labels
    from: {component: transformer, output: labels}
pipeline:
- component: backbone
- cpu: Top 300 proposals
- component: transformer
packages:
- id: default
  default: true
  components: [backbone, transformer]
  resources: []
  build_profiles: [modalix_int8_bf16]
  composition: default
  maturity: experimental
fidelity:
- id: full_pipeline_fidelity
  scope: {type: package, package: default}
  build_profiles: [modalix_int8_bf16]
  status: diagnostic
  result_component: transformer
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 50
  outputs: [dets, labels]
accuracy:
- id: coco_accuracy
  scope: {type: package, package: default}
  build_profiles: [modalix_int8_bf16]
  engine: devkit_script
  status: ready
  result_component: transformer
  dataset:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
  metrics: [coco_map, coco_ap50, coco_ap75, coco_ap_small, coco_ap_medium, coco_ap_large,
    coco_ar1, coco_ar10, coco_ar100, coco_ar_small, coco_ar_medium, coco_ar_large]
  required_metrics: [coco_map]
  reference:
    source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
    metrics: {coco_map: 0.530, coco_ap50: 0.721}
benchmark:
- id: backbone_modalix
  scope: {type: component, component: backbone}
  build_profiles: [modalix_int8_bf16]
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics: [latency_avg_ms, throughput_fps, avg_power_watts, energy_joules, energy_per_inference_joules]
  required_metrics: [avg_power_watts, energy_per_inference_joules]
- id: transformer_modalix
  scope: {type: component, component: transformer}
  build_profiles: [modalix_int8_bf16]
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics: [latency_avg_ms, throughput_fps, avg_power_watts, energy_joules, energy_per_inference_joules]
  required_metrics: [avg_power_watts, energy_per_inference_joules]
maturity: experimental
