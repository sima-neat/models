schema_version: 2
id: rf_detr_small
display_name: RF-DETR Small 512x512
description: RF-DETR Small object detection split into independently deployable backbone and transformer components.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: rf_detr
  variant: small_coco_512x512
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Small is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://github.com/roboflow/rf-detr
  revision: 9b009fa928d6218320439803d1da01869a85c072
  model_card: https://huggingface.co/Roboflow/rf-detr-small
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: onnx_bundle
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_small/2a0c190f8eaaa1ba9808e42edbff7958169da5f89fe9526548f0517e592d9cd7/34281485481-1/manifest.json
    sha256: ee9bf92c896f4f9dd8de67443662d1bbc58210551fc6385e66e6368d4a92d9e9
    size_bytes: 4318
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 512, 512]
        layout: NCHW
        description: RGB image after resize and ImageNet normalization.
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
        description: Feature map consumed by the transformer.
      - name: proposal_scores
        dtype: float32
        shape: [1, 1024]
        layout: NC
        description: Objectness score for each proposal.
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1024, 4]
        layout: NLC
        description: Decoded box for each proposal.
    shape_profiles: []
  preprocessing: &image_preprocessing
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: resize
      parameters: {height: 512, width: 512, preserve_aspect_ratio: false, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: normalize
      parameters:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: surgery.py:prepare_model
    parameters: {partition: backbone}
  recipe: compile.py
- id: transformer
  role: detection_head
  source: *source
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
        description: Feature map emitted by the backbone.
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Highest-scoring boxes selected by TopK and Gather on A65.
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
        description: Predicted boxes.
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
        description: COCO class scores for each predicted box.
    shape_profiles: []
  preprocessing:
    pipeline: []
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: surgery.py:prepare_model
    parameters: {partition: transformer}
  recipe: compile.py
  depends_on:
  - backbone
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
build_profiles:
- id: modalix_int8_bf16
  target: modalix
  components:
  - id: backbone
    artifact_suffix: backbone_int8_mse
    calibration: coco_images
    parameters:
      precision: int8
      calibration_samples: 50
  - id: transformer
    artifact_suffix: transformer_bf16
    parameters:
      precision: bf16
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, transformer]
compositions:
- id: default
  type: declarative
  schema_version: 1
  file: composition.yaml
packages:
- id: default
  default: true
  components: [backbone, transformer]
  resources: []
  build_profiles: [modalix_int8_bf16]
  composition: default
  maturity: experimental
tests:
  correctness:
  - id: full_pipeline_fidelity
    config: tests/correctness.yaml
    scope: {type: package, package: default}
    build_profiles: [modalix_int8_bf16]
  performance:
  - id: backbone_modalix
    config: tests/performance.yaml
    scope: {type: component, component: backbone}
    build_profiles: [modalix_int8_bf16]
  - id: transformer_modalix
    config: tests/performance.yaml
    scope: {type: component, component: transformer}
    build_profiles: [modalix_int8_bf16]
maturity: experimental
