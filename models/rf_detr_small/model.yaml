display_name: RF-DETR Small
description: A compact RF-DETR transformer detector for COCO objects.
model_type: vision
tasks: [object_detection]
modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]
architecture: rf_detr
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: RF-DETR Small is distributed by Roboflow under Apache-2.0.
upstream:
  repository: https://huggingface.co/Roboflow/rf-detr-small
  revision: 3bdc465063270f99769da5a1b4c00c68bd2d439d
conversion:
  default:
    source:
      repository: Roboflow/rf-detr-small
      revision: 3bdc465063270f99769da5a1b4c00c68bd2d439d
      entrypoint: model.safetensors
      files:
        model.safetensors:
          sha256: 2bfab2fa5f5fcc4870e756c8dc8d2d5acca3a68ffcc0f7e84972661873eb5a1d
          size_bytes: 128504496
        config.json:
          sha256: cbc9ccde8860c7587c0672cd4df1e9ae2ee93112fef853283435e95dd7e0a595
          size_bytes: 5771
        preprocessor_config.json:
          sha256: dba1fb5bb4d70d94b3495b7bcb1f881bc61d42c73433fcec13be34c523550a0b
          size_bytes: 442
components:
- id: backbone
  role: feature_extractor
  source: &source
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/rf_detr_small/065fa96c52731a25e0ca481a98be90a3d4fb28943984b724bc3eee17e475847a/37610414373-1/model.onnx
    sha256: 065fa96c52731a25e0ca481a98be90a3d4fb28943984b724bc3eee17e475847a
    size_bytes: 114476199
  interface:
    format: onnx
    entrypoints:
    - id: default
      inputs:
      - name: input
        dtype: float32
        shape: [1, 3, 512, 512]
        layout: NCHW
      outputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
      - name: proposal_scores
        dtype: float32
        shape: [1, 1024]
        layout: NC
      - name: proposal_boxes
        dtype: float32
        shape: [1, 1024, 4]
        layout: NLC
- id: decoder
  role: detection_head
  source: *source
  interface:
    format: onnx
    entrypoints:
    - id: default
      inputs:
      - name: backbone_features
        dtype: float32
        shape: [1, 256, 32, 32]
        layout: NCHW
      - name: proposals
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
      outputs:
      - name: dets
        dtype: float32
        shape: [1, 300, 4]
        layout: NLC
      - name: labels
        dtype: float32
        shape: [1, 300, 91]
        layout: NLC
  depends_on: [backbone]
datasets:
  coco_images:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
  accuracy:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
build_profiles:
- id: w8a8_w16a16
  components:
  - id: backbone
    calibration: coco_images
    parameters:
      precision: w8a8
      calibration_bins: 2048
      calibration_samples: 50
  - id: decoder
    parameters:
      precision: w16a16
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
- id: w8a16_w16a16
  components:
  - id: backbone
    # The decoder calibrates on this backbone's outputs; W8A16 skips backbone calibration.
    calibration: coco_images
    parameters:
      precision: w8a16
      per_token: true
  - id: decoder
    parameters:
      precision: w16a16
      # Sin/Cos use INT8 lookup tables even at BF16, so the decoder needs calibrated ranges.
      calibration_bins: 2048
      calibration_samples: 50
  compile_invocations:
  - id: rf_detr
    components: [backbone, decoder]
compositions:
- id: default
  type: declarative
  components:
  - id: backbone
    component: backbone
    entrypoint: default
  - id: decoder
    component: decoder
    entrypoint: default
  connections:
  - from:
      component: backbone
      output: backbone_features
    to:
      component: decoder
      input: backbone_features
  inputs:
  - name: input
    to:
      component: backbone
      input: input
  - name: proposals
    to:
      component: decoder
      input: proposals
  outputs:
  - name: proposal_scores
    from:
      component: backbone
      output: proposal_scores
  - name: proposal_boxes
    from:
      component: backbone
      output: proposal_boxes
  - name: dets
    from:
      component: decoder
      output: dets
  - name: labels
    from:
      component: decoder
      output: labels
pipeline:
- component: backbone
- cpu: Top 300 proposals
- component: decoder
packages:
- id: default
  default: true
  components: [backbone, decoder]
  build_profiles: [w8a8_w16a16, w8a16_w16a16]
  composition: default
fidelity:
- id: full_pipeline_fidelity
  scope:
    type: package
    package: default
  # Reordered queries can lower numerical similarity for equivalent detections.
  status: diagnostic
  result_component: decoder
  dataset: coco_images
  selection:
    method: seeded_random_without_replacement
    seed: 42
    offset: 50
    samples: 10
  outputs: [dets, labels]
accuracy:
- id: coco_accuracy
  scope:
    type: package
    package: default
  engine: devkit_script
  status: ready
  result_component: decoder
  dataset: accuracy
  required_metrics: [coco_map]
published_metrics:
- source: https://github.com/roboflow/rf-detr/blob/56cdbbf57fc51c090f3aca398802d2cbc6703a05/README.md
  dataset:
    id: coco-2017
    split: val
  conditions: 512x512
  metrics:
    coco_map: 0.53
    coco_ap50: 0.721
benchmark:
- id: orchestration
  scope:
    type: package
    package: default
  required_metrics: [avg_power_watts, energy_per_inference_joules]
