schema_version: 2
id: ssd_mobilenet_v1
display_name: SSD-MobileNet V1 300x300
description: COCO SSD-MobileNet V1 raw box and class predictor heads for Neat-owned decode and NMS.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: ssd_mobilenet_v1
  variant: coco_300x300
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from the ONNX Model Zoo SSD-MobileNet V1 model distributed under Apache-2.0.
upstream:
  repository: https://github.com/onnx/models
  revision: 019281f3fcb151a90e491f3b2f0273f9f31bd6be
  model_card: https://huggingface.co/onnxmodelzoo/ssd_mobilenet_v1_12
  derived_from: https://github.com/tensorflow/models/tree/master/research/object_detection
components:
- id: model
  role: inference
  source:
    type: file
    uri: hf://models/onnxmodelzoo/ssd_mobilenet_v1_12@019281f3fcb151a90e491f3b2f0273f9f31bd6be/ssd_mobilenet_v1_12.onnx
    sha256: b8fba5e404077d4048d27fcd1667e85e27e192eb9bf51e696c46a3acd7d21058
    size_bytes: 29461455
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape:
        - 1
        - 3
        - 300
        - 300
        layout: NCHW
        description: RGB image after stretch resize and normalization to [-1, 1].
      outputs:
      - name: ssd_loc_0
        dtype: float32
        shape:
        - 1
        - 12
        - 19
        - 19
        layout: NCHW
        description: Level 0 raw box encodings, three anchors and four coordinates per anchor.
      - name: ssd_loc_1
        dtype: float32
        shape:
        - 1
        - 24
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw box encodings, six anchors and four coordinates per anchor.
      - name: ssd_loc_2
        dtype: float32
        shape:
        - 1
        - 24
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw box encodings.
      - name: ssd_loc_3
        dtype: float32
        shape:
        - 1
        - 24
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw box encodings.
      - name: ssd_loc_4
        dtype: float32
        shape:
        - 1
        - 24
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw box encodings.
      - name: ssd_loc_5
        dtype: float32
        shape:
        - 1
        - 24
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw box encodings.
      - name: ssd_confidence_0
        dtype: float32
        shape:
        - 1
        - 273
        - 19
        - 19
        layout: NCHW
        description: Level 0 raw class logits, three anchors and 91 classes per anchor.
      - name: ssd_confidence_1
        dtype: float32
        shape:
        - 1
        - 546
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw class logits, six anchors and 91 classes per anchor.
      - name: ssd_confidence_2
        dtype: float32
        shape:
        - 1
        - 546
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw class logits.
      - name: ssd_confidence_3
        dtype: float32
        shape:
        - 1
        - 546
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw class logits.
      - name: ssd_confidence_4
        dtype: float32
        shape:
        - 1
        - 546
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw class logits.
      - name: ssd_confidence_5
        dtype: float32
        shape:
        - 1
        - 546
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw class logits.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: resize
      parameters:
        height: 300
        width: 300
        preserve_aspect_ratio: false
        resample: bilinear
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: normalize
      parameters:
        mean:
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.5
        - 0.5
        - 0.5
    - op: transpose
      parameters:
        from: HWC
        to: CHW
  postprocessing:
    pipeline:
    - op: ssd_decode
      parameters:
        owner: neat
        head_order: loc[0..5],confidence[0..5]
        classes_per_anchor: 91
        coordinates_per_anchor: 4
    - op: non_maximum_suppression
      parameters:
        owner: neat
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters:
      source_boundary: Preprocessor/sub:0
      input_name: images
      input_shape:
      - 1
      - 3
      - 300
      - 300
      output_order: loc[0..5],confidence[0..5]
  recipe: scripts/compile.py
resources: []
