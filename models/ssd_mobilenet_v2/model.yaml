display_name: SSD-MobileNet V2
description: A lightweight single-shot COCO detector built on MobileNet V2.
model_type: vision
tasks: [object_detection]
modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]
architecture: ssd_mobilenet
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Kalray's SSD-MobileNet V2 raw-head ONNX model is distributed under Apache-2.0.
upstream:
  repository: https://huggingface.co/Kalray/ssd-mobilenet-v2
  revision: 25a67532e30418eb68d1f49888374c16e8abfa73
  derived_from: https://github.com/tensorflow/models/tree/master/research/object_detection
components:
- id: model
  source:
    type: file
    uri: hf://models/Kalray/ssd-mobilenet-v2@25a67532e30418eb68d1f49888374c16e8abfa73/ssd-mobilenet-v2.onnx
    sha256: f0d9458cd8ae5c0cde8eadf22b75c6451059f4d9dd46df266e996dcbec417a8f
    size_bytes: 67387440
    media_type: application/onnx
  format: onnx
calibrations:
- id: default
  status: ready
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/500754757
    sha256: ae4d46084839c7659c679a170366e8e2d143b1c42c911697bb59c5639e3bce20
    size_bytes: 48695578
    media_type: application/x-npz
build_profiles:
- id: w8a8
  components:
  - id: model
    parameters:
      precision: w8a8
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
      quantization_quality_thresholds:
        minimum_cosine_similarity: 0.98
        maximum_normalized_root_mean_square_error: 0.2
    calibration: default
- id: w16a16
  components:
  - id: model
    parameters:
      precision: w16a16
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
      quantization_quality_thresholds:
        minimum_cosine_similarity: 0.999
        maximum_normalized_root_mean_square_error: 0.05
    calibration: default
accuracy:
- id: coco_val2017_quantization
  scope:
    type: component
    component: model
  build_profiles: [w8a8, w16a16]
  status: pending_hardware_qualification
  reference: onnx_fp32_raw_heads
  dataset: coco_val2017
  calibration_samples: 128
  validation_samples: 32
  split: category_balanced_and_disjoint
  metrics: [raw_head_cosine_similarity, raw_head_normalized_root_mean_square_error, decoded_detection_recall_at_0_5_iou,
    decoded_detection_mean_matched_iou]
  note: Raw-head quality is compiler-gated; decoded accuracy and performance remain pending Modalix hardware qualification.
published_metrics:
- source: https://github.com/tensorflow/models/blob/ac8d0651935ecf8a5e7c73ff4aaa97ca1b3623b5/research/object_detection/g3doc/tf1_detection_zoo.md
  dataset:
    id: coco-2014
    split: minival
  conditions: 300x300, TensorFlow Object Detection API
  metrics:
    coco_map: 0.22
benchmark: true
