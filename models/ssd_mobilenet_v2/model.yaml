id: ssd_mobilenet_v2
display_name: SSD-MobileNet V2
description: A lightweight single-shot COCO detector built on MobileNet V2.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: ssd_mobilenet
owners:
- '@sima-neat/models'
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Kalray's SSD-MobileNet V2 raw-head ONNX model is distributed under Apache-2.0.
upstream:
  repository: https://huggingface.co/Kalray/ssd-mobilenet-v2
  revision: 25a67532e30418eb68d1f49888374c16e8abfa73
  model_card: https://huggingface.co/Kalray/ssd-mobilenet-v2
  derived_from: https://github.com/tensorflow/models/tree/master/research/object_detection
components:
- id: model
  role: inference
  source:
    type: file
    uri: hf://models/Kalray/ssd-mobilenet-v2@25a67532e30418eb68d1f49888374c16e8abfa73/ssd-mobilenet-v2.onnx
    sha256: f0d9458cd8ae5c0cde8eadf22b75c6451059f4d9dd46df266e996dcbec417a8f
    size_bytes: 67387440
    media_type: application/onnx
  interface:
    format: onnx
    opset: 13
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape:
        - 1
        - 3
        - 300
        - 300
        layout: NCHW
        description: RGB image after stretch resize and normalization to [-1, 1].
      outputs:
      - name: ssd_loc_0
        dtype: float32
        shape:
        - 1
        - 12
        - 19
        - 19
        layout: NCHW
        description: Level 0 raw box encodings, three anchors and four coordinates per anchor.
      - name: ssd_loc_1
        dtype: float32
        shape:
        - 1
        - 24
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw box encodings, six anchors and four coordinates per anchor.
      - name: ssd_loc_2
        dtype: float32
        shape:
        - 1
        - 24
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw box encodings.
      - name: ssd_loc_3
        dtype: float32
        shape:
        - 1
        - 24
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw box encodings.
      - name: ssd_loc_4
        dtype: float32
        shape:
        - 1
        - 24
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw box encodings.
      - name: ssd_loc_5
        dtype: float32
        shape:
        - 1
        - 24
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw box encodings.
      - name: ssd_confidence_0
        dtype: float32
        shape:
        - 1
        - 273
        - 19
        - 19
        layout: NCHW
        description: Level 0 raw class logits, three anchors and 91 classes per anchor.
      - name: ssd_confidence_1
        dtype: float32
        shape:
        - 1
        - 546
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw class logits, six anchors and 91 classes per anchor.
      - name: ssd_confidence_2
        dtype: float32
        shape:
        - 1
        - 546
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw class logits.
      - name: ssd_confidence_3
        dtype: float32
        shape:
        - 1
        - 546
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw class logits.
      - name: ssd_confidence_4
        dtype: float32
        shape:
        - 1
        - 546
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw class logits.
      - name: ssd_confidence_5
        dtype: float32
        shape:
        - 1
        - 546
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw class logits.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: resize
      parameters:
        height: 300
        width: 300
        preserve_aspect_ratio: false
        resample: bilinear
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: normalize
      parameters:
        mean:
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.5
        - 0.5
        - 0.5
    - op: transpose
      parameters:
        from: HWC
        to: CHW
  postprocessing:
    pipeline:
    - op: ssd_decode
      parameters:
        owner: neat
        head_order: loc[0..5],confidence[0..5]
        classes_per_anchor: 91
        coordinates_per_anchor: 4
    - op: non_maximum_suppression
      parameters:
        owner: neat
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters:
      source_input: FeatureExtractor/MobilenetV2/MobilenetV2/input:0
      input_name: images
      input_shape:
      - 1
      - 3
      - 300
      - 300
      operation: rename_and_reorder_existing_graph_values
      output_order: loc[0..5],confidence[0..5]
  recipe: scripts/compile.py
resources: []
calibrations:
- id: default
  status: ready
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/500754757
    sha256: ae4d46084839c7659c679a170366e8e2d143b1c42c911697bb59c5639e3bce20
    size_bytes: 48695578
    media_type: application/x-npz
build_profiles:
- id: w8a8
  target: modalix
  components:
  - id: model
    parameters:
      precision: w8a8
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
    calibration: default
- id: w16a16
  target: modalix
  components:
  - id: model
    parameters:
      precision: w16a16
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
    calibration: default
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
- id: default
  default: true
  components:
  - model
  resources: []
  build_profiles:
  - w8a8
  - w16a16
  composition: default
fidelity: []
accuracy:
- id: coco_val2017_quantization
  scope:
    type: component
    component: model
  build_profiles:
  - w8a8
  - w16a16
  status: pending_hardware_qualification
  reference: onnx_fp32_raw_heads
  dataset: coco_val2017
  calibration_samples: 128
  validation_samples: 32
  split: category_balanced_and_disjoint
  metrics:
  - raw_head_cosine_similarity
  - raw_head_normalized_root_mean_square_error
  - decoded_detection_recall_at_0_5_iou
  - decoded_detection_mean_matched_iou
  compiler_raw_head_thresholds:
    w8a8:
      minimum_cosine_similarity: 0.98
      maximum_normalized_root_mean_square_error: 0.2
    w16a16:
      minimum_cosine_similarity: 0.999
      maximum_normalized_root_mean_square_error: 0.05
  note: Raw-head quality is compiler-gated; decoded accuracy and performance remain pending Modalix hardware qualification.
published_metrics:
- source: https://github.com/tensorflow/models/blob/ac8d0651935ecf8a5e7c73ff4aaa97ca1b3623b5/research/object_detection/g3doc/tf1_detection_zoo.md
  dataset: {id: coco-2014, split: minival}
  conditions: 300x300, TensorFlow Object Detection API
  metrics: {coco_map: 0.22}
benchmark:
- id: modalix_latency
  scope:
    type: component
    component: model
  build_profiles:
  - w8a8
  - w16a16
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics:
  - latency_avg_ms
  - throughput_fps
  - avg_power_watts
  - energy_joules
  - energy_per_inference_joules
maturity: experimental
