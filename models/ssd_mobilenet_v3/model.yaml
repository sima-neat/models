schema_version: 1
id: ssd_mobilenet_v3
display_name: SSD-MobileNet V3 Large 320x320
description: COCO SSD-MobileNet V3 Large raw box and class predictor heads for Neat-owned decode and NMS.
owners:
  - "@sima-neat/models"
license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from TensorFlow Object Detection Model Zoo SSD-MobileNet V3 Large, distributed under Apache-2.0.
source:
  uri: https://api.github.com/repos/sima-neat/models/releases/assets/500803387
  sha256: 3b8a49dae52f4053e9197755aaa11fc227af8e234c7df19c7fe42ac847eed1c5
  size_bytes: 13075527
  media_type: application/onnx
upstream:
  repository: https://github.com/tensorflow/models
  revision: ssd_mobilenet_v3_large_coco_2020_01_14
  model_card: http://download.tensorflow.org/models/object_detection/ssd_mobilenet_v3_large_coco_2020_01_14.tar.gz
  derived_from: https://github.com/tensorflow/models/tree/master/research/object_detection
interface:
  format: onnx
  opset: 12
  inputs:
    - name: images
      dtype: float32
      shape: [1, 3, 320, 320]
      layout: NCHW
      description: RGB image after stretch resize and normalization to [-1, 1].
  outputs:
    - name: ssd_loc_0
      dtype: float32
      shape: [1, 12, 20, 20]
      layout: NCHW
      description: Level 0 raw box encodings, three anchors and four coordinates per anchor.
    - name: ssd_loc_1
      dtype: float32
      shape: [1, 24, 10, 10]
      layout: NCHW
      description: Level 1 raw box encodings, six anchors and four coordinates per anchor.
    - name: ssd_loc_2
      dtype: float32
      shape: [1, 24, 5, 5]
      layout: NCHW
      description: Level 2 raw box encodings.
    - name: ssd_loc_3
      dtype: float32
      shape: [1, 24, 3, 3]
      layout: NCHW
      description: Level 3 raw box encodings.
    - name: ssd_loc_4
      dtype: float32
      shape: [1, 24, 2, 2]
      layout: NCHW
      description: Level 4 raw box encodings.
    - name: ssd_loc_5
      dtype: float32
      shape: [1, 24, 1, 1]
      layout: NCHW
      description: Level 5 raw box encodings.
    - name: ssd_confidence_0
      dtype: float32
      shape: [1, 273, 20, 20]
      layout: NCHW
      description: Level 0 raw class logits, three anchors and 91 classes per anchor.
    - name: ssd_confidence_1
      dtype: float32
      shape: [1, 546, 10, 10]
      layout: NCHW
      description: Level 1 raw class logits, six anchors and 91 classes per anchor.
    - name: ssd_confidence_2
      dtype: float32
      shape: [1, 546, 5, 5]
      layout: NCHW
      description: Level 2 raw class logits.
    - name: ssd_confidence_3
      dtype: float32
      shape: [1, 546, 3, 3]
      layout: NCHW
      description: Level 3 raw class logits.
    - name: ssd_confidence_4
      dtype: float32
      shape: [1, 546, 2, 2]
      layout: NCHW
      description: Level 4 raw class logits.
    - name: ssd_confidence_5
      dtype: float32
      shape: [1, 546, 1, 1]
      layout: NCHW
      description: Level 5 raw class logits.
preprocessing:
  pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: resize
      parameters:
        height: 320
        width: 320
        preserve_aspect_ratio: false
        resample: bilinear
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: normalize
      parameters:
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
    - op: transpose
      parameters:
        from: HWC
        to: CHW
postprocessing:
  pipeline:
    - op: ssd_decode
      parameters:
        owner: neat
        head_order: "loc[0..5],confidence[0..5]"
        classes_per_anchor: 91
        coordinates_per_anchor: 4
    - op: non_maximum_suppression
      parameters:
        owner: neat
calibration:
  status: ready
  source:
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/500803386
    sha256: e412f8ed3d7ff8238eface1337c46bdf874180d85b7d68dcbe2508222e7ba98f
    size_bytes: 55112720
    media_type: application/x-npz
surgery:
  type: python
  entrypoint: surgery.py:prepare_model
  parameters:
    source_boundary: already_finalized_raw_heads
    input_name: images
    input_shape: [1, 3, 320, 320]
    output_order: "loc[0..5],confidence[0..5]"
    source_archive_sha256: 8dade970d957ae5cb8b47e9fcefbe124e40b38c8641e484d2ab15b81d9b5126f
    int8_negligible_weight_floor: 0.0001
    int8_stabilized_weight_channels: 865
compile_variants:
  - id: modalix_int8_tess_mla
    target: modalix
    recipe: compile.py
    status: unsupported
    reason: Model Compiler 2.1.3 pure W8A8 PTQ misses the shared quality gate after 128-image SmoothQuant and iterative bias correction (cosine 0.94209 < 0.98; normalized RMSE 0.33537 > 0.20).
    parameters:
      precision: int8
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: min_max
      calibration_samples: 128
      requantization: sima
      smooth_quant: true
      bias_correction: iterative
      tessellation_mla: true
  - id: modalix_int8_tess_off_mla
    target: modalix
    recipe: compile.py
    status: unsupported
    reason: Model Compiler 2.1.3 pure W8A8 PTQ misses the shared quality gate after 128-image SmoothQuant and iterative bias correction (cosine 0.94209 < 0.98; normalized RMSE 0.33537 > 0.20).
    parameters:
      precision: int8
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: min_max
      calibration_samples: 128
      requantization: sima
      smooth_quant: true
      bias_correction: iterative
      tessellation_mla: false
  - id: modalix_bf16_tess_mla
    target: modalix
    recipe: compile.py
    parameters:
      precision: bf16
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
      tessellation_mla: true
  - id: modalix_bf16_tess_off_mla
    target: modalix
    recipe: compile.py
    parameters:
      precision: bf16
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
      tessellation_mla: false
tests:
  correctness:
    - id: coco_val2017_quantization
      config: tests/correctness.yaml
  performance:
    - id: modalix_latency
      config: tests/performance.yaml
maturity: experimental
