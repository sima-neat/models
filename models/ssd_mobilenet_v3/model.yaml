id: ssd_mobilenet_v3
display_name: SSD-MobileNet V3 Large
description: An SSDLite COCO detector built on MobileNet V3 Large.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: ssd_mobilenet
owners:
- '@sima-neat/models'
license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Exported from TorchVision SSDLite320-MobileNetV3 Large COCO_V1 weights; TorchVision is distributed under BSD-3-Clause.
upstream:
  repository: https://github.com/pytorch/vision
  revision: v0.18.1
  model_card: https://pytorch.org/vision/0.18/models/generated/torchvision.models.detection.ssdlite320_mobilenet_v3_large.html
  derived_from: https://download.pytorch.org/models/ssdlite320_mobilenet_v3_large_coco-a79551df.pth
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/502158604
    sha256: 5655500a6f5046b60c3e90b24d18d9c67977a732abeeccdbacadf9dfbce3ac5a
    size_bytes: 15784877
    media_type: application/x-gtar
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape:
        - 1
        - 3
        - 320
        - 320
        layout: NCHW
        description: RGB image after stretch resize, rescale to [0, 1], and ImageNet mean/std normalization.
      outputs:
      - name: ssd_loc_0
        dtype: float32
        shape:
        - 1
        - 24
        - 20
        - 20
        layout: NCHW
        description: Level 0 raw box encodings, six anchors and four coordinates per anchor.
      - name: ssd_loc_1
        dtype: float32
        shape:
        - 1
        - 24
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw box encodings, six anchors and four coordinates per anchor.
      - name: ssd_loc_2
        dtype: float32
        shape:
        - 1
        - 24
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw box encodings.
      - name: ssd_loc_3
        dtype: float32
        shape:
        - 1
        - 24
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw box encodings.
      - name: ssd_loc_4
        dtype: float32
        shape:
        - 1
        - 24
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw box encodings.
      - name: ssd_loc_5
        dtype: float32
        shape:
        - 1
        - 24
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw box encodings.
      - name: ssd_confidence_0
        dtype: float32
        shape:
        - 1
        - 546
        - 20
        - 20
        layout: NCHW
        description: Level 0 raw class logits, six anchors and 91 classes per anchor.
      - name: ssd_confidence_1
        dtype: float32
        shape:
        - 1
        - 546
        - 10
        - 10
        layout: NCHW
        description: Level 1 raw class logits, six anchors and 91 classes per anchor.
      - name: ssd_confidence_2
        dtype: float32
        shape:
        - 1
        - 546
        - 5
        - 5
        layout: NCHW
        description: Level 2 raw class logits.
      - name: ssd_confidence_3
        dtype: float32
        shape:
        - 1
        - 546
        - 3
        - 3
        layout: NCHW
        description: Level 3 raw class logits.
      - name: ssd_confidence_4
        dtype: float32
        shape:
        - 1
        - 546
        - 2
        - 2
        layout: NCHW
        description: Level 4 raw class logits.
      - name: ssd_confidence_5
        dtype: float32
        shape:
        - 1
        - 546
        - 1
        - 1
        layout: NCHW
        description: Level 5 raw class logits.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: resize
      parameters:
        height: 320
        width: 320
        preserve_aspect_ratio: false
        resample: bilinear
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: normalize
      parameters:
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
    - op: transpose
      parameters:
        from: HWC
        to: CHW
  postprocessing:
    pipeline:
    - op: ssd_decode
      parameters:
        owner: neat
        head_order: loc[0..5],confidence[0..5]
        classes_per_anchor: 91
        coordinates_per_anchor: 4
    - op: non_maximum_suppression
      parameters:
        owner: neat
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters:
      architecture: torchvision.ssdlite320_mobilenet_v3_large
      bundle_schema_version: 1
      bf16_source: ssd_mobilenet_v3_torchvision_fp32.onnx
      int8_source: ssd_mobilenet_v3_torchvision_qat_int8.onnx
      input_name: images
      input_shape:
      - 1
      - 3
      - 320
      - 320
      output_order: loc[0..5],confidence[0..5]
  recipe: scripts/compile.py
resources: []
calibrations:
- id: default
  status: ready
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/500803386
    sha256: e412f8ed3d7ff8238eface1337c46bdf874180d85b7d68dcbe2508222e7ba98f
    size_bytes: 55112720
    media_type: application/x-npz
build_profiles:
- id: w8a8
  target: modalix
  components:
  - id: model
    parameters:
      precision: w8a8
      quantization_method: qat
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: min_max
      calibration_samples: 128
      requantization: sima
    calibration: default
- id: w16a16
  target: modalix
  components:
  - id: model
    parameters:
      precision: w16a16
      quantization_method: ptq
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
    calibration: default
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
- id: default
  default: true
  components:
  - model
  resources: []
  build_profiles:
  - w8a8
  - w16a16
  composition: default
fidelity: []
accuracy:
- id: coco_val2017_quantization
  scope:
    type: component
    component: model
  build_profiles:
  - w8a8
  - w16a16
  status: pending_hardware_qualification
  reference: onnx_precision_source_raw_heads
  dataset: coco_val2017
  calibration_samples: 128
  validation_samples: 32
  split: category_balanced_and_disjoint
  metrics:
  - raw_head_cosine_similarity
  - raw_head_normalized_root_mean_square_error
  - decoded_detection_recall_at_0_5_iou
  - decoded_detection_mean_matched_iou
  compiler_raw_head_thresholds:
    w8a8:
      minimum_cosine_similarity: 0.98
      maximum_normalized_root_mean_square_error: 0.2
    w16a16:
      minimum_cosine_similarity: 0.999
      maximum_normalized_root_mean_square_error: 0.05
  source_qat_accuracy_gate:
    baseline: torchvision_ssdlite320_mobilenet_v3_large_coco_v1_fp32
    training_dataset: coco_train2017_full
    evaluation_dataset: coco_val2017_full
    metric: bbox_ap_0_50_0_95
    maximum_ap_drop_points: 1.5
    observed:
      fp32_ap: 0.21268746106494976
      qat_ap: 0.20692254686472816
      ap_drop_points: 0.5764914200221599
      passed: true
  note: The QAT source is full-COCO accuracy-gated before bundling; compiled raw-head quality is independently gated, while
    decoded accuracy and performance remain pending Modalix hardware qualification.
published_metrics:
- source: https://github.com/pytorch/vision/blob/126fc22ce33e6c2426edcf9ed540810c178fe9ce/torchvision/models/detection/ssdlite.py
  dataset: {id: coco-2017, split: val}
  conditions: 320x320, torchvision COCO_V1 weights
  metrics: {coco_map: 0.213}
benchmark:
- id: modalix_latency
  scope:
    type: component
    component: model
  build_profiles:
  - w8a8
  - w16a16
  status: pending
  target: modalix
  reason: Establish a Core API baseline for the default MPK workload.
  metrics:
  - latency_avg_ms
  - throughput_fps
  - avg_power_watts
  - energy_joules
  - energy_per_inference_joules
maturity: experimental
