display_name: SSD-MobileNet V3 Large
description: An SSDLite COCO detector built on MobileNet V3 Large.
model_type: vision
tasks: [object_detection]
modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]
architecture: ssd_mobilenet
license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Exported from TorchVision SSDLite320-MobileNetV3 Large COCO_V1 weights; TorchVision is distributed
    under BSD-3-Clause.
upstream:
  repository: https://github.com/pytorch/vision
  revision: v0.18.1
  model_card: https://pytorch.org/vision/0.18/models/generated/torchvision.models.detection.ssdlite320_mobilenet_v3_large.html
  derived_from: https://download.pytorch.org/models/ssdlite320_mobilenet_v3_large_coco-a79551df.pth
components:
- id: model
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/502158604
    sha256: 5655500a6f5046b60c3e90b24d18d9c67977a732abeeccdbacadf9dfbce3ac5a
    size_bytes: 15784877
    media_type: application/x-gtar
  format: onnx
calibrations:
- id: default
  status: ready
  source:
    type: file
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/500803386
    sha256: e412f8ed3d7ff8238eface1337c46bdf874180d85b7d68dcbe2508222e7ba98f
    size_bytes: 55112720
    media_type: application/x-npz
build_profiles:
- id: w8a8
  components:
  - id: model
    parameters:
      precision: w8a8
      quantization_method: qat
      activation_quantization: asymmetric_per_tensor_8bit
      weight_quantization: symmetric_per_channel_8bit
      calibration_method: min_max
      calibration_samples: 128
      requantization: sima
      quantization_quality_thresholds:
        minimum_cosine_similarity: 0.98
        maximum_normalized_root_mean_square_error: 0.2
    calibration: default
- id: w16a16
  components:
  - id: model
    parameters:
      precision: w16a16
      quantization_method: ptq
      activation_quantization: bfloat16
      weight_quantization: bfloat16
      calibration_method: mse
      calibration_samples: 128
      requantization: sima
      quantization_quality_thresholds:
        minimum_cosine_similarity: 0.999
        maximum_normalized_root_mean_square_error: 0.05
    calibration: default
accuracy:
- id: coco_val2017_quantization
  scope:
    type: component
    component: model
  build_profiles: [w8a8, w16a16]
  status: pending_hardware_qualification
  reference: onnx_precision_source_raw_heads
  dataset: coco_val2017
  calibration_samples: 128
  validation_samples: 32
  split: category_balanced_and_disjoint
  metrics: [raw_head_cosine_similarity, raw_head_normalized_root_mean_square_error, decoded_detection_recall_at_0_5_iou,
    decoded_detection_mean_matched_iou]
  source_qat_accuracy_gate:
    baseline: torchvision_ssdlite320_mobilenet_v3_large_coco_v1_fp32
    training_dataset: coco_train2017_full
    evaluation_dataset: coco_val2017_full
    metric: bbox_ap_0_50_0_95
    maximum_ap_drop_points: 1.5
    observed:
      fp32_ap: 0.21268746106494976
      qat_ap: 0.20692254686472816
      ap_drop_points: 0.5764914200221599
      passed: true
  note: The QAT source is full-COCO accuracy-gated before bundling; compiled raw-head quality is independently gated,
    while decoded accuracy and performance remain pending Modalix hardware qualification.
published_metrics:
- source: https://github.com/pytorch/vision/blob/126fc22ce33e6c2426edcf9ed540810c178fe9ce/torchvision/models/detection/ssdlite.py
  dataset:
    id: coco-2017
    split: val
  conditions: 320x320, torchvision COCO_V1 weights
  metrics:
    coco_map: 0.213
benchmark: true
