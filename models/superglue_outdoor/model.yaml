display_name: SuperGlue Outdoor
description: Matches keypoints between two outdoor images, taking SuperPoint keypoints and descriptors as input.
model_type: vision
tasks: [feature_matching]

modalities:
  inputs: [keypoints, embeddings]
  outputs: [keypoint_matches]

architecture: superglue

# The Magic Leap license allows noncommercial research only and no redistribution. This entry is approved
# for internal use only.
license:
  spdx: LicenseRef-MagicLeap-Noncommercial-Research
  redistribution: restricted
  attribution: SuperGlue is developed by Magic Leap, Inc.; internal use only, under SiMa.ai's approval of the Magic Leap terms.

upstream:
  repository: https://huggingface.co/magic-leap-community/superglue_outdoor
  revision: f4041f88aa6789c46558efaafc98316c6b58a382
  derived_from: https://github.com/magicleap/SuperGluePretrainedNetwork

conversion:
  source:
    uri: hf://models/magic-leap-community/superglue_outdoor@f4041f88aa6789c46558efaafc98316c6b58a382/model.safetensors
    sha256: 9bf0577b46cd76feedbc1e6908f56e10b7d92212d33338086c9156d0287d6e38
    size_bytes: 53413232
  outputs: [weights.pth]

compilation:
  format: onnx
  source: conversion

calibrations:
- id: yfcc100m-keypoints-cal
  dataset: {id: yfcc100m-keypoints, variant: cal, sha256: 086ab34feec1f7aa364d56d7e71fc4ba5c0269af5bc708ba3ed3d4eb6bf0592a, size_bytes: 120522685}

build_profiles:
  # W8A8 whose attention, residual sums, keypoint encoders and final scores run BF16; surgery.BF16_REGIONS lists
  # each region's operations. The remaining convolutions keep INT8 weights and activations.
  w8a8_mixed:
    calibration_dataset: yfcc100m-keypoints-cal
    components:
      model:
        parameters:
          precision: w8a8
          calibration_bins: 2048
          calibration_samples: 20
          bf16_regions: [attention, residual, encoder, outputs]

  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  # No w8a8: it keeps 64.1% of FP32's best matches at the compile gate against w8a8_mixed's 92.6%, and on CI's DevKit
  # it ran no faster, 151.4 FPS against 150.8. Its accuracy run took about 600 ms a pair against w16a16's 185 ms and
  # did not finish within the benchmark job's 45 minutes. compile.py keeps its recipe.
  # w8a8:
  #   calibration_dataset: yfcc100m-keypoints-cal
  #   components:
  #     model:
  #       parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 20}

  # W8A16 passes the compile gate (96.9% of FP32's best matches), but Model Compiler 3.0.0's simulator check rejects
  # it ("Check FAILED", no MPK) with per-token quantization on, and every push would retry the failing compile.
  # compile.py keeps its recipe; uncomment the profile once the check passes.
  # w8a16:
  #   components:
  #     model:
  #       parameters: {precision: w8a16}

accuracy:
  datasets:
  - {id: yfcc100m-keypoints, variant: val, sha256: 0ffdbdb0de66b9da22801e47cd588266691d8756ae990b8989e694e88e3b6a66, size_bytes: 713935383}

performance: {}

# No published score is comparable to this package. SuperGlue's YFCC100M table scored up to 2048 SuperPoint keypoints
# per image at a 1600-pixel longer side; this package matches 512 keypoints from a 640x480 image, and no source
# publishes a score at that setting. scripts/fp32_baseline_accuracy.py measures the FP32 baseline on this
# package's own inputs instead, on the ONNX surgery.py exports from the converted weights.
reference_metrics:
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset: {id: yfcc100m-keypoints, split: val}
  conditions: FP32 ONNX on ONNX Runtime CPU; 512 SuperPoint keypoints per image from the image stretched to 640x480 without keeping its aspect ratio, threshold 0.0005 and NMS radius 4 (match_pairs.py uses 0.005 and 3); 20 Sinkhorn iterations, 0.2 match threshold; 3978 of 4000 pairs
  metrics: {pose_auc_5: 0.2865, pose_auc_10: 0.4927, pose_auc_20: 0.6806, match_precision: 0.9738, matching_score: 0.2783}

# The published table, kept for reference and not shown:
# reference_metrics:
# - source: https://github.com/magicleap/SuperGluePretrainedNetwork/blob/39fb030dab0d976fe25fd2feed55e3ad0d3908dc/README.md
#   dataset: {id: yfcc100m, split: test}
#   conditions: FP32, up to 2048 SuperPoint keypoints per image at a 1600-pixel longer side (match_pairs.py --resize 1600 --max_keypoints 2048 --nms_radius 3)
