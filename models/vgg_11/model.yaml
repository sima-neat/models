# Temporary: CI validates but does not compile until Vulcan Model Convert publishes the ONNX pinned below.
build-on-demand: true
display_name: VGG-11
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: vgg

license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Derived from torchvision's VGG-11 ImageNet weights (IMAGENET1K_V1) as published in timm/vgg11.tv_in1k, and distributed under BSD-3-Clause.

upstream:
  repository: https://huggingface.co/timm/vgg11.tv_in1k
  revision: de67e844ca0254353694aba9167f0aac078cc29c
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/vgg.py

conversion:
  source:
    repository: timm/vgg11.tv_in1k
    revision: de67e844ca0254353694aba9167f0aac078cc29c
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 682c023808812148d4e60c76d80ad83dbeaf5d50eb1a952a0b836895003151e5, size_bytes: 531455276}
      config.json: {sha256: b64e5b6ba6289fdfe0d07e88a2ccdb756b8ee0b83611834f406f9a2d59f9e30a, size_bytes: 567}

compilation:
  format: onnx
  # TODO(convert-pin): replace with the Vulcan Model Convert output for this branch.
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/vgg_11/eccd2d1ec4b7b007dfbb3d6f6d305572ed0e48abb783b728185da3cb40c74221/0-0/model.onnx
    sha256: eccd2d1ec4b7b007dfbb3d6f6d305572ed0e48abb783b728185da3cb40c74221
    size_bytes: 531460928

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 1000

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, center crop 0.875, bilinear, FP32
  note: timm's vgg11.tv_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.69050, top5_accuracy: 0.88630}
