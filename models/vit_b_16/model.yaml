display_name: ViT-B/16
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: vit

license:
  spdx: Apache-2.0
  redistribution: allowed
  attribution: Derived from google/vit-base-patch16-224 and distributed under Apache-2.0.

upstream:
  repository: https://huggingface.co/onnx-community/vit-base-patch16-224-ONNX
  revision: cbd8c61cf91321b8dc986b5cbf84af9db7eac1a7
  derived_from: https://huggingface.co/google/vit-base-patch16-224/tree/3f49326eb077187dfe1c2a2bb15fbd74e6ab91e3

compilation:
