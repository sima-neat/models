  source:
    uri: hf://models/onnx-community/vit-base-patch16-224-ONNX@cbd8c61cf91321b8dc986b5cbf84af9db7eac1a7/onnx/model.onnx
    sha256: 30aeac149aa5c0df9baa7bc08a90d0917d1c87e3de32e24f751f06660dc515f1
    size_bytes: 346471546

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a16:
    components:
      model:
        parameters:
          precision: w8a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/google-research/vision_transformer/blob/64801f1b3b367b3611cc27a3d45cc22870a36fb3/README.md
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224
  note: Google's expected top-1 for its ViT-B/16 -224 checkpoint (ImageNet-21k pretrained, fine-tuned on ImageNet at 224x224), which google/vit-base-patch16-224 converts. Google prints no top-5.
  metrics: {top1_accuracy: 0.812}
