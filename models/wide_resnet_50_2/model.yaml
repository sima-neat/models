display_name: Wide ResNet-50-2
description: Classifies an image into one of the 1,000 ImageNet classes.
model_type: vision
tasks: [image_classification]

modalities:
  inputs: [image]
  outputs: [class_scores]

architecture: resnet

license:
  spdx: BSD-3-Clause
  redistribution: allowed
  attribution: Derived from torchvision's Wide ResNet-50-2 ImageNet weights (IMAGENET1K_V2) as published in timm/wide_resnet50_2.tv2_in1k, and distributed under BSD-3-Clause.

upstream:
  repository: https://huggingface.co/timm/wide_resnet50_2.tv2_in1k
  revision: ffb9dc0ac74364ad268e066aa4aea75089bf383d
  derived_from: https://github.com/pytorch/vision/blob/134f6382956071833f05f072763c03f9858453f2/torchvision/models/resnet.py

conversion:
  source:
    repository: timm/wide_resnet50_2.tv2_in1k
    revision: ffb9dc0ac74364ad268e066aa4aea75089bf383d
    main_file: model.safetensors
    files:
      model.safetensors: {sha256: 3d0c6ca08444680d7d4a46f95c1fb6a54f88f0419ae7331cebaa32e47e531c98, size_bytes: 275835296}
      config.json: {sha256: 7af82d68d001075fa21570a6704af3fb9fd6e83c0d54b542a597779060d24bc6, size_bytes: 744}

compilation:
  format: onnx
  source: conversion

calibrations:
- id: imagenet-2012-cal
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}

build_profiles:
  w16a16:
    components:
      model:
        parameters:
          precision: w16a16
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]

  w8a8:
    calibration_dataset: imagenet-2012-cal
    components:
      model:
        parameters:
          precision: w8a8
          input_name: pixel_values
          input_shape: [1, 3, 224, 224]
          calibration_samples: 1000

numerical_fidelity:
  status: diagnostic
  dataset: {id: imagenet-2012, variant: cal, sha256: e6c18b281f5ac5fc7cf6d36ef9a5f486ce95eb43ead99ee8523bd8162bc49a6f, size_bytes: 112710756}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 0, samples: 50}
  outputs: [logits]

accuracy:
  datasets:
  - {id: imagenet-2012, variant: val, sha256: 018bf95eb75b8b7f1d7766303cdecf3c45ecb02ccf4cf161122ae885c4d7a36f, size_bytes: 6666407650}

performance: {}

reference_metrics:
- source: https://github.com/huggingface/pytorch-image-models/blob/c709c9a4a26af45d01221caadfdc6b00a9622630/results/results-imagenet.csv
  dataset: {id: imagenet-2012, split: val}
  conditions: 224x224, test crop 0.965, bilinear, FP32
  note: timm's wide_resnet50_2.tv2_in1k row, scored on all 50,000 validation images.
  metrics: {top1_accuracy: 0.81612, top5_accuracy: 0.95766}
