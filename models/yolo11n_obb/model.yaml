display_name: YOLO11n-obb
description: The smallest YOLO11 oriented-box detector for the 15 DOTA aerial object classes.
model_type: vision
tasks: [oriented_object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: yolo

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO11 is developed by Ultralytics and distributed under AGPL-3.0.

# Ultralytics publishes the YOLO11 OBB checkpoints only as GitHub release assets (ultralytics/assets v8.3.0),
# which the registry does not accept as sources; conversion.source will point at a byte-identical copy
# in SiMa's Hugging Face org once it is uploaded.
upstream:
  repository: https://github.com/ultralytics/assets
  revision: 0f20d143ac8f9e01322f85dcb5c10dc9b7ca1153
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

conversion:
  source:
    # TODO(#519): pin once the checkpoint is uploaded to huggingface.co/simaai (same bytes as the GitHub asset).
    uri: hf://models/simaai/TODO@TODO/yolo11n-obb.pt
    sha256: b62898ebf38940ca4df323863e45ee9d84a1a46d5d11ebdde529fb33aa9f3a32
    size_bytes: 5795654

compilation:
  format: onnx
  source:
    # TODO(#519): pin the source block printed by the Vulcan Model Convert run.
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo11n_obb/TODO/model.onnx
    sha256: TODO
    size_bytes: 0

calibrations:
- id: dota-v1-0-cal
  dataset: {id: dota-v1-0, variant: cal, sha256: c6d498eafa142ef134877bade87100fb2472b194f1fc4faffc600aa88231bbd1, size_bytes: 98562300}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: dota-v1-0-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}

accuracy:
  datasets:
  - {id: dota-v1-0, variant: val, sha256: abeff63703f14da97d8e2033c67accacb88b732ce4ada940feddfeeac8f94a37, size_bytes: 327598055}

performance: {}

reference_metrics:
- source: https://github.com/ultralytics/ultralytics/blob/d73ffc6773cb5a44f762d9e46d6a95d2e1664f02/docs/macros/yolo-obb-perf.md
  dataset: {id: dota-v1-0, split: test}
  conditions: 1024x1024, single-model multiscale, merged tiles scored by the DOTA evaluation server
  note: The DOTA-v1.0 test labels are not public, so the measured scores use the val split at a single scale and are not directly comparable.
  metrics: {dota_obb_map50: 0.784}
