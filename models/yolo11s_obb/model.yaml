display_name: YOLO11s-obb
description: A compact YOLO11 oriented-box detector for the 15 DOTA aerial object classes.
model_type: vision
tasks: [oriented_object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: yolo11_obb

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO11 is developed by Ultralytics and distributed under AGPL-3.0.

upstream:
  repository: https://github.com/ultralytics/assets
  revision: 0f20d143ac8f9e01322f85dcb5c10dc9b7ca1153
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

resources:
  license:
    source:
      uri: https://raw.githubusercontent.com/ultralytics/ultralytics/f2d3aed634a5b0e4828024718d4a61ab2f83fb19/LICENSE
      sha256: 0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0
      size_bytes: 34523
    install_path: licenses/LICENSE

conversion:
  source:
    # Ultralytics/YOLO11 on Hugging Face has no OBB checkpoints; use the official upstream release asset.
    uri: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s-obb.pt
    sha256: 43fa63102922e0701501241b307420d24fc55e080816888b18bf8c6f96b1a45a
    size_bytes: 19934534

compilation:
  format: onnx
  source: conversion

calibrations:
- id: dota-v1-0-cal
  dataset: {id: dota-v1-0, variant: cal, sha256: c6d498eafa142ef134877bade87100fb2472b194f1fc4faffc600aa88231bbd1, size_bytes: 98562300}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: dota-v1-0-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 20}

accuracy:
  datasets:
  - {id: dota-v1-0, variant: val, sha256: abeff63703f14da97d8e2033c67accacb88b732ce4ada940feddfeeac8f94a37, size_bytes: 327598055}

performance: {}

reference_metrics:
- source: https://github.com/ultralytics/ultralytics/blob/d73ffc6773cb5a44f762d9e46d6a95d2e1664f02/docs/macros/yolo-obb-perf.md
  dataset: {id: dota-v1-0, split: test}
  conditions: 1024x1024, single-model multiscale, merged tiles scored by the DOTA evaluation server
  note: The DOTA-v1.0 test labels are not public, so the measured scores use the val split at a single scale and are not directly comparable.
  metrics: {dota_obb_map50: 0.795}
