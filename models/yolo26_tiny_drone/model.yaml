    sha256: 2627762fc29dbd377a3f471a3ab0407569dd39c13cd324d46ca426629ec80f66
    size_bytes: 2798186
    media_type: application/onnx
  interface:
    format: onnx
    opset: 17
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape:
        - 1
        - 3
        - 1600
        - 1600
        layout: NCHW
        description: RGB letterboxed image normalized to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape:
        - 1
        - 4
        - 400
        - 400
        layout: NCHW
      - name: bbox_1
        dtype: float32
        shape:
        - 1
        - 4
        - 200
        - 200
        layout: NCHW
      - name: bbox_2
        dtype: float32
        shape:
        - 1
        - 4
        - 100
        - 100
        layout: NCHW
      - name: bbox_3
        dtype: float32
        shape:
        - 1
        - 4
        - 50
        - 50
        layout: NCHW
      - name: class_logit_0
        dtype: float32
        shape:
        - 1
        - 1
        - 400
        - 400
        layout: NCHW
      - name: class_logit_1
        dtype: float32
        shape:
        - 1
        - 1
        - 200
        - 200
        layout: NCHW
      - name: class_logit_2
        dtype: float32
        shape:
        - 1
        - 1
        - 100
        - 100
        layout: NCHW
      - name: class_logit_3
        dtype: float32
        shape:
        - 1
        - 1
        - 50
        - 50
        layout: NCHW
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters:
        color_space: RGB
    - op: letterbox
      parameters:
        width: 1600
        height: 1600
        fill: 114
        resample: bilinear
    - op: rescale
      parameters:
        factor: 0.00392156862745098
    - op: transpose
      parameters:
        from: HWC
        to: CHW
  postprocessing:
    pipeline:
    - op: yolo26_boxdecode
      parameters:
        num_classes: 1
        strides:
        - 4
        - 8
        - 16
        - 32
        target_class_id: 0
        score_threshold: 0.05
        nms_iou_threshold: 0.6
