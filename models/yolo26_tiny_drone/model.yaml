schema_version: 1
id: yolo26_tiny_drone
display_name: YOLO26n-P2 Tiny Drone INT8 QAT
description: One-class 1600px YOLO26n-P2 detector trained and quantization-aware trained for tiny drones.
owners:
  - "@sima-neat/models"
license:
  spdx: LicenseRef-SiMa-Internal
  redistribution: restricted
  attribution: Internal Anti-UAV-derived training asset; do not redistribute source or calibration images.
source:
  uri: https://api.github.com/repos/sima-neat/models/releases/assets/508126877
  sha256: 2627762fc29dbd377a3f471a3ab0407569dd39c13cd324d46ca426629ec80f66
  size_bytes: 2798186
  media_type: application/onnx
upstream:
  repository: https://github.com/wish44165/YOLOv12-BoT-SORT-ReID
  revision: 2627762fc29dbd377a3f471a3ab0407569dd39c13cd324d46ca426629ec80f66
  model_card: https://github.com/sima-neat/models/pull/27
  derived_from: https://github.com/ultralytics/ultralytics
interface:
  format: onnx
  opset: 17
  inputs:
    - name: images
      dtype: float32
      shape: [1, 3, 1600, 1600]
      layout: NCHW
      description: RGB letterboxed image normalized to [0, 1].
  outputs:
    - {name: bbox_0, dtype: float32, shape: [1, 4, 400, 400], layout: NCHW}
    - {name: bbox_1, dtype: float32, shape: [1, 4, 200, 200], layout: NCHW}
    - {name: bbox_2, dtype: float32, shape: [1, 4, 100, 100], layout: NCHW}
    - {name: bbox_3, dtype: float32, shape: [1, 4, 50, 50], layout: NCHW}
    - {name: class_logit_0, dtype: float32, shape: [1, 1, 400, 400], layout: NCHW}
    - {name: class_logit_1, dtype: float32, shape: [1, 1, 200, 200], layout: NCHW}
    - {name: class_logit_2, dtype: float32, shape: [1, 1, 100, 100], layout: NCHW}
    - {name: class_logit_3, dtype: float32, shape: [1, 1, 50, 50], layout: NCHW}
preprocessing:
  pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 1600, height: 1600, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
postprocessing:
  pipeline:
    - op: yolo26_boxdecode
      parameters:
        num_classes: 1
        strides: [4, 8, 16, 32]
        target_class_id: 0
        score_threshold: 0.05
        nms_iou_threshold: 0.60
calibration:
  status: ready
  source:
    uri: https://api.github.com/repos/sima-neat/models/releases/assets/508126878
    sha256: 8418b35d20ced1a9135eb8862e5554544f261023963ec6290e587057d2b11b2b
    size_bytes: 5990892
    media_type: application/gzip
surgery:
  type: none
compile_variants:
  - id: modalix_int8_tessellation_mla
    target: modalix
    recipe: compile.py
    parameters:
      precision: int8
      tessellation_owner: mla
      model_size: 1600
      calibration_samples: 128
      calibration_tensor_sha256: d8830d19b33fe336c5c2cec4822c3b278be4169d125ca249be476771be5b544e
      expected_convolutions: 129
      quantized_source:
        uri: https://api.github.com/repos/sima-neat/models/releases/assets/508162355
        sha256: 9d8444f989563e71f32ab2569f4f49e02607036b92c376f0c64b79e3ac4530cc
        size_bytes: 9644979
        media_type: application/gzip
tests:
  correctness:
    - id: multiuav_tiny_drone_accuracy
      config: tests/correctness.yaml
  performance:
    - id: modalix_tracker_latency
      config: tests/performance.yaml
maturity: staging
