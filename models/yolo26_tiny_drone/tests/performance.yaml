schema_version: 1
status: qualified_reference
target: modalix
configuration:
  input_shape: [1, 3, 1600, 1600]
  precision: int8
  tessellation_owner: mla
  tracker_profile: tiny_drone
benchmark:
  mode: bounded_runner
  warmup_samples: 10
  samples: 100
  trials: 3
  include_plugin_latency: false
  original_width: 1280
  original_height: 720
model_options:
  preprocess:
    kind: pyneat:InputKind.Image
    enable: pyneat:AutoFlag.On
    color_convert:
      input_format: pyneat:PreprocessColorFormat.BGR
    preset: pyneat:NormalizePreset.COCO_YOLO
  decode_type: pyneat:BoxDecodeType.YoloV26
  decode_type_option: pyneat:BoxDecodeTypeOption.GroupedByRoleLogit
  num_classes: 1
  score_threshold: 0.05
  nms_iou_threshold: 0.60
  top_k: 100
metrics:
  - model_inference_latency_ms
  - preprocessing_latency_ms
  - boxdecode_latency_ms
  - tracking_latency_ms
  - overlay_latency_ms
  - end_to_end_latency_ms
note: Benchmark the fused image preprocessing and YOLOv26 BoxDecode route used by the application.
