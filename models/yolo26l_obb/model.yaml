# A build profile of this model compiles for over 20 minutes, so it builds only on request.
build-on-demand: true
display_name: YOLO26l-obb
description: A large YOLO26 oriented-box detector for the 15 DOTA aerial object classes.
model_type: vision
tasks: [oriented_object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: yolo26_obb

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.

upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

resources:
  license:
    source:
      uri: https://raw.githubusercontent.com/ultralytics/ultralytics/f2d3aed634a5b0e4828024718d4a61ab2f83fb19/LICENSE
      sha256: 0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0
      size_bytes: 34523
    install_path: licenses/LICENSE

conversion:
  source:
    uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26l-obb.pt
    sha256: 8674b0c24bf68aab5eb45009e0ac3808ce432237edf8cb5c50ae2191cb263a2b
    size_bytes: 57263057

compilation:
  format: onnx
  source: conversion

calibrations:
- id: dota-v1-0-cal
  dataset: {id: dota-v1-0, variant: cal, sha256: c6d498eafa142ef134877bade87100fb2472b194f1fc4faffc600aa88231bbd1, size_bytes: 98562300}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: dota-v1-0-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}

  w8a16:
    components:
      model:
        parameters: {precision: w8a16}

accuracy:
  datasets:
  - {id: dota-v1-0, variant: val, sha256: abeff63703f14da97d8e2033c67accacb88b732ce4ada940feddfeeac8f94a37, size_bytes: 327598055}

performance: {}

reference_metrics:
- source: https://github.com/ultralytics/ultralytics/blob/f2d3aed634a5b0e4828024718d4a61ab2f83fb19/docs/en/models/yolo26.md
  dataset: {id: dota-v1-0, split: test}
  conditions: 1024x1024, single-model multiscale, NMS-free one-to-one head, scored by the DOTA evaluation server
  note: accuracy.py scores single-scale tiles of the val split, so these test-split scores are not directly comparable.
  metrics: {dota_obb_map: 0.56, dota_obb_map50: 0.814}
