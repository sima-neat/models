display_name: YOLO26m-pose
description: A mid-size YOLO26 pose estimator for people and their 17 COCO keypoints.
model_type: vision
tasks: [pose_estimation]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores, landmarks]

architecture: yolo

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.

upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

conversion:
  source:
    uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26m-pose.pt
    sha256: 2fbf16367022256a226035695c5c389384c6706e8bb8ab8fcd0e7976f05443c4
    size_bytes: 49036866

compilation:
  format: onnx
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26m_pose/bbaf85e72b4f9fba241b7178cb853271f9914e392d06dd6f0149278d1de65d1d/38162923168-1/model.onnx
    sha256: bbaf85e72b4f9fba241b7178cb853271f9914e392d06dd6f0149278d1de65d1d
    size_bytes: 86555931

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: coco-2017-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 50}

  w8a16:
    components:
      model:
        parameters: {precision: w8a16, per_token: true}

accuracy:
  # The reference uses padded rectangular batches; accuracy.py runs a square 640x640 input.
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://huggingface.co/Ultralytics/YOLO26/blob/070ac3c51435984d992ba92eb3f234daf4e4500d/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 640x640, NMS-free one-to-one head
  note: The YOLO26 paper prints 0.899 keypoint AP50; this card is pinned to the released weights.
  metrics: {coco_keypoint_map: 0.688, coco_keypoint_ap50: 0.896}
