id: yolo26m_pose
display_name: YOLO26m-pose
description: A mid-size YOLO26 pose estimator for people and their 17 COCO keypoints.
model_type: vision
tasks:
- pose_estimation
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
  - landmarks
architecture:
  id: yolo
owners:
- '@sima-neat/models'
license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.
upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  model_card: https://huggingface.co/Ultralytics/YOLO26
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19
conversion:
  default:
    source:
      type: file
      uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26m-pose.pt
      sha256: 2fbf16367022256a226035695c5c389384c6706e8bb8ab8fcd0e7976f05443c4
      size_bytes: 49036866
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26m_pose/bbaf85e72b4f9fba241b7178cb853271f9914e392d06dd6f0149278d1de65d1d/38162923168-1/model.onnx
    sha256: bbaf85e72b4f9fba241b7178cb853271f9914e392d06dd6f0149278d1de65d1d
    size_bytes: 86555931
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 640, 640]
        layout: NCHW
        description: RGB image letterboxed to 640x640 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 80, 80]
        layout: NCHW
        description: Box side distances in grid cells, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 40, 40]
        layout: NCHW
        description: Box side distances in grid cells, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 20, 20]
        layout: NCHW
        description: Box side distances in grid cells, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 1, 80, 80]
        layout: NCHW
        description: Person logit, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 1, 40, 40]
        layout: NCHW
        description: Person logit, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 1, 20, 20]
        layout: NCHW
        description: Person logit, stride 32.
      - name: keypoint_0
        dtype: float32
        shape: [1, 51, 80, 80]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 8.
      - name: keypoint_1
        dtype: float32
        shape: [1, 51, 40, 40]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 16.
      - name: keypoint_2
        dtype: float32
        shape: [1, 51, 20, 20]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 32.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 640, height: 640, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
build_profiles:
- id: modalix_bf16
  target: modalix
  components:
  - id: model
    artifact_suffix: bf16
    parameters:
      precision: bf16
- id: modalix_int8
  target: modalix
  components:
  - id: model
    artifact_suffix: int8_mse_h2048_bcr
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 2048
      calibration_samples: 50
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
- id: default
  default: true
  components: [model]
  resources: []
  build_profiles: [modalix_bf16, modalix_int8]
  composition: default
  maturity: experimental
fidelity: []
