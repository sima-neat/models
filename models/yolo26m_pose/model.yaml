  dataset:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
  metrics: [coco_keypoint_map, coco_keypoint_ap50, coco_keypoint_ap75, coco_keypoint_ap_medium, coco_keypoint_ap_large,
    coco_keypoint_ar, coco_keypoint_ar50, coco_keypoint_ar75, coco_keypoint_ar_medium, coco_keypoint_ar_large,
    coco_person_box_map, coco_person_box_ap50]
  required_metrics: [coco_keypoint_map]
