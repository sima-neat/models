      size_bytes: 5544453
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26n/1746e6f7199c3590ffb7b9f789aafda69bcae194a6f8458dbfa9ea6a7f6caf5a/38121683651-1/model.onnx
    sha256: 1746e6f7199c3590ffb7b9f789aafda69bcae194a6f8458dbfa9ea6a7f6caf5a
    size_bytes: 9917015
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 640, 640]
        layout: NCHW
        description: RGB image letterboxed to 640x640 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 80, 80]
        layout: NCHW
        description: Box side distances in grid cells, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 40, 40]
        layout: NCHW
        description: Box side distances in grid cells, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 20, 20]
        layout: NCHW
        description: Box side distances in grid cells, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 80, 80, 80]
        layout: NCHW
        description: COCO class logits, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 80, 40, 40]
        layout: NCHW
        description: COCO class logits, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 80, 20, 20]
        layout: NCHW
        description: COCO class logits, stride 32.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 640, height: 640, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
