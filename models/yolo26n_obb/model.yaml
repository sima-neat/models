id: yolo26n_obb
display_name: YOLO26n-obb
description: The smallest YOLO26 oriented-box detector for the 15 DOTA aerial object classes.
model_type: vision
tasks:
- oriented_object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: yolo_26
  variant: n_dota_obb_1024x1024
owners:
- '@sima-neat/models'
license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.
upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  model_card: https://huggingface.co/Ultralytics/YOLO26
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19
conversion:
  default:
    source:
      type: file
      uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26n-obb.pt
      sha256: 6f51c78197aacda4a33be77294065a9001675fb893f56227a179731b53dbd2b0
      size_bytes: 5907357
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26n_pose/1f0c88db518e51ae1c19026b8ce1c98c9d1924c76aea8884214f8c2d8f671679/38149164186-1/model.onnx
    sha256: 1f0c88db518e51ae1c19026b8ce1c98c9d1924c76aea8884214f8c2d8f671679
    size_bytes: 12099271
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 1024, 1024]
        layout: NCHW
        description: RGB image tile letterboxed to 1024x1024 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 128, 128]
        layout: NCHW
        description: Box side distances in grid cells, left, top, right and bottom in the box's rotated frame, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 64, 64]
        layout: NCHW
        description: Box side distances in grid cells, left, top, right and bottom in the box's rotated frame, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 32, 32]
        layout: NCHW
        description: Box side distances in grid cells, left, top, right and bottom in the box's rotated frame, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 15, 128, 128]
        layout: NCHW
        description: Logits of the 15 DOTA-v1.0 classes, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 15, 64, 64]
        layout: NCHW
        description: Logits of the 15 DOTA-v1.0 classes, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 15, 32, 32]
        layout: NCHW
        description: Logits of the 15 DOTA-v1.0 classes, stride 32.
      - name: angle_0
        dtype: float32
        shape: [1, 1, 128, 128]
        layout: NCHW
        description: Box rotation in radians, stride 8.
      - name: angle_1
        dtype: float32
        shape: [1, 1, 64, 64]
        layout: NCHW
        description: Box rotation in radians, stride 16.
      - name: angle_2
        dtype: float32
        shape: [1, 1, 32, 32]
        layout: NCHW
        description: Box rotation in radians, stride 32.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 1024, height: 1024, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
