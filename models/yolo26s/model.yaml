id: yolo26s
display_name: YOLO26s-det
description: Ultralytics YOLO26 Small object detection for the 80 COCO classes at 640x640.
model_type: vision
tasks:
- object_detection
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
architecture:
  id: yolo_26
  variant: n_coco_640x640
owners:
- '@sima-neat/models'
license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.
upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  model_card: https://huggingface.co/Ultralytics/YOLO26
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19
conversion:
  default:
    source:
      type: file
      uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26s.pt
      sha256: 646f8bc3fe0a656803d95c294f7852321748cb29d13466a1af8862e2db384a1b
      size_bytes: 20422725
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26s/bfd336e39c165a5cfccb0dcf26003ef24a8a0bc216bf5065ce19d5eb48016f22/38124022538-1/model.onnx
    sha256: bfd336e39c165a5cfccb0dcf26003ef24a8a0bc216bf5065ce19d5eb48016f22
    size_bytes: 38266103
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 640, 640]
        layout: NCHW
        description: RGB image letterboxed to 640x640 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 80, 80]
        layout: NCHW
        description: Box side distances in grid cells, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 40, 40]
        layout: NCHW
        description: Box side distances in grid cells, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 20, 20]
        layout: NCHW
        description: Box side distances in grid cells, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 80, 80, 80]
        layout: NCHW
        description: COCO class logits, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 80, 40, 40]
        layout: NCHW
        description: COCO class logits, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 80, 20, 20]
        layout: NCHW
        description: COCO class logits, stride 32.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 640, height: 640, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
build_profiles:
- id: modalix_bf16
  target: modalix
  components:
  - id: model
    artifact_suffix: bf16
    parameters:
      precision: bf16
- id: modalix_int8
  target: modalix
  components:
  - id: model
    artifact_suffix: int8_mse_h2048_bcr
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 2048
      calibration_samples: 50
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
