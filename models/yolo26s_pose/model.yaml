id: yolo26s_pose
display_name: YOLO26s-pose
description: A compact YOLO26 pose estimator for people and their 17 COCO keypoints.
model_type: vision
tasks:
- pose_estimation
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
  - landmarks
architecture:
  id: yolo
owners:
- '@sima-neat/models'
license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.
upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  model_card: https://huggingface.co/Ultralytics/YOLO26
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19
conversion:
  default:
    source:
      type: file
      uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26s-pose.pt
      sha256: a083adb42303728ae14c4bd6bd56d80da46f82fb2564dbd6f31dcc92ea321646
      size_bytes: 24151790
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26s_pose/af52e50bed03ef7ebdac06df4330d92051ee6e27807086265107cb74d241eb2c/38162919915-1/model.onnx
    sha256: af52e50bed03ef7ebdac06df4330d92051ee6e27807086265107cb74d241eb2c
    size_bytes: 41832552
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 640, 640]
        layout: NCHW
        description: RGB image letterboxed to 640x640 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 80, 80]
        layout: NCHW
        description: Box side distances in grid cells, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 40, 40]
        layout: NCHW
        description: Box side distances in grid cells, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 20, 20]
        layout: NCHW
        description: Box side distances in grid cells, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 1, 80, 80]
        layout: NCHW
        description: Person logit, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 1, 40, 40]
        layout: NCHW
        description: Person logit, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 1, 20, 20]
        layout: NCHW
        description: Person logit, stride 32.
      - name: keypoint_0
        dtype: float32
        shape: [1, 51, 80, 80]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 8.
      - name: keypoint_1
        dtype: float32
        shape: [1, 51, 40, 40]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 16.
      - name: keypoint_2
        dtype: float32
        shape: [1, 51, 20, 20]
        layout: NCHW
        description: 17 COCO keypoints as x and y offsets in grid cells from the cell centre and a visibility logit, interleaved per keypoint, stride 32.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 640, height: 640, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: cal
    sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1
    size_bytes: 187510866
build_profiles:
- id: w16a16
  target: modalix
  components:
  - id: model
    parameters:
      precision: bf16
- id: w8a8
  target: modalix
  components:
  - id: model
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 2048
      calibration_samples: 50
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
packages:
- id: default
  default: true
  components: [model]
  resources: []
  build_profiles: [w16a16, w8a8]
  composition: default
  maturity: experimental
fidelity: []
accuracy:
- id: coco_keypoint_accuracy
  scope: {type: package, package: default}
  build_profiles: [w16a16, w8a8]
  engine: devkit_script
  status: ready
  result_component: model
  dataset:
    id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
  metrics: [coco_keypoint_map, coco_keypoint_ap50, coco_keypoint_ap75, coco_keypoint_ap_medium, coco_keypoint_ap_large,
    coco_keypoint_ar, coco_keypoint_ar50, coco_keypoint_ar75, coco_keypoint_ar_medium, coco_keypoint_ar_large,
    coco_person_box_map, coco_person_box_ap50]
  required_metrics: [coco_keypoint_map]
  # Ultralytics scores validation images in padded rectangular batches;
