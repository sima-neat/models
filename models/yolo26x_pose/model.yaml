display_name: YOLO26x-pose
description: The largest YOLO26 pose estimator here, for people and their 17 COCO keypoints.
example_app: https://developer.sima.ai/examples/app/pose-estimation%2Fmulti-stream-pose-estimator
model_type: vision
tasks: [pose_estimation]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores, landmarks]

architecture: yolo26_pose

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.

upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

resources:
  license:
    source:
      uri: https://raw.githubusercontent.com/ultralytics/ultralytics/f2d3aed634a5b0e4828024718d4a61ab2f83fb19/LICENSE
      sha256: 0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0
      size_bytes: 34523
    install_path: licenses/LICENSE

conversion:
  source:
    uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26x-pose.pt
    sha256: 08ed9e01d22a6f248b04f2f9992016aca9a32250b9ab57057d886a09d026700d
    size_bytes: 126242553

compilation:
  format: onnx
  source: conversion

calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: coco-2017-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 20}

  w8a16:
    # Measured x86 peak: 47.04 GiB; retry on moderate (64 GiB), with ARM64 still unverified.
    runner_class: moderate
    runner_market: on-demand
    components:
      model:
        parameters: {precision: w8a16}

accuracy:
  # The reference uses padded rectangular batches; accuracy.py runs a square 640x640 input.
  datasets:
  - {id: coco-2017, variant: val, sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da, size_bytes: 898368520}

performance: {}

reference_metrics:
- source: https://huggingface.co/Ultralytics/YOLO26/blob/070ac3c51435984d992ba92eb3f234daf4e4500d/README.md
  dataset: {id: coco-2017, split: val}
  conditions: 640x640, NMS-free one-to-one head
  metrics: {coco_keypoint_map: 0.716, coco_keypoint_ap50: 0.916}
