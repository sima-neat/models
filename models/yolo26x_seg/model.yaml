id: yolo26x_seg
display_name: YOLO26x-seg
description: The largest YOLO26 instance segmenter here, for COCO objects.
model_type: vision
tasks:
- instance_segmentation
modalities:
  inputs:
  - image
  outputs:
  - bounding_boxes
  - class_scores
  - masks
architecture:
  id: yolo_26
  variant: x_coco_seg_640x640
owners:
- '@sima-neat/models'
license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLO26 is developed by Ultralytics and distributed under AGPL-3.0.
upstream:
  repository: https://huggingface.co/Ultralytics/YOLO26
  revision: 070ac3c51435984d992ba92eb3f234daf4e4500d
  model_card: https://huggingface.co/Ultralytics/YOLO26
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19
conversion:
  default:
    source:
      type: file
      uri: hf://models/Ultralytics/YOLO26@070ac3c51435984d992ba92eb3f234daf4e4500d/yolo26x-seg.pt
      sha256: 92b3de0065766a17180d6219858717dc9d03cdce8a3ca9576c97fd75aabb64f3
      size_bytes: 142129861
components:
- id: model
  role: inference
  source:
    type: file
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26x_seg/c6d41a218959188f01809383a0a6e7b136dec839b42300bb6bdf5ce901333468/38232666376-1/model.onnx
    sha256: c6d41a218959188f01809383a0a6e7b136dec839b42300bb6bdf5ce901333468
    size_bytes: 251637872
    media_type: application/onnx
  interface:
    format: onnx
    opset: 12
    entrypoints:
    - id: default
      inputs:
      - name: images
        dtype: float32
        shape: [1, 3, 640, 640]
        layout: NCHW
        description: RGB image letterboxed to 640x640 and scaled to [0, 1].
      outputs:
      - name: bbox_0
        dtype: float32
        shape: [1, 4, 80, 80]
        layout: NCHW
        description: Box side distances in grid cells, stride 8.
      - name: bbox_1
        dtype: float32
        shape: [1, 4, 40, 40]
        layout: NCHW
        description: Box side distances in grid cells, stride 16.
      - name: bbox_2
        dtype: float32
        shape: [1, 4, 20, 20]
        layout: NCHW
        description: Box side distances in grid cells, stride 32.
      - name: class_logit_0
        dtype: float32
        shape: [1, 80, 80, 80]
        layout: NCHW
        description: COCO class logits, stride 8.
      - name: class_logit_1
        dtype: float32
        shape: [1, 80, 40, 40]
        layout: NCHW
        description: COCO class logits, stride 16.
      - name: class_logit_2
        dtype: float32
        shape: [1, 80, 20, 20]
        layout: NCHW
        description: COCO class logits, stride 32.
      - name: mask_coeff_0
        dtype: float32
        shape: [1, 32, 80, 80]
        layout: NCHW
        description: Coefficients over the 32 mask prototypes, stride 8.
      - name: mask_coeff_1
        dtype: float32
        shape: [1, 32, 40, 40]
        layout: NCHW
        description: Coefficients over the 32 mask prototypes, stride 16.
      - name: mask_coeff_2
        dtype: float32
        shape: [1, 32, 20, 20]
        layout: NCHW
        description: Coefficients over the 32 mask prototypes, stride 32.
      - name: mask_proto
        dtype: float32
        shape: [1, 32, 160, 160]
        layout: NCHW
        description: Mask prototypes at stride 4; a detection's mask logits are its coefficients times these.
    shape_profiles: []
  preprocessing:
    pipeline:
    - op: decode_image
      parameters: {color_space: RGB}
    - op: letterbox
      parameters: {width: 640, height: 640, fill: 114, resample: bilinear}
    - op: rescale
      parameters: {factor: 0.00392156862745098}
    - op: transpose
      parameters: {from: HWC, to: CHW}
  postprocessing:
    pipeline: []
  surgery:
    type: python
    entrypoint: scripts/surgery.py:prepare_model
    parameters: {}
  recipe: scripts/compile.py
resources: []
calibrations:
- id: coco_images
  status: ready
  dataset:
    id: coco-2017
    variant: mini
    sha256: abb616d0eaf3d55d98d44ed092e05e2df6f87264d7f8426550d62402ef222e78
    size_bytes: 462182592
build_profiles:
- id: modalix_bf16
  target: modalix
  components:
  - id: model
    artifact_suffix: bf16
    parameters:
      precision: bf16
- id: modalix_int8
  target: modalix
  components:
  - id: model
    artifact_suffix: int8_mse_h1024_bcr
    calibration: coco_images
    parameters:
      precision: int8
      calibration_bins: 1024
      calibration_samples: 50
compositions:
- id: default
  type: single
  component: model
  entrypoint: default
