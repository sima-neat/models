  metrics: [coco_mask_map, coco_mask_ap50, coco_mask_ap75, coco_mask_ap_small, coco_mask_ap_medium,
    coco_mask_ap_large, coco_mask_ar1, coco_mask_ar10, coco_mask_ar100, coco_mask_ar_small, coco_mask_ar_medium,
