compilation:
  format: onnx
  source: conversion
  components:
  - text_encoder
  - detector
calibrations:
- id: coco-2017-cal
  dataset: {id: coco-2017, variant: cal, sha256: 54c64d84122eba371ac014d7b43849a461551c2e6c5c430b5ead90ec1dec12b1, size_bytes: 187510866}

build_profiles:
  w8a8_mixed_w16a16:
    calibration_dataset: coco-2017-cal
    components:
      text_encoder:
        parameters:
          precision: w16a16
          context_tokens: 77
      detector:
        parameters:
          precision: w8a8_mixed_w16a16
          prompt_slots: 80
          calibration_samples: 64
          calibration_method: mse
          bf16_region: projection_attention
pipeline:
- cpu: Tokenize and look up tokens
- component: text_encoder
- cpu: Normalize prompts; resize RGB
- component: detector
- cpu: DFL decode and NMS
