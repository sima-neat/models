compilation:
  format: onnx
  source: conversion
  components:
  - text_encoder
  - detector
# Calibration is the fixed class-balanced training selection in scripts/calibration_samples.py.
# Each image and prompt pairing is pinned there. Direct official COCO downloads were requested
# because local Artifactory access is unavailable; no validation image calibrates this build.
# Text uses SkipCalibration. Only the detector INT8 activation ranges are calibrated.
build_profiles:
  w8a8_mixed_w16a16:
    components:
      text_encoder:
        parameters:
          precision: w16a16
          context_tokens: 77
      detector:
        parameters:
          precision: w8a8_mixed_w16a16
          prompt_slots: 80
          calibration_samples: 128
          calibration_method: mse
          bf16_region: projection_attention
pipeline:
- cpu: Tokenize and look up tokens
- component: text_encoder
- cpu: Normalize prompts; resize RGB
- component: detector
- cpu: DFL decode and NMS
accuracy:
  datasets:
  - id: coco-2017
    variant: val
    sha256: a40de1caf42b47c5a8976eb97efe3c83f3a41337c4d16d318eb15d65c293f2da
    size_bytes: 898368520
performance:
  scope: components

reference_metrics:
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset:
    id: coco-2017
    split: val
  conditions: 640x640, all 80 COCO prompts, FP32 image detector with frozen BF16 CLIP vectors, score 0.001, class-aware NMS
    IoU 0.7, max 300 detections; ONNX Runtime CUDA with TF32 disabled
  note: Full official 5000-image validation; the same BF16 text encoder is used for the reference and mixed detector.
  metrics:
