  revision: 27f858f2dc238503a66ce10248cf7ec71a3ded5d
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

conversion:
  source:
    uri: hf://models/Ultralytics/YOLOv8@27f858f2dc238503a66ce10248cf7ec71a3ded5d/yolov8l.pt
    sha256: 18218ea4798da042d9862e6029ca9531adbd40ace19b6c9a75e2e28f1adf30cc
    size_bytes: 87769683

compilation:
  format: onnx
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolov8l/c352a88807bed8595b9d572619dbac53d7f55e3642114dc5b94196c2ac607851/39727239258-1/model.onnx
