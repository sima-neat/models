display_name: YOLOv8m-det
description: A mid-size YOLOv8 detector for COCO objects.
model_type: vision
tasks: [object_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores]

architecture: yolo

license:
  spdx: AGPL-3.0-only
  redistribution: restricted
  attribution: YOLOv8 is developed by Ultralytics and distributed under AGPL-3.0.

upstream:
  repository: https://huggingface.co/Ultralytics/YOLOv8
  revision: 27f858f2dc238503a66ce10248cf7ec71a3ded5d
  derived_from: https://github.com/ultralytics/ultralytics/tree/f2d3aed634a5b0e4828024718d4a61ab2f83fb19

conversion:
  source:
    uri: hf://models/Ultralytics/YOLOv8@27f858f2dc238503a66ce10248cf7ec71a3ded5d/yolov8m.pt
    sha256: 6c25b0b63b1a433843f06d821a9ac1deb8d5805f74f0f38772c7308c5adc55a5
    size_bytes: 52117635

compilation:
  format: onnx
  # TODO(#352): replace with the source block the Vulcan Model Convert workflow prints for yolov8m.
  source:
    uri: https://artifacts.stg.neat.sima.ai/models-onnx/yolo26n/1746e6f7199c3590ffb7b9f789aafda69bcae194a6f8458dbfa9ea6a7f6caf5a/38121683651-1/model.onnx
