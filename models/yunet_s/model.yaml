display_name: YuNet-s
description: Finds faces in an image, with a box, a score and five landmarks for each face.
model_type: vision
tasks: [face_detection, face_landmark_detection]

modalities:
  inputs: [image]
  outputs: [bounding_boxes, class_scores, landmarks]

architecture: yunet

license:
  spdx: MIT
  redistribution: allowed
  attribution: >-
    YuNet by Shiqi Yu and contributors (libfacedetection.train), released there under BSD-3-Clause and distributed
    in OpenCV Zoo under MIT; the package ships both licenses. It is trained on WIDER FACE, whose images are under
    CC BY-NC-ND 4.0, with annotations released for non-commercial research.

upstream:
  repository: https://github.com/ShiqiYu/libfacedetection.train
  revision: dca340aa082c71081a68d17db8e58b33a58a914b
  model_card: https://huggingface.co/opencv/face_detection_yunet/blob/3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/README.md

resources:
  license:
    source:
      repository: opencv/face_detection_yunet
      revision: 3cc26e7f1014a5ee5d74a42acee58bafc9d0a310
      files:
        LICENSE: {sha256: c83b8120c50ccbd4c4f96edf53141bdd566ebb8f8e9227e415326aa1b1aba958, size_bytes: 1085}
    install_path: licenses
  license_libfacedetection:
    # The compiled file is byte-identical to libfacedetection.train's onnx/yunet_s_640_640.onnx, released under
    # BSD-3-Clause, whose notice a binary redistribution must carry.
    source:
      uri: https://raw.githubusercontent.com/ShiqiYu/libfacedetection.train/dca340aa082c71081a68d17db8e58b33a58a914b/LICENSE
      sha256: e8afd9575f1cebfd20752e1f0c0981042a5526a99a5df3b926c5e05035ec4136
      size_bytes: 1542
    install_path: licenses/LICENSE-libfacedetection

compilation:
  format: onnx
  source:
    # OpenCV Zoo's copy is byte-identical to onnx/yunet_s_640_640.onnx in libfacedetection.train at the revision above.
    uri: hf://models/opencv/face_detection_yunet@3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/face_detection_yunet_2023mar.onnx
    sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    size_bytes: 232589

calibrations:
- id: wider-face-cal
  dataset: {id: wider-face, variant: cal, sha256: 1c81bfd340f0c56185afa891d801db8a22c28add383aa1e3d4a9ba5e9e9de472, size_bytes: 55679672}

build_profiles:
  w16a16:
    components:
      model:
        parameters: {precision: w16a16}

  w8a8:
    calibration_dataset: wider-face-cal
    components:
      model:
        parameters: {precision: w8a8, calibration_bins: 2048, calibration_samples: 100}

# Scored against the upstream ONNX on WIDER FACE training images after the calibration draw, the calibration archive's
# split, so no fidelity image calibrates the model.
numerical_fidelity:
  status: diagnostic
  dataset: {id: wider-face, variant: cal, sha256: 1c81bfd340f0c56185afa891d801db8a22c28add383aa1e3d4a9ba5e9e9de472, size_bytes: 55679672}
  selection: {method: seeded_random_without_replacement, seed: 42, offset: 100, samples: 8}
  outputs: [cls_8, cls_16, cls_32, obj_8, obj_16, obj_32, bbox_8, bbox_16, bbox_32, kps_8, kps_16, kps_32]

accuracy:
  datasets:
  - {id: wider-face, variant: val, sha256: 65c76aa48df0cb187dfcef497073265f0a00b68d5ea3ccba21d33d34a8fe0998, size_bytes: 364891439}

performance: {}

reference_metrics:
- origin: fp32_baseline
  script: scripts/fp32_baseline_accuracy.py
  dataset: {id: wider-face, split: val}
  conditions: FP32 ONNX on ONNX Runtime CPU; each image letterboxed to 640x640, centered and zero-padded; score threshold 0.3, NMS IoU 0.45, top 5000; 3,226 images
  metrics: {widerface_ap_easy: 0.8714, widerface_ap_medium: 0.8267, widerface_ap_hard: 0.5774}
- source: https://huggingface.co/opencv/face_detection_yunet/blob/3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/README.md
  dataset: {id: wider-face, split: val}
  conditions: each image at its own size, padded to a multiple of 32; score threshold 0.3, NMS IoU 0.45, top 5000
  note: OpenCV Zoo's evaluation of this file. This package has a fixed 640x640 input, which shrinks the small faces of WIDER FACE's 1024-pixel-wide images, so its scores are not directly comparable, most of all on the hard subset.
  metrics: {widerface_ap_easy: 0.8844, widerface_ap_medium: 0.8656, widerface_ap_hard: 0.7503}
