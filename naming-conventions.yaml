# Author reference for build profile IDs (variant IDs) and artifact_suffix;
# not loaded by compilation or validation.
# Compose tokens in this order. Add vocabulary entries when a new option is needed.
separator: "_"

variant:
  rules:
    - A variant ID is the precision token of each component, in component order. Write a repeated token once.
    - Exclude the target and every other recipe option from the variant ID.
    - When two variants of one model would share an ID, append the first artifact_suffix tokens that distinguish them.
    - Variant IDs are lowercase. The Model Browser displays them in uppercase.
  examples:
    w8a8: One component with INT8 weights and activations
    w16a16: One component with BF16 weights and activations
    w8a8_w16a16: A W8A8 backbone followed by a W16A16 transformer
order:
  - component
  - precision
  - quantization
  - calibration
  - histogram_bins
  - weight_scaling
  - requantization
  - bias_correction
  - equalization
  - smooth_quant
  - per_token
  - layout_search
  - l2_caching

rules:
  - Prefix the component ID for multi-component models; omit it for single-component models.
  - Always include precision. Tokens describe the recipe's precision policy, not every operation's measured dtype.
  - Include the calibration method for 8-bit post-training quantization; use qat for a quantization-aware-trained source.
  - Include enabled corrections and non-default compiler options. Omitted tokens do not configure defaults.
  - Include h only when the recipe explicitly selects histogram bins; do not infer compiler defaults.
  - Keep suffixes distinct across the model's downloadable component and profile combinations.
  - Exclude the target, versions, calibration sample counts, dataset identities, and selection seeds.
  - A registered token does not establish support for an option or combination in a model recipe.

tokens:
  precision:
    w8a8: INT8 weights and activations
    w16a16: BF16 weights and activations
    w8a16: INT8 weights and BF16 activations
    w4a16: INT4 weights and BF16 activations
  quantization:
    qat: Quantization-aware-trained source
  calibration:
    mse: Histogram mean squared error
    mm: MinMax
    mavg: Moving-average MinMax
    ent: Histogram entropy
  weight_scaling:
    wpt: Per-tensor integer weight scales instead of per-channel scales
  requantization:
    rqtf: TFLite requantization instead of SiMa requantization
  bias_correction:
    bcr: Regular bias correction
    bci: Iterative bias correction
  equalization:
    ce: Channel equalization
  smooth_quant:
    sq: SmoothQuant
  per_token:
    pt: Per-token dynamic quantization
  l2_caching:
    l2e: Early L2 prefetch
    l2r: Runtime L2 prefetch

numeric_tokens:
  h: Histogram bin count, such as h1024
  ls: Layout search effort level, such as ls1
  pct: Histogram percentile, using p for the decimal point, such as pct99p9; occupies the calibration position
