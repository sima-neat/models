[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-neat-benchmarker"
version = "0.0.0"
description = "Generic synthetic model benchmarker for SiMa Modalix DevKits"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
benchmarker = "benchmarker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarker*"]
namespaces = true

[tool.setuptools.package-data]
benchmarker = ["schemas/*.json"]
