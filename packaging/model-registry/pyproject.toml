[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-neat-model-registry"
version = "0.1.0"
description = "Author-safe local tooling for SiMa Neat model contributions"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2025.1.31",
  "jsonschema>=4.18.4,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
model-registry = "model_registry.cli:author_main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
model_registry = ["py.typed"]
model_report = ["metrics.json"]
