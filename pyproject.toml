[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-neat-model-registry"
version = "0.1.0"
description = "Shared lifecycle tooling for the SiMa Neat Model Registry"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2025.1.31",
  "jsonschema>=4.18.4,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
model-registry = "model_registry.cli:main"

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
model_registry = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
