
model_types:
  audio:
    display_name: Audio
  vision:
    display_name: Vision
  llm:
    display_name: LLM
  vlm:
    display_name: VLM

modalities:
  image:
    display_name: Image
  video:
    display_name: Video
  text:
    display_name: Text
  audio:
    display_name: Audio
