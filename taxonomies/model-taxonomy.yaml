    display_name: Depth Map
  embeddings:
    display_name: Embeddings
  landmarks:
    display_name: Landmarks
  keypoints:
    display_name: Keypoints

# An architecture is the network design a family is built on. Keep it coarse.
architecture_paradigms:
  cnn:
    display_name: CNN
  transformer:
    display_name: Transformer

# A family is the upstream model line, named without generation or size
# (YOLO, not YOLO26n). The model's id and display_name carry those.
architectures:
  clip:
    display_name: CLIP
    paradigm: transformer
    allowed_model_types: [vlm]
  depthart:
    display_name: DepthART
    paradigm: transformer
    allowed_model_types: [vision]
  gemma:
    display_name: Gemma
    paradigm: transformer
    allowed_model_types: [llm]
  lfm:
    display_name: LFM
    paradigm: transformer
    allowed_model_types: [llm]
  llama:
    display_name: Llama
    paradigm: transformer
    allowed_model_types: [llm]
  llava:
    display_name: LLaVA
    paradigm: transformer
    allowed_model_types: [vlm]
  mistral:
    display_name: Mistral
    paradigm: transformer
    allowed_model_types: [llm]
  phi:
    display_name: Phi
    paradigm: transformer
    allowed_model_types: [llm]
  qwen:
    display_name: Qwen
    paradigm: transformer
    allowed_model_types: [llm, vlm]
  resnet:
    display_name: ResNet
    paradigm: cnn
    allowed_model_types: [vision]
  rf_detr:
    display_name: RF-DETR
    paradigm: transformer
    allowed_model_types: [vision]
  superpoint:
    display_name: SuperPoint
    paradigm: cnn
    allowed_model_types: [vision]
  whisper:
    display_name: Whisper
    paradigm: transformer
    allowed_model_types: [audio]
  yolo:
    display_name: YOLO
    paradigm: cnn
    allowed_model_types: [vision]

