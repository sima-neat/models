    display_name: VLM

modalities:
  image:
    display_name: Image
  video:
    display_name: Video
  text:
    display_name: Text
  audio:
    display_name: Audio
  class_scores:
    display_name: Class Scores
  bounding_boxes:
    display_name: Bounding Boxes
