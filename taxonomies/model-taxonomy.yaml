    description: Detects objects with rotated bounding boxes in aerial imagery.
    paradigm: cnn
    allowed_model_types: [vision]
  yolo26_det:
    display_name: YOLO26-det
    description: Detects objects and their bounding boxes in images.
    paradigm: cnn
    allowed_model_types: [vision]
  yolo26_obb:
