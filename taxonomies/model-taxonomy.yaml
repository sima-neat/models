    description: Transcribes speech recordings into text.
    paradigm: transformer
    allowed_model_types: [audio]
  wide_resnet:
    display_name: Wide ResNet
    description: Classifies images with wider residual convolutional networks.
    paradigm: cnn
    allowed_model_types: [vision]
  yolo11_det:
    display_name: YOLO11-det
    description: Detects objects and their bounding boxes in images.
    paradigm: cnn
    allowed_model_types: [vision]
  yolo11_obb:
