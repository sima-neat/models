    paradigm: cnn
    allowed_model_types: [vision]
  yolo26_pose:
    display_name: YOLO26-pose
    description: Detects people and estimates their body keypoints in images.
    paradigm: cnn
    allowed_model_types: [vision]
  yolo26_seg:
    display_name: YOLO26-seg
    description: Detects objects and outlines each instance with a segmentation mask.
    paradigm: cnn
    allowed_model_types: [vision]
  yolov8_det:
    display_name: YOLOv8-det
    description: Detects objects and their bounding boxes in images.
    paradigm: cnn
    allowed_model_types: [vision]
  yolov8_obb:
